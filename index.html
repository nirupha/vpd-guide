<script type="text/plain" id="checksh">
#!/usr/bin/env bash
# Проверка практического экзамена по ЛР1 ВПД.
# Запуск: bash check.sh            (проверит ~/vpd-exam)
#         bash check.sh /путь/к/папке
D="${1:-$HOME/vpd-exam}"
score=0; total=0
ok()   { score=$((score + $1)); total=$((total + $1)); printf '  \033[32m✔\033[0m %s\n' "$2"; }
fail() { total=$((total + $1)); printf '  \033[31m✘\033[0m %s\n      подсказка: %s\n' "$2" "$3"; }
check() { # баллы, описание, подсказка, команда-проверка...
  local p="$1" d="$2" h="$3"; shift 3
  if "$@" >/dev/null 2>&1; then ok "$p" "$d"; else fail "$p" "$d" "$h"; fi
}
O="$D/origin.git"; W="$D/dev"; S="$D/second_dev"
echo "Проверяю $D"
echo
for x in "$O" "$W" "$S"; do
  if [ ! -d "$x" ]; then echo "Нет папки $x. Проверка имеет смысл, когда сделаны все три репозитория (задания 1–2 и 6)."; exit 1; fi
done
echo "1. Репозитории"
check 1 "origin.git это bare-репозиторий" "git init --bare ..." \
  test "$(git -C "$O" rev-parse --is-bare-repository 2>/dev/null)" = true
check 1 "HEAD в origin.git указывает на main" "--initial-branch=main при создании" \
  test "$(git -C "$O" symbolic-ref HEAD 2>/dev/null)" = refs/heads/main
check 1 "dev это клон, origin указывает на origin.git" "git clone ... origin.git dev" \
  bash -c "git -C '$W' remote get-url origin | grep -q 'origin.git'"
check 1 "second_dev это второй клон того же origin" "git clone ... origin.git second_dev" \
  bash -c "git -C '$S' remote get-url origin | grep -q 'origin.git'"
git -C "$W" fetch -q origin 2>/dev/null
git -C "$S" fetch -q origin 2>/dev/null

echo
echo "2. Коммиты и история"
n=$(git -C "$O" rev-list --count main 2>/dev/null || echo 0)
check 1 "в origin/main минимум 6 коммитов (сейчас: $n)" "делай коммит на каждый осмысленный шаг" test "$n" -ge 6
bad=$(git -C "$O" log main --format='%s' 2>/dev/null | grep -Eix '1|fix|готово|лаба|update|.{0,7}' | head -1)
check 1 "сообщения коммитов осмысленные" "плохое сообщение: «$bad»; пиши, что именно изменено" test -z "$bad"
first=$(git -C "$O" rev-list --max-parents=0 main 2>/dev/null | head -1)
check 1 "первый коммит содержит только README.md" "первым коммитом добавь только README по конкретному пути" \
  test "$(git -C "$O" show --format= --name-only "$first" 2>/dev/null)" = README.md

echo
echo "3. Программы"
check 1 "c/main.c и python/main.py есть в main" "добавь и закоммить оба файла" \
  bash -c "git -C '$O' cat-file -e main:c/main.c && git -C '$O' cat-file -e main:python/main.py"
check 1 "c/main.c собирается без предупреждений" "gcc -Wall -Wextra -pedantic c/main.c -o c/main" \
  bash -c "cd '$W' && gcc -Wall -Wextra -pedantic -Werror c/main.c -o c/main"
out=$(cd "$W" && ./c/main 2>/dev/null)
check 1 "C выводит строку Student ID с номером из двух цифр" "snprintf и %02d" \
  bash -c "printf '%s' \"\$1\" | grep -Eq 'Student ID: .+/[0-9]{2}'" _ "$out"
check 1 "C выводит control_value, кратное 304" "control_value = 304 * номер" \
  bash -c "v=\$(printf '%s' \"\$1\" | grep -Eo 'Control: [0-9]+' | grep -Eo '[0-9]+'); [ -n \"\$v\" ] && [ \$((v % 304)) -eq 0 ]" _ "$out"
check 1 "C выводит русскую строку" "строка «Привет, 304! Это ...»" \
  bash -c "printf '%s' \"\$1\" | grep -q 'Привет'" _ "$out"
pout=$(cd "$W" && python3 python/main.py 2>/dev/null)
check 1 "Python выводит три строки и число слов" "f-строки и len(name.split())" \
  bash -c "[ \$(printf '%s\n' \"\$1\" | wc -l) -ge 4 ] && printf '%s' \"\$1\" | grep -q 'Student ID'" _ "$pout"

echo
echo "4. .gitignore"
check 1 "c/main игнорируется" "добавь c/main в .gitignore" \
  bash -c "cd '$W' && git check-ignore -q c/main"
check 1 "бинарник c/main не попал в репозиторий" "git rm --cached c/main и коммит" \
  bash -c "! git -C '$O' cat-file -e main:c/main"
check 1 ".gitignore закоммичен и в нём есть комментарии" "строки с # объясняют, зачем каждое правило" \
  bash -c "git -C '$O' show main:.gitignore | grep -q '^#'"

echo
echo "5. Ветка и слияние"
check 1 "ветка feature/bash есть в origin" "git push -u origin feature/bash" \
  git -C "$O" rev-parse -q --verify refs/heads/feature/bash
check 1 "в bash/main.sh есть pipe в wc" "words=\$(echo \"\$name\" | wc -w)" \
  bash -c "git -C '$O' show main:bash/main.sh | grep -Eq '\|[[:space:]]*wc'"
check 1 "feature/bash влита в main" "git switch main && git merge feature/bash" \
  git -C "$O" merge-base --is-ancestor feature/bash main
fb=$(git -C "$O" rev-parse -q --verify feature/bash 2>/dev/null)
m=$(git -C "$O" rev-list --merges main 2>/dev/null | while read -r c; do git -C "$O" rev-list --parents -n1 "$c" | grep -q "$fb" && echo "$c"; done | head -1)
check 1 "слияние ветки сделано merge-коммитом (история расходилась)" "перед merge сделай коммит в main, чтобы был не fast-forward" test -n "$m"

echo
echo "6. Конфликт"
merges=$(git -C "$O" rev-list --merges --count main 2>/dev/null || echo 0)

function msgs(input) {
  const arr = typeof input === "string" ? [{ role: "user", content: input }] : input.map(m => ({ role: m.role, content: String(m.content) }));

async function apiCall(input) {

    }

}

function chatCall(input) {

      (AI.chat !== "other" ? '<button class="sx-btn" data-open>Открыть ' + esc(ch.name) + ' ↗</button>' : '') + '</div>' +
      '<details class="sx-det"><summary>Посмотреть запрос</summary><textarea readonly class="sx-ta sx-pre"></textarea></details>' +
      '<textarea class="sx-ta" data-ans placeholder="Вставь сюда ответ нейронки"></textarea>' +
      '<div class="sx-row"><button class="sx-btn pri" data-ok>Готово</button><button class="sx-btn" data-x>Отмена</button></div>');

    $$("[data-copy]", ov).forEach(b => b.onclick = () => copy(b.dataset.copy === "short" ? short : full));
    const ob = $("[data-open]", ov);
    if (ob) ob.onclick = () => { copy(full); const enc = encodeURIComponent(full); window.open(ch.pre && enc.length < 7000 ? ch.url(enc) : ch.url(""), "_blank", "noopener") };

function sampleFn() {
  if (AI.mode === "none") return null;
  const call = AI.mode === "api" ? apiCall : chatCall;
  const s = async (input, opts) => { const text = await call(input); if (opts && opts.onText) try { opts.onText({ text, delta: text }) } catch (e) {} return { text, truncated: false } };
  s.json = async (input) => {

    const m = t.match(/[\[{][\s\S]*[\]}]/); if (!m) throw fail("json", "Нейронка ответила не в формате JSON."); return JSON.parse(m[0]);
  };

const TR = { а: "a", б: "b", в: "v", г: "g", д: "d", е: "e", ё: "e", ж: "zh", з: "z", и: "i", й: "y", к: "k", л: "l", м: "m", н: "n", о: "o", п: "p", р: "r", с: "s", т: "t", у: "u", ф: "f", х: "kh", ц: "ts", ч: "ch", ш: "sh", щ: "shch", ъ: "", ы: "y", ь: "", э: "e", ю: "yu", я: "ya" };

        '<div class="sx-row"><button class="sx-btn" data-models>Загрузить модели</button><button class="sx-btn" data-test>Проверить</button></div><p class="sx-note" data-ares></p>';
    }
    $$("[data-a]", mb).forEach(i => { i.value = a[i.dataset.a] || ""; i.oninput = i.onchange = () => { a[i.dataset.a] = i.value.trim(); if (i.dataset.a === "prov") { a.base = ""; a.model = ""; drawAi() } } });
    const lm = $("[data-models]", mb);
    if (lm) lm.onclick = async () => {
      const pv = PROV[a.prov] || PROV.custom, base = (a.base || pv.base).replace(/\/+$/, ""), res = $("[data-ares]", mb);

    const np = { ru: clean(p.ru), en: clean(p.en).replace(/\s+/g, " "), group: clean(p.group), n: parseInt(p.n, 10), os: p.os, def: /^\d{4}-\d\d-\d\d$/.test(p.def || "") ? p.def : "" };
    const pChanged = JSON.stringify(np) !== JSON.stringify(profile);

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const C=JSON.parse($("#content").textContent);
const LESSONS=[]; C.forEach(t=>t.lessons.forEach(l=>{l.topic=t;LESSONS.push(l)}));
const DAY=864e5, INTERVALS=[1,2,4,7,14,30,60];
const NODES={};
C.forEach(t=>{const ex=(t.map&&t.map.extra)||{};for(const k in ex){NODES[k]=Object.assign({id:k,topic:t},ex[k]);NODES[k].lesson=LESSONS.find(l=>l.id===ex[k].lesson)}
  t.lessons.forEach(l=>l.steps.forEach(st=>{if(st.t==="word"&&st.node)NODES[st.node]={id:st.node,label:st.term,simple:st.simple,pro:st.pro||"",pt:st.pt||"",lesson:l,topic:t}}))});

/* ---------- словарь программиста ---------- */
const LEX=JSON.parse($("#lex").textContent);let LEXRX=[];
try{LEX.forEach((e,i)=>{e.i=i;e.lesson=LESSONS.find(l=>l.id===e.l)||null;e.rx=e.p.map(([p,f])=>new RegExp(p,"g"+f));e.rx.forEach(r=>LEXRX.push([i,r]))})}catch(err){LEXRX=[]}
const GL_SKIP="pre,textarea,input,button,a,.gl,.chip,.opt,.ord,.it,.term,.kind,.lexbox,.layers,.legend,summary,script,style";
function lexMatches(t){const ms=[];LEXRX.forEach(([i,rx])=>{rx.lastIndex=0;let m;while((m=rx.exec(t))){if(m[0].length)ms.push([m.index,m.index+m[0].length,i]);else rx.lastIndex++}});ms.sort((a,b)=>a[0]-b[0]||(b[1]-b[0])-(a[1]-a[0]));return ms}
function gloss(root,skip){if(!root||!LEXRX.length)return;const blocks=new Map();
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim().length>1&&!n.parentElement.closest(GL_SKIP)?1:2});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue,blk=n.parentElement.closest(".pro,.model,.reveal,.rv-q,.rv-a")||root;let used=blocks.get(blk);if(!used){used=new Set(skip||[]);blocks.set(blk,used)}
    const keep=[];let end=-1;lexMatches(t).forEach(m=>{if(m[0]>=end&&!used.has(m[2])){keep.push(m);end=m[1];used.add(m[2])}});
    if(!keep.length)return;const f=document.createDocumentFragment();let p=0;
    keep.forEach(([s,e,i])=>{if(s>p)f.appendChild(document.createTextNode(t.slice(p,s)));const sp=document.createElement("span");sp.className="gl";sp.dataset.g=i;sp.textContent=t.slice(s,e);f.appendChild(sp);p=e});
    if(p<t.length)f.appendChild(document.createTextNode(t.slice(p)));n.replaceWith(f)})}
function lexIn(html,skip){const d=document.createElement("div");d.innerHTML=html||"";const out=[];lexMatches(d.textContent).forEach(m=>{if(!out.includes(m[2])&&!(skip&&skip.has(m[2])))out.push(m[2])});return out}
function lexRow(i,from){const e=LEX[i];return '<button class="lexrow" data-g="'+i+'"><b>'+esc(e.k)+'</b>'+(e.d?' <span class="dd">· '+esc(e.d)+'</span>':'')+'<span class="mm">'+esc(e.m)+'</span>'+(from&&e.lesson?'<span class="from">'+esc(e.lesson.title)+'</span>':'')+'</button>'}
function firstSent(t){const m=String(t).match(/^.*?[.!?](?=\s|$)/);if(!m)return t;if(m[0].length<25){const m2=String(t).match(/^.*?[.!?](?=\s|$).*?[.!?](?=\s|$)/);if(m2)return m2[0]}return m[0]}
function lexFold(ids){if(!ids.length)return"";let open=false;try{open=localStorage.getItem("vpd1lexd")==="1"}catch(e){}
  return '<details class="lexd"'+(open?' open':'')+'><summary>'+IC.book+'<span>Что значит каждое слово</span><span class="cnt">'+ids.length+'</span>'+IC.chev+'</summary><div class="lexmini">'+ids.map(i=>'<button data-g="'+i+'"><b>'+esc(LEX[i].k)+'</b> <span>· '+esc(firstSent(LEX[i].m))+'</span></button>').join("")+'<p class="more">Нажми на слово, чтобы открыть полное объяснение.</p></div></details>'}
function lexBox(ids,title){return ids.length?'<div class="lexbox"><div class="lh">'+title+'</div>'+ids.map(i=>lexRow(i)).join("")+'</div>':""}
function lexChips(ids){return '<div class="chips">'+ids.map(i=>'<button class="chip tap" data-g="'+i+'">'+esc(LEX[i].k)+'</button>').join("")+'</div>'}
function showLex(i){const e=LEX[i];if(!e)return;const box=$("#def");
  box.innerHTML='<div class="grab"></div><div class="hd"><b>'+esc(e.k)+'</b><button class="iconbtn" data-close aria-label="Закрыть">'+IC.close+'</button></div><div class="bd">'+
   (e.d?'<div class="lab">Откуда слово</div><p>'+esc(e.d)+'</p>':'')+'<div class="lab">Что это значит</div><p>'+esc(e.m)+'</p>'+(e.u?'<div class="lab">Как говорят программисты</div><div class="pro">'+esc(e.u)+'</div>':'')+
   (e.lesson&&!(view==="lesson"&&cur===e.lesson)?'<a class="btn wide" style="margin-top:16px" href="#l-'+e.lesson.id+'" data-close>Где объясняется: '+esc(e.lesson.title)+' '+IC.next+'</a>':'')+
   '<a class="btn ghost wide" style="margin-top:8px" href="#dict'+(view==="lesson"&&cur?'/'+cur.id:'')+'" data-close>'+IC.book+'Весь словарь</a></div>';
  box.hidden=false;scrimOn()}
document.addEventListener("click",e=>{const g=e.target.closest("[data-g]");if(g){e.preventDefault();showLex(+g.dataset.g)}});
function lexReached(e){return !!(e.lesson&&(S.done[e.lesson.id]||S.pos[e.lesson.id]!==undefined))}

/* ---------- состояние: localStorage + синхронизация через db ---------- */
const KEY="vpd1steps";
function blank(){return{v:1,upd:0,done:{},pos:{},cards:{},days:[]}}
let S=blank();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
let db=null, docRef=null, saving=false, again=false, saveTimer=null;
function save(){S.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer);saveTimer=setTimeout(push,1500)}
async function push(){if(!docRef)return;if(saving){again=true;return}saving=true;
  try{await docRef.set({state:JSON.stringify(S)})}catch(e){}
  saving=false;if(again){again=false;push()}}
function markDay(){const d=new Date().toISOString().slice(0,10);if(!S.days.includes(d)){S.days.push(d);S.days=S.days.slice(-120)}}
function streak(){let n=0;const set=new Set(S.days);for(let t=new Date();;t=new Date(t-DAY)){const d=t.toISOString().slice(0,10);if(set.has(d))n++;else if(n||d!==new Date().toISOString().slice(0,10))break;if(n>400)break}return n}
(async()=>{if(!(window.claude&&window.claude.use))return;try{
  const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);if(!d||!u)return;
  const id=await u.id();if(!id)return;db=d;docRef=db.doc("data/users/"+id+"/progress");
  const snap=await docRef.get();
  if(snap.exists){const r=JSON.parse(snap.data().state||"{}");if((r.upd||0)>(S.upd||0)){S=Object.assign(blank(),r);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}route()}else if((S.upd||0)>(r.upd||0))push()}
  else if(S.upd)push();
  syncNote="Прогресс сохраняется в твоём аккаунте и виден с телефона и с компа.";if(view==="home")route();
}catch(e){}})();
let syncNote="";

/* ---------- карточки повторения (successive relearning) ---------- */
function cardKey(l,i){return l.id+"#"+i}
function lexCard(e){return {k:"x:"+e.k,lesson:e.lesson,lex:e.i}}
function lexCardsOf(l){return LEX.filter(e=>e.c&&e.lesson===l).map(lexCard)}
function allCards(){const out=[];LESSONS.forEach(l=>{(l.cards||[]).forEach((c,i)=>out.push(Object.assign({k:cardKey(l,i),lesson:l},c)));lexCardsOf(l).forEach(c=>out.push(c))});return out}
function due(){const now=Date.now();return allCards().filter(c=>S.cards[c.k]&&S.cards[c.k].due<=now)}


/* ---------- ИИ ---------- */

    $("#app").innerHTML=topbar("Словарь","Тренировка слов","","","#dict")+'<div class="card"><div class="kind"><span class="pill" style="--k:var(--accent)">Готово</span></div><h2>Слова повторены</h2><p>С первой попытки: <b>'+fo+' из '+al+'</b>.</p><div class="nav"><button class="btn primary wide" id="again">Ещё 15 слов</button><a class="btn wide" href="#dict">В словарь</a></div></div>';
    $("#again").onclick=()=>{view="dict";renderDict();$("#lexTrain").click()};window.scrollTo(0,0);return}
  let h=topbar(sessionKind==="lesson"?sessLesson.title:"",sessionKind==="lesson"?'Урок пройден':'Повторение')+'<div class="card"><div class="kind"><span class="pill" style="--k:var(--ok)">Готово</span></div><h2>'+(sessionKind==="lesson"?'Урок закреплён':'Повторение готово')+'</h2><p>С первой попытки: <b>'+firstOk+' из '+all+'</b>.'+(laterN?' Ещё '+laterN+' '+plural(laterN,"карточка вернётся","карточки вернутся","карточек вернутся")+' завтра: так и задумано.':firstOk<all?' Остальные ты вспомнил со второго раза.':'')+'</p>';
  h+='<p class="note">Карточки вернутся через 1–2 дня. Каждое удачное вспоминание отодвигает следующее повторение дальше: 1 → 2 → 4 → 7 → 14 дней. Так знание переходит в долгую память.</p>';
  if(sessionKind==="lesson") h+='<div class="like" style="margin:12px 0"><b>Сделай перерыв 5 минут</b>: встань, попей воды, не листай ленту. Мозг в это время дозакрепляет урок.</div>';
  h+='<div class="nav">'+(nl?'<a class="btn primary wide" href="#l-'+nl.id+'">Дальше: '+esc(nl.title)+IC.next+'</a>':'')+'<a class="btn wide" href="#">На главную</a></div></div>';
  $("#app").innerHTML=h;window.scrollTo(0,0);
  if(location.hash==="#review") history.replaceState(null,"","#");
}
/* ---------- тест готовности ---------- */
const BANK=JSON.parse($("#bank").textContent), BT=BANK.topics, BQ=BANK.q.map((q,i)=>Object.assign({id:i},q));
const LV=[[90,"Свободно","var(--ok)"],[75,"Готов к защите","var(--accent)"],[50,"Базовый","var(--warm)"],[0,"Не готов","var(--bad)"]];
const lvl=p=>LV.find(l=>p>=l[0]);
const normCmd=s=>String(s||"").replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/^\s*\$\s*/,"").replace(/\s+/g," ").trim();
const normOut=s=>String(s||"").replace(/\s+/g," ").trim().toLowerCase();
const lTitle=id=>{const l=LESSONS.find(x=>x.id===id);return l?l.title:id};
function renderTest(){
  let h=topbar("Проверка уровня","Тест готовности")+'<h1>Тест готовности</h1>';
  h+='<p>54 вопроса по 10 темам, 45–55 минут. Каждый раз новый набор из банка в '+BQ.length+' вопросов, поэтому проходи сколько угодно раз и сравнивай.</p>';
  h+='<div class="tbl"><table><tr><th>Уровень по теме</th><th>Что значит</th></tr><tr><td>меньше 50%: не готов</td><td>пройди уроки темы заново</td></tr><tr><td>50–74%: базовый</td><td>на защите будешь плавать</td></tr><tr><td>75–89%: готов к защите</td><td>ответишь на основные вопросы</td></tr><tr><td>90%+: свободно</td><td>владеешь и применяешь в новых ситуациях</td></tr></table></div>';
  h+='<p class="note">Честно: не подглядывай в уроки и терминал. Команды пиши как в терминале, порядок флагов не важен. Открытые вопросы оценивает ИИ.</p><div id="lvBox"></div><h3>История попыток</h3><div id="lvHist"></div>';
  $("#app").innerHTML=h;window.scrollTo(0,0);
  if(S.lvCur)lvRender();else lvIntro();lvDrawHist()}
function lvIntro(){$("#lvBox").innerHTML='<div class="card"><p><b>Готов?</b> Засеки 50 минут.</p>'+(sample?'':'<p class="note">ИИ сейчас недоступен, поэтому тест будет без 4 открытых вопросов.</p>')+'<button class="btn primary" id="lvStart">Начать тест</button></div>';$("#lvStart").onclick=lvStart}
function lvStart(){const ids=[];for(const k in BT)shuffle(BQ.filter(q=>q.k===k&&q.t!=="open")).slice(0,5).forEach(q=>ids.push(q.id));
  const opens=sample?shuffle(BQ.filter(q=>q.t==="open")).slice(0,4).map(q=>q.id):[];const perm={};ids.forEach(i=>{if(BQ[i].t==="mc")perm[i]=shuffle(BQ[i].o.map((_,j)=>j))});
  S.lvCur={ids:shuffle(ids.concat(opens)),ans:{},perm,t0:Date.now()};save();lvRender()}
const lvAnswered=i=>{const v=S.lvCur.ans[i];return v!==undefined&&v!==""&&!(typeof v==="string"&&!v.trim())};
function lvQ(q){const p=q.q.split("\n\n");return '<p style="font-weight:600;margin:0 0 8px">'+esc(p[0])+'</p>'+(p[1]?'<pre>'+esc(p.slice(1).join("\n\n"))+'</pre>':'')}
function lvRender(){const A=S.lvCur;let h='<p class="note" id="lvProg"></p>';
  A.ids.forEach((id,n)=>{const q=BQ[id],a=A.ans[id];h+='<div class="card" style="margin:10px 0" data-q="'+id+'"><div class="kind"><b>'+(n+1)+'</b><span>'+esc(BT[q.k].name)+'</span></div>'+lvQ(q);
    if(q.t==="mc"){const P=A.perm[id]||q.o.map((_,j)=>j);h+='<div class="opts">'+P.map(i=>'<button class="opt'+(a===i?' right':'')+'" data-i="'+i+'">'+esc(q.o[i])+'</button>').join("")+'</div>'}
    else if(q.t==="open")h+='<textarea placeholder="Своими словами, как преподу">'+esc(a||"")+'</textarea>';
    else h+='<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;font:16px var(--f-mono);border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--code-bg);color:var(--ink)" placeholder="'+(q.t==="cmd"?"$ команда":"что выведет")+'" value="'+esc(a||"")+'">';
    h+='</div>'});
  h+='<p class="note" id="lvWarn"></p><div class="nav"><button class="btn primary" id="lvSubmit">Сдать тест</button><button class="btn ghost" id="lvDrop">Бросить попытку</button></div>';
  const box=$("#lvBox");box.innerHTML=h;lvProg();
  box.oninput=e=>{const c=e.target.closest("[data-q]");if(!c)return;A.ans[c.dataset.q]=e.target.value;save();lvProg()};
  box.onclick=e=>{const b=e.target.closest(".opt");if(!b)return;const c=b.closest("[data-q]");$$(".opt",c).forEach(x=>x.classList.remove("right"));b.classList.add("right");A.ans[c.dataset.q]=+b.dataset.i;save();lvProg()};
  let warned=false;$("#lvSubmit").onclick=()=>{const left=A.ids.filter(i=>!lvAnswered(i)).length;if(left&&!warned){warned=true;$("#lvWarn").textContent="Без ответа: "+left+". Нажми ещё раз, чтобы сдать как есть.";return}lvGrade()};
  let arm=false;$("#lvDrop").onclick=e=>{if(!arm){arm=true;e.target.textContent="Точно? Нажми ещё раз";return}S.lvCur=null;save();lvIntro()}}
function lvProg(){const A=S.lvCur;$("#lvProg").textContent="Отвечено "+A.ids.filter(lvAnswered).length+" из "+A.ids.length+". Ответы сохраняются, можно вернуться позже."}
async function lvGrade(){const A=S.lvCur,qs=A.ids.map(i=>BQ[i]),res={};
  qs.forEach(q=>{const a=A.ans[q.id];
    if(q.t==="mc")res[q.id]={got:a===q.a?1:0,max:1};
    else if(q.t==="cmd")res[q.id]={got:q.ok.some(r=>new RegExp(r,"i").test(normCmd(a)))?1:0,max:1};
    else if(q.t==="out")res[q.id]={got:q.ok.some(x=>normOut(x)===normOut(a))?1:0,max:1};
    else res[q.id]={got:0,max:2}});
  const opens=qs.filter(q=>q.t==="open"&&lvAnswered(q.id));
  if(opens.length&&sample){$("#lvBox").innerHTML='<div class="card"><p>ИИ проверяет открытые ответы… 20–60 секунд.</p></div>';
    const items=opens.map((q,n)=>"#"+(n+1)+"\nВопрос: "+q.q+"\nЭталон: "+q.model+"\nОтвет: "+String(A.ans[q.id]).trim()).join("\n\n");
    try{const r=await sample.json("Ты преподаватель, оцениваешь ответы первокурсника на защите ЛР1 (языки, терминал, Git). Балл: 2 верно по сути и полно, 1 частично, 0 неверно. Сравнивай смысл с эталоном. Комментарий 1–2 предложения по-русски. Ответь ТОЛЬКО JSON-массивом [{\"n\":1,\"score\":2,\"comment\":\"...\"}].\n\n"+items);
      (Array.isArray(r)?r:[]).forEach(x=>{const q=opens[(+x.n)-1];if(!q)return;res[q.id].got=Math.max(0,Math.min(2,Math.round(+x.score||0)));res[q.id].comment=String(x.comment||"")})}
    catch(e){opens.forEach(q=>{res[q.id].un=true})}}
  const per={};for(const k in BT)per[k]={g:0,m:0};qs.forEach(q=>{const r=res[q.id];if(r.un)return;per[q.k].g+=r.got;per[q.k].m+=r.max});
  let G=0,M=0;const tp={};for(const k in per)if(per[k].m){tp[k]=Math.round(100*per[k].g/per[k].m);G+=per[k].g;M+=per[k].m}
  const total=M?Math.round(100*G/M):0;S.lvHist=(S.lvHist||[]).concat([{d:new Date().toISOString(),p:total,t:tp}]).slice(-30);S.lvCur=null;markDay();save();
  lvResult(A,res,tp,total);lvDrawHist()}
function lvResult(A,res,tp,total){const L=lvl(total),weak=Object.keys(tp).filter(k=>tp[k]<90).sort((x,y)=>tp[x]-tp[y]);
  let h='<div class="card"><div style="display:flex;align-items:baseline;gap:12px"><span style="font:700 44px/1 var(--f-display);color:'+L[2]+'">'+total+'%</span><b>'+L[1]+'</b></div><p class="note">Смотри на каждую тему: для защиты нужно 75%+, для свободного владения 90%+ по каждой.</p>'+
   '<div class="tbl"><table><tr><th>Тема</th><th>%</th><th>Уровень</th></tr>'+Object.keys(BT).filter(k=>tp[k]!==undefined).map(k=>{const l=lvl(tp[k]);return '<tr><td>'+esc(BT[k].name)+'</td><td>'+tp[k]+'</td><td style="color:'+l[2]+';font-weight:600">'+l[1]+'</td></tr>'}).join("")+'</table></div>';
  if(weak.length)h+='<h3>Что повторить</h3><ul>'+weak.map(k=>'<li><b>'+esc(BT[k].name)+'</b> ('+tp[k]+'%): '+BT[k].mods.map(m=>'<a href="#l-'+m+'">'+esc(lTitle(m))+'</a>').join(", ")+'</li>').join("")+'</ul>';
  else h+='<p><b>Все темы 90%+.</b> Если так же будет и в следующей попытке через день, цель достигнута.</p>';
  h+='<button class="btn primary" id="lvAgain">Новая попытка</button></div>';
  const wrong=A.ids.map(i=>BQ[i]).filter(q=>{const r=res[q.id];return r.un||r.got<r.max});
  if(wrong.length){h+='<h3>Разбор ошибок ('+wrong.length+')</h3>';wrong.forEach(q=>{const r=res[q.id],a=A.ans[q.id];const your=a===undefined||a===""?"нет ответа":(q.t==="mc"?q.o[a]:String(a));const right=q.t==="mc"?q.o[q.a]:q.t==="open"?q.model:q.s;
    h+='<div class="card" style="margin:10px 0"><div class="kind"><b>'+esc(BT[q.k].name)+'</b><span>'+(q.t==="open"?(r.un?"не оценено":r.got+" из 2"):"")+'</span></div>'+lvQ(q)+'<p><b>Твой ответ:</b> '+esc(your)+'</p><p><b>Правильно:</b> '+esc(right)+'</p>'+(r.comment?'<p><b>ИИ:</b> '+esc(r.comment)+'</p>':'')+(q.e?'<p class="note">'+esc(q.e)+'</p>':'')+'</div>'})}
  $("#lvBox").innerHTML=h;$("#lvBox").onclick=null;$("#lvBox").oninput=null;$("#lvAgain").onclick=lvStart;window.scrollTo(0,0)}
function lvDrawHist(){const H=S.lvHist||[],box=$("#lvHist");if(!box)return;if(!H.length){box.innerHTML='<p class="note">Попыток пока нет.</p>';return}
  const last=H.slice(-6),ready=H.length>=2&&H.slice(-2).every(x=>Object.keys(BT).every(k=>x.t[k]!==undefined&&x.t[k]>=90));
  box.innerHTML=(ready?'<p class="ok-msg">Две последние попытки: все темы 90%+. По тесту цель «свободно» достигнута.</p>':'')+'<div class="tbl"><table><tr><th>Тема</th>'+last.map(x=>'<th>'+new Date(x.d).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})+'</th>').join("")+'</tr><tr><td><b>Всего</b></td>'+last.map(x=>'<td style="color:'+lvl(x.p)[2]+';font-weight:700">'+x.p+'%</td>').join("")+'</tr>'+Object.keys(BT).map(k=>'<tr><td>'+esc(BT[k].name)+'</td>'+last.map(x=>x.t[k]===undefined?'<td>·</td>':'<td style="color:'+lvl(x.t[k])[2]+'">'+x.t[k]+'%</td>').join("")+'</tr>').join("")+'</table></div>'}

route();
})();
</script>
