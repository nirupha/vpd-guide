 снизу старые коммиты.<\/p>"}, {"t": "story", "h": "Картина целиком", "body": "<p>Проект живёт в <b>репозитории<\/b>: файлы плюс история в <code>.git<\/code>. История это цепочка <b>коммитов<\/b>-снимков, каждый знает родителя и назван <b>хешем<\/b> своего содержимого, поэтому историю нельзя тихо подменить. Изменение идёт по <b>трём зонам<\/b>: рабочая директория → <code>git add<\/code> → индекс → <code>git commit<\/code> → история. Что не хранить, решает <b>.gitignore<\/b>: артефакты сборки и мусор.<\/p><p><b>Ветка<\/b> это указатель на коммит, <b>HEAD<\/b> указывает на текущую ветку. Работу копий связывает <b>remote<\/b>: у тебя <b>bare<\/b>-репозиторий origin.git, клоны dev и second_dev, обмен через <b>push<\/b> и <b>fetch/pull<\/b>, а <b>origin/main<\/b> помнит состояние сервера.<\/p><p>Параллельная работа сливается <b>merge<\/b>: fast-forward, если история не расходилась, иначе <b>three-way merge<\/b> от общего предка и merge-коммит с двумя родителями (ромб ⟦BR⟧). Если оба изменили одно место, <b>конфликт<\/b>: маркеры, ручное разрешение, git add, commit (второй ромб). Сервер принимает push только как fast-forward. Готовая версия отмечена <b>аннотированным тегом<\/b> v1.0.0 по <b>SemVer<\/b> и описана в <b>CHANGELOG<\/b>.<\/p>"}, {"t": "why", "q": "Препод открывает твой граф: «Расскажи, что тут происходит». Ответь в 5–7 предложениях.", "model": "Снизу первый коммит Initialize lab project с README. Дальше коммиты с языками по группам и отдельный коммит .gitignore. От коммита с Java и C# я ответвил feature/⟦br⟧ (⟦N⟧ mod 5 = ⟦NMOD⟧); пока ⟦BR⟧ был в ветке, в main появились ⟦MAIN_RU⟧, поэтому слияние дало merge-коммит с двумя родителями, первый ромб. Потом ⟦LATE_RU⟧ и README. Второй ромб это конфликт: в dev и second_dev я по-разному поменял строку Status, second_dev запушил первым, в dev pull --no-rebase дал конфликт, я разрешил его вручную. Наверху CHANGELOG с аннотированным тегом v1.0.0, затем скрины; HEAD, main и origin/main совпадают, значит, всё отправлено."}, {"t": "pro", "simple": "Внизу первое сохранение, потом две развилки: одна для ⟦BR⟧, другая из-за спора о строке; наверху отметка готовой версии, и моя ветка совпадает с серверной.", "terms": ["граф коммитов", "feature branch / merge commit", "merge conflict", "annotated tag", "HEAD -> main, origin/main"], "model": "По графу: initial commit, затем два merge commit, от feature branch с ⟦BR⟧ и от разрешённого merge conflict; сверху annotated tag v1.0.0; HEAD -> main совпадает с origin/main, всё запушено."}, {"t": "sum", "items": ["Четыре финальные команды: status, log --oneline --graph --all --decorate, tag, remote -v.", "Граф читается снизу вверх; ромбы это merge-коммиты.", "В твоей лабе два ромба: ветка ⟦BR⟧ и конфликт.", "HEAD -> main = origin/main значит, что всё отправлено."]}], "cards": [{"q": "Какие 4 команды финальной проверки?", "a": "git status, git log --oneline --graph --all --decorate, git tag, git remote -v."}, {"q": "Что значат флаги --oneline --graph --all --decorate?", "a": "По строке на коммит, рисовать граф, все ветки, подписывать ветки, теги и HEAD."}, {"q": "Что за два ромба в твоём графе?", "a": "Merge feature/⟦br⟧ и разрешение конфликта по строке Status."}, {"q": "Как понять по графу, что всё отправлено?", "a": "HEAD -> main и origin/main на одном коммите."}]}, {"id": "t6l6", "title": "Практический экзамен", "min": 60, "steps": [{"t": "intro", "h": "Повтори лабу сам и получи объективную оценку", "body": "<p>Только цели, без команд. Делаешь в <code>~/vpd-exam<\/code>, а в конце скрипт <code>check.sh<\/code> проверяет твои репозитории по 28 пунктам и ставит баллы. Первый раз можно открывать подсказки. Через пару дней удали папку и сделай заново <b>без подсказок<\/b>: это и есть свободное владение. Номер ⟦N⟧, языки C, Python и Bash.<\/p>"}, {"t": "file", "h": "Поставь скрипт проверки", "body": "<p>Скачай или скопируй команду установки и вставь её в терминал. Проверка: <code>bash ~/check.sh<\/code>. Скрипт ничего не меняет, только читает репозитории (и пересобирает c/main для проверки компиляции).<\/p>"}, {"t": "task", "h": "1. Сервер и рабочая копия", "goal": "В <code>~/vpd-exam<\/code> должен быть bare-репозиторий <code>origin.git<\/code> с веткой по умолчанию main и его клон <code>dev<\/code> (объекты скопированы, а не связаны).", "hint": "git init с двумя флагами и git clone с одним.", "solution": "<pre>mkdir -p ~/vpd-exam &amp;&amp; cd ~/vpd-exam\ngit init --bare --initial-branch=main origin.git\ngit clone --no-hardlinks origin.git dev &amp;&amp; cd dev &amp;&amp; git branch -M main<\/pre>"}, {"t": "task", "h": "2. Первый коммит только с README", "goal": "Первый коммит содержит только README.md с заголовком и строкой <code>**Status:** ...<\/code>. Добавлен по пути, перед коммитом посмотри оба вида diff, отправь с запоминанием upstream.", "hint": "status → add путь → diff → diff --staged → commit → push -u.", "solution": "<pre>printf '# Exam\\n\\n**Status:** in progress\\n' &gt; README.md\ngit status; git add README.md; git diff; git diff --staged\ngit commit -m \"Initialize exam project\"; git push -u origin main<\/pre>"}, {"t": "task", "h": "3. Две программы и .gitignore", "goal": "c/main.c и python/main.py выводят три строки задания, Python ещё и число слов. C собирается с -Wall -Wextra -pedantic без предупреждений. Бинарник c/main не в git, в .gitignore есть комментарии. Отдельные осмысленные коммиты.", "hint": "Собери, посмотри status, создай .gitignore, проверь git check-ignore -v c/main, потом коммить.", "solution": "<pre>gcc -Wall -Wextra -pedantic c/main.c -o c/main &amp;&amp; ./c/main\nprintf '# бинарник C, получается gcc\\nc/main\\n' &gt; .gitignore\ngit check-ignore -v c/main\ngit add .gitignore c/main.c &amp;&amp; git commit -m \"Add C implementation and .gitignore\"\ngit add python/ &amp;&amp; git commit -m \"Add Python implementation\" &amp;&amp; git push<\/pre>"}, {"t": "task", "h": "4. Bash в ветке, merge-коммит", "goal": "Ветка feature/bash (отправлена в origin) с bash/main.sh, где есть настоящий pipe в wc. Пока ветка живёт, сделай коммит в main, чтобы слияние дало merge-коммит. Влей и отправь.", "hint": "switch -c, add, commit, push -u origin feature/bash; switch main; коммит; merge.", "solution": "<pre>git switch -c feature/bash\n# bash/main.sh с words=$(echo \"$n\" | wc -w)\ngit add bash/ &amp;&amp; git commit -m \"Add Bash implementation\" &amp;&amp; git push -u origin feature/bash\ngit switch main &amp;&amp; echo 'Languages: C, Python, Bash' &gt;&gt; README.md &amp;&amp; git commit -am \"List languages\"\ngit merge --no-edit feature/bash &amp;&amp; git push<\/pre>"}, {"t": "task", "h": "5. Конфликт", "goal": "Сделай second_dev. Конфликт по строке Status: second_dev отправляет первым, в dev слияние через pull без rebase. Разреши вручную, отправь; second_dev должен получить итог.", "hint": "Урок «Конфликт». После разрешения: add, commit --no-edit, push, pull в second_dev.", "solution": "<pre>cd .. &amp;&amp; git clone --no-hardlinks origin.git second_dev &amp;&amp; cd second_dev\nsed -i 's/in progress/ready for review/' README.md &amp;&amp; git commit -am \"Mark as ready\" &amp;&amp; git push\ncd ../dev &amp;&amp; sed -i 's/in progress/all done/' README.md &amp;&amp; git commit -am \"Update status\"\ngit pull --no-rebase   # конфликт, правка в nvim\ngit add README.md &amp;&amp; git commit --no-edit &amp;&amp; git push\ncd ../second_dev &amp;&amp; git pull<\/pre>"}, {"t": "task", "h": "6. Релиз", "goal": "CHANGELOG.md с версией 1.0.0 в main, аннотированный тег v1.0.0 в origin.", "hint": "tag -a с -m; теги отправляются отдельно.", "solution": "<pre>cd ~/vpd-exam/dev &amp;&amp; printf '# Changelog\\n\\n## [1.0.0]\\n- C, Python, Bash\\n' &gt; CHANGELOG.md\ngit add CHANGELOG.md &amp;&amp; git commit -m \"Add CHANGELOG for 1.0.0\" &amp;&amp; git push\ngit tag -a v1.0.0 -m \"Exam release\" &amp;&amp; git push origin v1.0.0<\/pre>"}, {"t": "task", "h": "7. Проверка", "goal": "В dev git status чистый, всё отправлено. Запусти bash ~/check.sh и доведи до 100%. У каждого ✘ скрипт пишет подсказку.", "hint": "Не понимаешь пункт? Скопируй вывод в «Не понял, объясни иначе».", "solution": "<p>28 из 28. Если делал без подсказок, Git для лабы ты знаешь.<\/p>"}, {"t": "sum", "items": ["Ты повторил всю Git-часть лабы сам и проверил результат скриптом.", "Через пару дней повтори с нуля без подсказок."]}], "cards": [{"q": "Как проверить практический экзамен?", "a": "bash ~/check.sh: 28 пунктов, подсказка у каждого ✘."}]}, {"id": "t6l7", "title": "Отчёт и защита", "min": 12, "steps": [{"t": "intro", "h": "Что сдаётся и как защищать", "body": "<p>Последний урок перед защитой: что должно быть в отчёте, таблица всех команд и как вести себя у преподавателя.<\/p>"}, {"t": "idea", "h": "Что сдаётся (по заданию)", "body": "<ul><li>ФИО, группа, номер, ОС и окружение (твоя ОС, терминал и редактор).<\/li><li>Таблица инструментов и версий.<\/li><li>Таблица по 13 языкам: файл, команда, тип результата, выполнена ли визитная карточка; для asm архитектура и toolchain.<\/li><li>Скрины вывода всех реализаций (можно группами).<\/li><li>Как решена кириллица в C/C++.<\/li><li>Фрагменты README.md и CHANGELOG.md.<\/li><li>Граф <code>git log --oneline --graph --all --decorate<\/code>.<\/li><li>Конфликт до и после разрешения.<\/li><li><code>git status<\/code> и список тегов.<\/li><\/ul><p class=\"pro\">Главный критерий задания: «уметь объяснить назначение каждой команды и характерную особенность каждой реализации».<\/p>"}, {"t": "idea", "h": "Все команды сборки и запуска", "body": "<div class=\"tbl\"><table><tr><th>Язык<\/th><th>Команда<\/th><th>Результат<\/th><\/tr><tr><td>C<\/td><td><code>gcc -Wall -Wextra -pedantic c/main.c -o c/main &amp;&amp; ./c/main<\/code><\/td><td>нативный бинарник<\/td><\/tr><tr><td>C++<\/td><td><code>g++ -Wall -Wextra -pedantic cpp/main.cpp -o cpp/main &amp;&amp; ./cpp/main<\/code><\/td><td>нативный бинарник<\/td><\/tr><tr><td>Python<\/td><td><code>python3 python/main.py<\/code><\/td><td>интерпретация<\/td><\/tr><tr><td>JavaScript<\/td><td><code>node javascript/main.js<\/code><\/td><td>V8 + JIT<\/td><\/tr><tr><td>TypeScript<\/td><td><code>cd typescript &amp;&amp; tsc main.ts --outDir dist &amp;&amp; node dist/main.js<\/code><\/td><td>транспиляция в JS<\/td><\/tr><tr><td>Java<\/td><td><code>cd java &amp;&amp; javac Main.java &amp;&amp; java Main<\/code>; <code>javap -c Main<\/code><\/td><td>байт-код .class<\/td><\/tr><tr><td>C#<\/td><td><code>cd csharp &amp;&amp; dotnet run<\/code><\/td><td>CIL в bin/<\/td><\/tr><tr><td>F#<\/td><td><code>cd fsharp &amp;&amp; dotnet run<\/code><\/td><td>CIL в bin/<\/td><\/tr><tr><td>Go<\/td><td><code>go run go/main.go<\/code><\/td><td>временный бинарник<\/td><\/tr><tr><td>Rust<\/td><td><code>rustc rust/main.rs -o rust/main &amp;&amp; ./rust/main<\/code><\/td><td>нативный бинарник<\/td><\/tr><tr><td>Bash<\/td><td><code>bash bash/main.sh<\/code><\/td><td>интерпретация<\/td><\/tr><tr><td>Prolog<\/td><td><code>swipl -q -s prolog/main.pl -g main -t halt<\/code><\/td><td>интерпретация<\/td><\/tr><tr><td>ASM<\/td><td><code>cd asm &amp;&amp; as assembler.s -o assembler.o &amp;&amp; gcc assembler.o -o assembler &amp;&amp; ./assembler<\/code><\/td><td>объектный файл → бинарник<\/td><\/tr><\/table><\/div>"}, {"t": "idea", "h": "Как вести себя на защите", "body": "<ul><li><b>Отвечай своими словами<\/b>: «эта команда делает X, нужна для Y». Заученный текст слышно.<\/li><li><b>Показывай в терминале<\/b>: спросили про .class, выполни <code>javap -c Main<\/code>; про историю, выведи граф.<\/li><li><b>Не знаешь, скажи честно<\/b> и рассуждай вслух: «точно не помню, но думаю так, потому что…».<\/li><li><b>Знай свои числа<\/b>: ⟦N⟧, ⟦CTRL⟧, ⟦N⟧ mod 5 = ⟦NMOD⟧ (⟦BR⟧), имя ⟦EN_LENSYM⟧, ⟦EN_WORDSW⟧, ⟦EN_LETTERSW⟧.<\/li><li><b>Заранее открой<\/b> терминал в <code>~/Documents/vpd/lab01/dev<\/code>.<\/li><\/ul>"}, {"t": "task", "h": "Проверь свой README по чек-листу", "goal": "Открой README.md лабы и найди каждое требование задания: заголовок 1 уровня, ФИО/группа/номер, цель, список языков, таблица язык-версия-команда, inline-code и fenced block, пример вывода, кириллица в C/C++, ассемблер (ОС, архитектура, toolchain, команды).", "hint": "grep -n '^#' README.md покажет заголовки.", "solution": "<p>Всё это у тебя есть: разделы «Что сделано», «Как запустить», «Что выводится», «Кириллица в C/C++», «Ассемблер», «Git».<\/p>"}, {"t": "why", "q": "Тренировка вслух: расскажи за минуту, что ты сделал в лабе.", "model": "Я написал одну программу на 13 языках: в каждой одни и те же данные, student_id с номером в две цифры и control_value = 304 × ⟦N⟧, и у каждого языка своя визитная карточка, показывающая его суть: printf в C, |> в F#, pipe в Bash, факты в Prolog, puts через ABI в ассемблере. Языки различаются моделью выполнения: компиляция в машинный код, байт-код с VM и JIT, интерпретация, транспиляция. Проект вёл в Git: bare origin и клоны, ветка feature/⟦br⟧ со слиянием, конфликт из второго клона, разрешённый вручную, CHANGELOG и аннотированный тег v1.0.0."}, {"t": "sum", "items": ["Ты знаешь, что сдаётся, все команды и как держаться на защите.", "Дальше: тест готовности и пробная защита на главной."]}], "cards": [{"q": "Главный критерий защиты по заданию?", "a": "Объяснить назначение каждой команды и особенность каждой реализации."}, {"q": "Команда запуска Prolog?", "a": "swipl -q -s prolog/main.pl -g main -t halt."}]}], "defense": true}, {"id": "t7", "title": "Та же лаба на Windows и Mac", "role": "Что меняется на других ОС и почему: оболочки, пути, переводы строк, форматы программ, кириллица, ассемблер.", "link": "одногруппники делали ту же лабу на Windows и Mac", "map": {"lead": "Корень различий наверху. Ниже что из этого следует для терминала, файлов, программ и вывода.", "rows": [{"label": "Корень различий", "nodes": ["unixwin"], "arrow": "отсюда"}, {"label": "Терминал и файлы", "nodes": ["shells", "paths", "crlf", "perms"], "arrow": "и"}, {"label": "Программы и вывод", "nodes": ["formats", "toolchains", "asmos"], "arrow": ""}]}, "lessons": [{"id": "t7l1", "title": "Unix и Windows: терминал и файлы", "min": 13, "steps": [{"t": "intro", "h": "Почему лаба выглядит по-разному на разных системах", "body": "<p>Ты делал всё на Linux, кент на Windows, кто-то в группе на Mac. Команды Git везде одинаковые, но вокруг них много различий. У всех одна причина.<\/p>"}, {"t": "word", "term": "Unix и Windows", "node": "unixwin", "pt": "Unix-like · POSIX · Windows NT", "simple": "Linux и macOS это наследники Unix: общие привычки и правила. Windows выросла из DOS и живёт по своим правилам.", "like": "Две разные школы вождения: правила похожи по смыслу, но знаки и привычки разные.", "ex": "Unix: пути с <code>/<\/code>, переводы строк LF, права rwx, sh-подобная оболочка. Windows: <code>C:\\<\/code>, CRLF, исполняемость по .exe, консоль со старыми кодовыми страницами.", "pro": "<p>Linux и macOS называют <b>Unix-like<\/b>; общий стандарт их интерфейсов это <b>POSIX<\/b>. Linux использует утилиты <b>GNU<\/b>, macOS утилиты <b>BSD<\/b>, поэтому мелкие флаги иногда отличаются (на Mac <code>sed -i ''<\/code>).<\/p>"}, {"t": "word", "term": "Оболочки на разных ОС", "node": "shells", "pt": "bash · zsh · PowerShell · cmd", "simple": "Linux: обычно bash (у тебя fish). macOS: zsh. Windows: PowerShell и старый cmd; для лабы Git Bash или WSL.", "like": "Разные секретари: понимают похожие просьбы, но формулировать надо по-своему.", "ex": "Где программа: <code>which gcc<\/code> (Unix) против <code>where gcc<\/code> / <code>Get-Command gcc<\/code> (Windows). PATH: <code>echo $PATH<\/code> с <code>:<\/code> против <code>$env:PATH<\/code> с <code>;<\/code>. Своя программа: <code>./c/main<\/code> против <code>.\\c\\main.exe<\/code>.", "pro": "<p><b>Git Bash<\/b> приносит на Windows bash и Unix-утилиты (из проекта MSYS2). <b>WSL<\/b> (Windows Subsystem for Linux) это настоящий Linux внутри Windows. Поэтому задание разрешает их для Bash-части.<\/p>"}, {"t": "word", "term": "Пути и регистр", "node": "paths", "pt": "path separator · case sensitivity", "simple": "Разделитель папок: <code>/<\/code> в Unix, <code>\\<\/code> в Windows. Linux различает большие и маленькие буквы в именах, Windows и macOS по умолчанию нет.", "like": "В одной стране адрес пишут «улица, дом», в другой «дом, улица»; а в одной «Ленина» и «ленина» разные улицы, в другой одна.", "ex": "На Linux <code>Main.java<\/code> и <code>main.java<\/code> два разных файла. На Windows переименовал <code>readme.md<\/code> в <code>README.md<\/code>, а Git может не заметить; правильно <code>git mv<\/code>.", "pro": "<p><b>case-sensitive<\/b> (Linux) против <b>case-insensitive<\/b> (Windows, macOS по умолчанию). Домашняя папка: <code>/home/имя<\/code>, <code>/Users/имя<\/code>, <code>C:\\Users\\имя<\/code>.<\/p>"}, {"t": "word", "term": "Переводы строк", "node": "crlf", "pt": "LF · CRLF · autocrlf", "simple": "Конец строки в файле обозначается невидимыми символами: в Unix один (LF), в Windows два (CR+LF).", "like": "Пишущая машинка: «вернуть каретку» и «прокрутить строку» были двумя действиями, Windows так и пишет оба.", "ex": "Bash-скрипт, сохранённый на Windows с CRLF, на Linux падает с <code>$'\\r': command not found<\/code>: bash считает <code>\\r<\/code> частью команды.", "pro": "<p><b>LF<\/b> (<code>\\n<\/code>, line feed), <b>CR<\/b> (<code>\\r<\/code>, carriage return). Git умеет перекодировать: <code>core.autocrlf<\/code> (на Windows true). Надёжнее файл <b>.gitattributes<\/b> с <code>* text=auto<\/code> и <code>*.sh text eol=lf<\/code>. Поэтому в инструкции кента пункт «Files: Eol = \\n».<\/p>"}, {"t": "predict", "q": "Почему у одногруппника на Windows Git может показать изменёнными все строки файла, хотя он их не трогал?", "o": ["Вирус", "Редактор пересохранил файл с другими переводами строк (CRLF вместо LF)", "Git сломался", "Из-за кодировки кириллицы"], "a": 1, "reveal": "<p>Каждая строка «изменилась» на невидимый символ. Отсюда конфликты на ровном месте в командах с разными ОС. Лечится .gitattributes.<\/p>"}, {"t": "word", "term": "Права на запуск", "node": "perms", "pt": "rwx · chmod · executable bit", "simple": "В Unix файл можно запустить, если у него есть право x. В Windows исполняемость определяет расширение (.exe, .bat).", "like": "В одном клубе пропуск выдают по списку, в другом по цвету бейджа.", "ex": "<code>chmod +x bash/main.sh<\/code>, потом <code>./bash/main.sh<\/code>. <code>ls -l<\/code> показывает права, например <code>-rwxr-xr-x<\/code>.", "pro": "<p>Права <b>rwx<\/b> для владельца, группы, остальных; числом <code>755<\/code>. Git хранит из прав только <b>executable bit<\/b>. На Windows он его не видит (<code>core.fileMode=false<\/code>), ставят так: <code>git update-index --chmod=+x файл<\/code>.<\/p>"}, {"t": "check", "q": "Как запустить свою программу в PowerShell?", "o": ["prog", "./prog", "run prog", ".\\prog.exe"], "a": 3, "why": "PowerShell, как Unix-оболочки, не ищет программы в текущей папке без явного пути."}, {"t": "why", "q": "Откуда вообще все эти различия между Linux/macOS и Windows?", "model": "Linux и macOS наследники Unix, у них общие правила: пути с /, переводы строк LF, права rwx, оболочки семейства sh, UTF-8. Windows выросла из DOS и сохраняет обратную совместимость со старыми программами: диски и обратный слэш, CRLF, исполняемость по расширению, консоль со старыми кодовыми страницами."}, {"t": "pro", "simple": "Скрипт, сохранённый на Windows, на Linux не работает из-за невидимого лишнего символа в конце каждой строки, а ещё у него нет разрешения на запуск.", "terms": ["CRLF / LF", "executable bit / chmod +x", ".gitattributes", "Unix-like"], "model": "На Windows файл сохранился с CRLF, а bash на Unix-like системе ждёт LF; плюс не выставлен executable bit. Лечится .gitattributes с eol=lf и chmod +x (или git update-index --chmod=+x)."}, {"t": "sum", "items": ["Linux и macOS наследники Unix (POSIX), Windows своя линия от DOS.", "Разные оболочки: bash/zsh против PowerShell/cmd; Git Bash и WSL приносят Unix на Windows.", "Пути: / против \\, регистр различается только в Linux.", "Переводы строк LF против CRLF; .gitattributes решает.", "Запуск: право x в Unix против расширения в Windows."]}], "cards": [{"q": "Почему Linux и macOS похожи, а Windows нет?", "a": "Linux и macOS Unix-like (POSIX); Windows ведёт линию от DOS."}, {"q": "LF и CRLF?", "a": "Unix заканчивает строку \\n, Windows \\r\\n; bash падает на \\r."}, {"q": "Что такое Git Bash и WSL?", "a": "Git Bash: bash и Unix-утилиты на Windows; WSL: настоящий Linux внутри Windows."}, {"q": "Чем пути Windows отличаются?", "a": "Обратный слэш, диски C:\\, имена без учёта регистра."}, {"q": "Как сделать скрипт исполняемым в Git с Windows?", "a": "git update-index --chmod=+x файл."}]}, {"id": "t7l2", "title": "Программы, кириллица и ассемблер на других ОС", "min": 12, "steps": [{"t": "intro", "h": "Что меняется для самих программ", "body": "<p>В теме 1 ты узнал, что бинарник привязан к платформе. Теперь посмотрим, что конкретно отличается на Windows и Mac.<\/p>"}, {"t": "word", "term": "Форматы программ", "node": "formats", "pt": "ELF · PE · Mach-O · .so/.dll/.dylib", "simple": "У каждой ОС свой формат исполняемых файлов и свои библиотеки.", "like": "Разные стандарты переплёта и разные общие кулинарные книги на каждой кухне.", "ex": "<div class=\"tbl\"><table><tr><th><\/th><th>Linux<\/th><th>macOS<\/th><th>Windows<\/th><\/tr><tr><td>Программа<\/td><td>ELF<\/td><td>Mach-O<\/td><td>PE (.exe)<\/td><\/tr><tr><td>Библиотеки<\/td><td>.so<\/td><td>.dylib<\/td><td>.dll<\/td><\/tr><tr><td>Библиотека C<\/td><td>glibc<\/td><td>libSystem<\/td><td>msvcrt/UCRT<\/td><\/tr><\/table><\/div>", "pro": "<p>Даже между дистрибутивами Linux бинарник может не перенестись: собранный на свежем CachyOS требует новую glibc, и на старой Ubuntu выдаст <code>GLIBC_2.xx not found<\/code>. А байт-код (.class, .dll .NET) и скрипты переносятся без изменений, нужен только рантайм.<\/p>"}, {"t": "word", "term": "Тулчейны на разных ОС", "node": "toolchains", "pt": "GCC · Clang · MSVC · MinGW", "simple": "Набор инструментов сборки отличается: на Linux GCC, на Mac Apple Clang (даже команда gcc там это clang), на Windows MinGW-w64 (порт GCC) или MSVC от Microsoft.", "like": "Одна и та же операция, но инструменты от разных производителей.", "ex": "На Windows с MinGW <code>gcc c/main.c -o c/main<\/code> даст <code>c/main.exe<\/code>. На Mac <code>gcc<\/code> запускает clang, ставится через <code>xcode-select --install<\/code>.", "pro": "<p><b>MinGW-w64<\/b>, <b>MSVC<\/b> (cl.exe), <b>Clang<\/b>/<b>LLVM<\/b>. Установка: pacman (Arch, CachyOS), apt (Ubuntu), dnf (Fedora), brew (macOS), winget (Windows). Версии в README у одногруппников будут другими: CachyOS роллинг-релиз со свежими версиями, Ubuntu LTS держит старые.<\/p>"}, {"t": "predict", "q": "Почему твой Bash-скрипт на Mac выведет «Words in English name:        3» с пробелами?", "o": ["Ошибка в скрипте", "wc из BSD на Mac выравнивает число пробелами, а GNU wc на Linux нет", "На Mac другая кодировка", "Mac не поддерживает Bash"], "a": 1, "reveal": "<p>Мелкое различие утилит GNU и BSD. Лечится <code>| tr -d ' '<\/code>. Хороший пример, почему «работает у меня» не значит «работает везде».<\/p>"}, {"t": "idea", "h": "Кириллица на трёх системах", "body": "<div class=\"tbl\"><table><tr><th><\/th><th>Linux, macOS<\/th><th>Windows<\/th><\/tr><tr><td>Кодировка консоли<\/td><td>UTF-8<\/td><td>cp866 по умолчанию<\/td><\/tr><tr><td>Нужно в C/C++<\/td><td>ничего<\/td><td>SetConsoleOutputCP(CP_UTF8) или chcp 65001<\/td><\/tr><tr><td>Компилятор и исходник<\/td><td>GCC/Clang читают UTF-8<\/td><td>MSVC нужен флаг /utf-8<\/td><\/tr><tr><td>Java<\/td><td>UTF-8<\/td><td>до JDK 18 нужен javac -encoding UTF-8<\/td><\/tr><\/table><\/div><p>Причина одна: Windows держит обратную совместимость со старыми программами.<\/p>"}, {"t": "word", "term": "Ассемблер на разных ОС", "node": "asmos", "pt": "ABI · ARM64 · Mach-O symbols", "simple": "Код ассемблера зависит и от процессора (x86-64 или ARM64), и от ОС (её ABI и формата файлов).", "like": "Одна и та же просьба, но на разных языках и по разным протоколам.", "ex": "<div class=\"tbl\"><table><tr><th><\/th><th>Linux x86-64<\/th><th>Windows x86-64<\/th><th>Mac M1 (ARM64)<\/th><\/tr><tr><td>1-й аргумент<\/td><td>rdi<\/td><td>rcx<\/td><td>x0<\/td><\/tr><tr><td>Стек<\/td><td>push rbp<\/td><td>sub rsp, 40 (shadow space)<\/td><td>stp x29, x30<\/td><\/tr><tr><td>Имена<\/td><td>main, puts<\/td><td>main, puts<\/td><td>_main, _puts<\/td><\/tr><tr><td>Вызов<\/td><td>call puts@PLT<\/td><td>call puts<\/td><td>bl _puts<\/td><\/tr><tr><td>Сборка<\/td><td>as + gcc<\/td><td>as + gcc (MinGW)<\/td><td>clang<\/td><\/tr><\/table><\/div>", "pro": "<p>ABI: <b>System V AMD64<\/b> (Linux, macOS Intel), <b>Microsoft x64<\/b> (Windows), <b>AAPCS64<\/b> (ARM64). На ARM адрес строки собирается в два шага (<code>adrp<\/code> + <code>add<\/code>), потому что инструкция ARM всегда 4 байта и полный адрес в неё не влезает.<\/p>"}, {"t": "check", "q": "Почему c/main не запустится на Windows, а Main.class запустится?", "o": ["На Windows нет C", "c/main это ELF под Linux, а .class байт-код для JVM, которая есть везде", "Нужно переименовать", "Запустится тоже"], "a": 1, "why": "Формат файла и системные библиотеки против переносимого байт-кода."}, {"t": "story", "h": "Картина целиком", "body": "<p>Корень всех различий в том, что <b>Linux и macOS Unix-like<\/b>, а <b>Windows<\/b> ведёт свою линию от DOS и держит обратную совместимость. Отсюда разные <b>оболочки<\/b> (bash/zsh против PowerShell; Git Bash и WSL как мост), <b>пути<\/b> (/ против \\, регистр), <b>переводы строк<\/b> (LF против CRLF, лечится .gitattributes) и <b>права запуска<\/b> (rwx против .exe).<\/p><p>Для программ: свои <b>форматы<\/b> (ELF, Mach-O, PE) и библиотеки, поэтому нативные бинарники собирают под каждую платформу, а байт-код и скрипты переносимы. Свои <b>тулчейны<\/b> (GCC, Clang, MinGW, MSVC). Своя <b>кодировка консоли<\/b> (cp866 на Windows, поэтому SetConsoleOutputCP). И свой <b>ассемблер<\/b>: другой ABI (rcx вместо rdi) на Windows и другой процессор (ARM64) на Mac M1.<\/p><p>Команды Git при этом одинаковы везде, это одно из главных его достоинств.<\/p>"}, {"t": "why", "q": "Препод: «А что бы ты поменял, если бы делал лабу на Windows?»", "model": "Работал бы в VS Code с Git Bash или WSL. Компилятор C был бы MinGW-w64, бинарники .exe, и в .gitignore удобно указать *.exe. Блок #ifdef _WIN32 с SetConsoleOutputCP реально бы выполнялся, иначе консоль в cp866. Ассемблер под Microsoft x64 ABI: аргумент в rcx, sub rsp, 40, секция .rdata. Следил бы, чтобы bash-скрипт был с LF. В .gitignore добавил бы Thumbs.db и desktop.ini. Команды Git остались бы теми же."}, {"t": "pro", "simple": "На Windows программа собирается другими инструментами в другой формат, консоль читает текст по старой таблице, а в ассемблере аргумент кладётся в другую ячейку по другому договору.", "terms": ["PE / ELF", "MinGW-w64", "кодовая страница консоли", "Microsoft x64 ABI (rcx)"], "model": "На Windows тулчейн MinGW-w64 собирает PE вместо ELF, консоль декодирует вывод в cp866, а ассемблер следует Microsoft x64 ABI: первый аргумент в rcx плюс shadow space."}, {"t": "sum", "items": ["Форматы: ELF, Mach-O, PE; библиотеки .so, .dylib, .dll.", "Тулчейны: GCC, Clang (gcc на Mac), MinGW, MSVC; разные пакетные менеджеры и версии.", "Кириллица ломается в консоли Windows (cp866).", "Ассемблер зависит от архитектуры и ABI: rdi / rcx / x0."]}], "cards": [{"q": "Форматы программ на Linux, macOS, Windows?", "a": "ELF, Mach-O, PE (.exe)."}, {"q": "Что на самом деле gcc на Mac?", "a": "Apple Clang."}, {"q": "Почему бинарник с CachyOS может не запуститься на старой Ubuntu?", "a": "Слинкован с более новой glibc: GLIBC_x.xx not found."}, {"q": "Первый аргумент функции на Linux, Windows, Mac M1?", "a": "rdi (System V), rcx (Microsoft x64), x0 (ARM64)."}, {"q": "Почему wc -w на Mac печатает пробелы?", "a": "BSD-утилиты на Mac выравнивают вывод, GNU на Linux нет."}]}]}, {"id": "t8", "title": "Git и терминал свободно", "role": "За пределами лабы: справка и поиск, исправление ошибок в Git, задачи на новые ситуации.", "link": "умение выходит за рамки лабы", "map": {"lead": "Инструменты, которые нужны каждый день.", "rows": [{"label": "Найти и понять", "nodes": ["help", "search"], "arrow": "и"}, {"label": "Исправить ошибку в Git", "nodes": ["restore", "amend", "revert", "stash", "reflog"], "arrow": ""}]}, "lessons": [{"id": "t8l1", "title": "Справка и поиск", "min": 12, "steps": [{"t": "intro", "h": "Не помнить, а уметь найти", "body": "<p>Никто не помнит все флаги. Свободное владение терминалом начинается с умения быстро найти ответ.<\/p>"}, {"t": "word", "term": "Справка", "node": "help", "pt": "--help · man · tldr", "simple": "Почти у каждой программы есть встроенное описание флагов.", "like": "Инструкция, вложенная в коробку.", "ex": "<code>ls --help<\/code> кратко, <code>man ls<\/code> подробно (листать пробелом, искать <code>/слово<\/code>, выход <kbd>q<\/kbd>), <code>git help commit<\/code>.", "pro": "<p><b>man page<\/b> (manual). Говорят «глянь ман», «RTFM». Так же листаются <code>less<\/code> и <code>git log<\/code>.<\/p>"}, {"t": "word", "term": "Поиск", "node": "search", "pt": "grep · find · less · head/tail", "simple": "grep ищет текст внутри файлов, find ищет сами файлы.", "like": "grep как Ctrl+F по всем документам, find как поиск файла по имени.", "ex": "<code>grep -rn Status .<\/code> (рекурсивно, с номерами строк), <code>grep -i<\/code> без учёта регистра, <code>find . -name '*.c'<\/code>, <code>head -n 5<\/code>, <code>tail -n 5<\/code>, <code>less файл<\/code>.", "pro": "<p>Кавычки в <code>'*.c'<\/code> нужны, чтобы звёздочку раскрыл find, а не оболочка. Конвейеры вроде <code>git log --oneline | grep Add | wc -l<\/code> это повседневная работа.<\/p>"}, {"t": "predict", "q": "Чем grep отличается от find?", "o": ["Ничем", "grep ищет текст в файлах, find ищет файлы", "find быстрее", "grep только для git"], "a": 1, "reveal": "<p>Их часто комбинируют: find находит файлы, grep ищет в них.<\/p>"}, {"t": "task", "h": "Найди флаг сам", "goal": "Не гугля, узнай через справку: какой флаг git log показывает изменённые файлы в каждом коммите, и какой флаг grep считает совпадения вместо их вывода.", "hint": "git log --help, внутри поиск /stat; grep --help | grep count.", "solution": "<p><code>git log --stat<\/code> и <code>grep -c<\/code>.<\/p>"}, {"t": "sum", "items": ["--help и man вместо памяти; grep для текста, find для файлов; less, head, tail."]}], "cards": [{"q": "Как быстро узнать флаги команды?", "a": "команда --help или man команда (выход q)."}, {"q": "grep против find?", "a": "grep ищет текст внутри файлов, find ищет файлы."}]}, {"id": "t8l2", "title": "Исправляем ошибки в Git", "min": 15, "steps": [{"t": "intro", "h": "Ошибаются все", "body": "<p>Свободное владение Git это умение спокойно чинить ошибки. Главное правило: <b>не переписывать уже отправленную историю<\/b>.<\/p>"}, {"t": "word", "term": "Откатить файл", "node": "restore", "pt": "git restore", "simple": "Вернуть файл к состоянию из индекса или убрать файл из индекса.", "like": "Ластик для черновика.", "ex": "<code>git restore файл<\/code> выбросить несохранённые правки (безвозвратно!), <code>git restore --staged файл<\/code> убрать из индекса, файл не меняется.", "pro": "<p>Старые варианты: <code>git checkout -- файл<\/code> и <code>git reset HEAD файл<\/code>.<\/p>"}, {"t": "word", "term": "Поправить последний коммит", "node": "amend", "pt": "--amend", "simple": "Переделать последний коммит: другое сообщение или добавить забытый файл. Только если ещё не запушил.", "like": "Переписать последнюю страницу дневника, пока его никто не видел.", "ex": "<code>git commit --amend -m \"Новое сообщение\"<\/code>; забытый файл: <code>git add файл<\/code> и <code>git commit --amend --no-edit<\/code>.", "pro": "<p>amend создаёт <b>новый<\/b> коммит с новым хешем. Поэтому после push нельзя: у других уже старый.<\/p>"}, {"t": "word", "term": "Отменить коммит безопасно", "node": "revert", "pt": "git revert", "simple": "Создать новый коммит, который отменяет изменения указанного. История не переписывается, поэтому можно для отправленных коммитов.", "like": "Не вырывать страницу, а написать на следующей: «предыдущее отменяется».", "ex": "<code>git revert a1b2c3d<\/code>, потом обычный push.", "pro": "<p>Противоположность: <code>git reset --hard<\/code> двигает ветку назад и выбрасывает изменения, опасно и только для неотправленного. <code>git reset --soft HEAD~1<\/code> убирает последний коммит, оставив правки в индексе.<\/p>"}, {"t": "word", "term": "Спрятать правки", "node": "stash", "pt": "git stash", "simple": "Временно убрать незакоммиченные правки в «карман», чтобы переключиться на другую задачу, а потом вернуть.", "like": "Сгрести всё со стола в ящик, чтобы освободить место, а потом выложить обратно.", "ex": "<code>git stash<\/code>, переключиться, сделать дело, вернуться, <code>git stash pop<\/code>.", "pro": "<p>Список спрятанного: <code>git stash list<\/code>.<\/p>"}, {"t": "word", "term": "Журнал HEAD", "node": "reflog", "pt": "git reflog", "simple": "Журнал всех перемещений HEAD. Через него можно найти «потерянный» коммит после reset или amend.", "like": "Чёрный ящик самолёта: записано всё, куда ты переходил.", "ex": "<code>git reflog<\/code>, найти хеш, <code>git branch rescue хеш<\/code> или <code>git reset --hard хеш<\/code>.", "pro": "<p>Коммиты в Git почти никогда не исчезают сразу, их просто перестают показывать ветки.<\/p>"}, {"t": "check", "q": "Плохой коммит уже запушен, одногруппник его скачал. Что делать?", "o": ["git reset --hard и push --force", "git commit --amend", "git revert хеш и обычный push", "Удалить репозиторий"], "a": 2, "why": "revert дополняет историю, не ломая её у других."}, {"t": "task", "h": "Сломай и почини", "goal": "В песочнице: испорти файл и верни; добавь лишний файл в индекс и убери; закоммить с опечаткой «Ad g» и исправь; сделай коммит и отмени его revert; начни правку, спрячь в stash, верни.", "hint": "restore, restore --staged, commit --amend, revert, stash/stash pop.", "solution": "<pre>mkdir -p /tmp/gfix &amp;&amp; cd /tmp/gfix &amp;&amp; git init -q -b main\necho a &gt; f.txt &amp;&amp; git add f.txt &amp;&amp; git -c user.name=T -c user.email=t@t commit -qm \"Add f\"\necho мусор &gt; f.txt &amp;&amp; git restore f.txt\necho b &gt; g.txt &amp;&amp; git add g.txt &amp;&amp; git restore --staged g.txt\ngit add g.txt &amp;&amp; git -c user.name=T -c user.email=t@t commit -qm \"Ad g\" &amp;&amp; git -c user.name=T -c user.email=t@t commit --amend -qm \"Add g\"\necho c &gt;&gt; f.txt &amp;&amp; git -c user.name=T -c user.email=t@t commit -qam \"Change f\" &amp;&amp; git -c user.name=T -c user.email=t@t revert --no-edit HEAD\necho d &gt;&gt; f.txt &amp;&amp; git stash &amp;&amp; git status &amp;&amp; git stash pop\ngit log --oneline<\/pre>"}, {"t": "sum", "items": ["restore чинит файлы, amend последний неотправленный коммит, revert отправленный.", "stash прячет правки, reflog находит потерянное.", "Не переписывай отправленную историю."]}], "cards": [{"q": "Как выбросить правки файла, не добавленные в индекс?", "a": "git restore файл."}, {"q": "amend или revert для запушенного коммита?", "a": "revert: он не переписывает историю."}, {"q": "Что делает git stash?", "a": "Прячет незакоммиченные правки; git stash pop возвращает."}, {"q": "Как найти потерянный коммит?", "a": "git reflog."}]}, {"id": "t8l3", "title": "10 задач на новые ситуации", "min": 30, "steps": [{"t": "intro", "h": "Свободное владение проверяется незнакомым", "body": "<p>Песочница: сервер и два разработчика. Если запутался, создай заново.<\/p><pre>rm -rf ~/vpd-cases &amp;&amp; mkdir ~/vpd-cases &amp;&amp; cd ~/vpd-cases &amp;&amp; git init -q --bare -b main origin.git &amp;&amp; git clone -q origin.git a 2&gt;/dev/null &amp;&amp; cd a &amp;&amp; printf '# Cases\\n\\n**Status:** draft\\n' &gt; README.md &amp;&amp; git add README.md &amp;&amp; git commit -qm \"Initialize cases\" &amp;&amp; git push -qu origin main &amp;&amp; cd .. &amp;&amp; git clone -q origin.git b &amp;&amp; cd a<\/pre>"}, {"t": "task", "h": "Закоммитил бинарник", "goal": "В a собери любую C-программу в c/main и закоммить вместе с бинарником. Убери бинарник из отслеживания, оставив на диске, чтобы он больше не попадал в git.", "hint": "Правило в .gitignore плюс команда, перестающая отслеживать файл без удаления.", "solution": "<pre>echo 'c/main' &gt;&gt; .gitignore &amp;&amp; git rm --cached c/main &amp;&amp; git add .gitignore &amp;&amp; git commit -m \"Stop tracking C binary\"<\/pre>"}, {"t": "task", "h": "Push отклонён без конфликта", "goal": "b коммитит и пушит b.txt; a коммитит a.txt и пробует push. Почини.", "hint": "Сначала забрать чужое.", "solution": "<pre>git push   # rejected\ngit pull --no-rebase   # разные файлы, сольётся само\ngit push<\/pre>"}, {"t": "task", "h": "Конфликт в коде", "goal": "В a и b один calc.py с x = 304 * 1. a меняет на * ⟦N⟧, b на * 7, b пушит первым. Разреши в a, оставив ⟦N⟧, и <b>запусти<\/b> перед коммитом.", "hint": "После разрешения конфликта код надо проверить.", "solution": "<pre>git pull --no-rebase; nvim calc.py; python3 calc.py\ngit add calc.py &amp;&amp; git commit --no-edit &amp;&amp; git push<\/pre><p>Забытые маркеры ломают программу.<\/p>"}, {"t": "task", "h": "Запушенная ошибка", "goal": "В a закоммить и запушь удаление README. b уже сделал pull. Верни README, не переписывая историю.", "hint": "revert.", "solution": "<pre>git log --oneline -3; git revert --no-edit &lt;хеш&gt;; git push<\/pre>"}, {"t": "task", "h": "Срочный hotfix", "goal": "В a начни правку README (не коммить). Срочно сделай ветку hotfix, закоммить там fix.txt, влей в main и вернись к правке.", "hint": "stash, switch -c, merge, stash pop.", "solution": "<pre>git stash; git switch -c hotfix; echo fix &gt; fix.txt; git add fix.txt; git commit -m \"Add hotfix file\"\ngit switch main; git merge hotfix; git stash pop<\/pre><p>Тут merge будет fast-forward: main не менялась.<\/p>"}, {"t": "task", "h": "Кто и когда", "goal": "Найди, в каком коммите появилась текущая строка Status, и выведи README из самого первого коммита.", "hint": "blame; git show ревизия:путь.", "solution": "<pre>git blame README.md\ngit show $(git rev-list --max-parents=0 HEAD):README.md<\/pre>"}, {"t": "task", "h": "Старая версия и назад", "goal": "В своей лабе перейди на тег v1.0.0, убедись, что в README нет скринов, вернись на main.", "hint": "switch --detach.", "solution": "<pre>cd ~/Documents/vpd/lab01/dev &amp;&amp; git switch --detach v1.0.0 &amp;&amp; grep -c png README.md; git switch main<\/pre><p>Пока HEAD отсоединён, не коммить.<\/p>"}, {"t": "task", "h": "Удалить ветку везде", "goal": "В a создай ветку temp, запушь, удали локально и на сервере, проверь git branch -a.", "hint": "branch -d; push origin --delete; fetch --prune.", "solution": "<pre>git switch -c temp &amp;&amp; git push -u origin temp &amp;&amp; git switch main\ngit branch -d temp &amp;&amp; git push origin --delete temp &amp;&amp; git fetch --prune &amp;&amp; git branch -a<\/pre>"}, {"t": "task", "h": "Permission denied", "goal": "Создай run.sh с echo ok и запусти как ./run.sh. Почини двумя способами.", "hint": "Права x или явный интерпретатор.", "solution": "<pre>chmod +x run.sh &amp;&amp; ./run.sh\nbash run.sh<\/pre>"}, {"t": "task", "h": "14-й язык и версия", "goal": "В копии лабы (<code>cp -r ~/Documents/vpd/lab01/dev /tmp/labcopy<\/code>) добавь Lua в ветке feature/lua (<code>string.format(\"%s/%02d\", ...)<\/code>, запуск <code>lua lua/main.lua<\/code>), влей, допиши README и CHANGELOG, поставь тег. Какая версия по SemVer?", "hint": "Новая возможность без поломки: MINOR.", "solution": "<p>v1.1.0. Не пушь из копии: её origin это твой настоящий origin.git.<\/p>"}, {"t": "sum", "items": ["Ты решил задачи, которых не было в лабе: значит, понимаешь принципы, а не помнишь последовательность."]}], "cards": [{"q": "Как убрать закоммиченный бинарник из отслеживания?", "a": "Добавить в .gitignore, git rm --cached файл, коммит."}, {"q": "Что делать после разрешения конфликта в коде?", "a": "Собрать или запустить и только потом commit."}, {"q": "Как удалить ветку на сервере?", "a": "git push origin --delete имя."}]}]}]</script>
<script type="application/json" id="bank">{"topics": {"term": {"name": "Терминал", "mods": ["t2l1", "t2l2", "t2l3", "t2l4"]}, "exec": {"name": "Как выполняются программы", "mods": ["t1l1", "t1l2", "t1l3", "t1l4", "t1l5"]}, "lang": {"name": "Языки и визитные карточки", "mods": ["t3l1", "t3l2", "t3l3", "t3l4", "t3l5", "t3l6", "t3l9"]}, "enc": {"name": "Кодировки и кириллица", "mods": ["t4l1", "t4l2", "t4l3"]}, "asm": {"name": "Ассемблер", "mods": ["t3l7", "t3l8"]}, "gitb": {"name": "Git: коммиты, индекс, .gitignore", "mods": ["t5l1", "t5l2", "t5l3", "t5l4"]}, "gitr": {"name": "Git: origin, clone, push, pull", "mods": ["t6l1"]}, "gitbr": {"name": "Git: ветки, конфликт, тег", "mods": ["t6l2", "t6l3", "t6l4"]}, "free": {"name": "Свободное владение: за пределами лабы", "mods": ["t8l1", "t8l2", "t8l3"]}, "os": {"name": "Linux, macOS, Windows", "mods": ["t7l1", "t7l2"]}}, "q": [{"k": "term", "t": "cmd", "q": "Перейди в родительскую папку.", "ok": ["^cd \\.\\.$"], "s": "cd ..", "e": "Две точки означают родительскую папку."}, {"k": "term", "t": "cmd", "q": "Выведи подробный список файлов текущей папки, включая скрытые.", "ok": ["^ls (-la|-al|-l -a|-a -l|-lA|-Al|-alh|-lah)$"], "s": "ls -la", "e": "-l подробно, -a показать скрытые (имена с точки)."}, {"k": "term", "t": "cmd", "q": "Узнай архитектуру процессора (нужно для выбора варианта ассемблера).", "ok": ["^uname -m$"], "s": "uname -m", "e": "На твоём компе выводит x86_64."}, {"k": "term", "t": "cmd", "q": "Запусти python3 main.py так, чтобы вывод записался в файл out.txt (перезаписать файл).", "ok": ["^python3 main\\.py ?> ?out\\.txt$"], "s": "python3 main.py > out.txt", "e": "> перенаправляет стандартный вывод в файл и перезаписывает его, >> дописывает в конец."}, {"k": "term", "t": "out", "q": "Что выведет bash?\n\necho \"a b c\" | wc -w", "ok": ["3"], "s": "3", "e": "wc -w считает слова, pipe передаёт ему вывод echo."}, {"k": "term", "t": "out", "q": "Что выведет bash?\n\nfalse && echo yes; echo $?", "ok": ["1"], "s": "1 то делает линковщик?", "o": ["Проверяет стиль кода", "Склеивает объектные файлы и библиотеки в исполняемый файл и проставляет адреса функций", "Переводит текст в байт-код", "Скачивает зависимости"], "a": 1, "e": "Например, подключает libc, где лежат printf и puts."}, {"k": "exec", "t": "mc", "q": "Что такое JIT?", "o": ["Компиляция байт-кода в машинный код прямо во время выполнения", "Препроцессор C", "Формат исполняемых файлов", "Отладчик"], "a": 0, "e": "Just-In-Time: так работают JVM, .NET и V8."}, {"k": "exec", "t": "mc", "q": "file assembler.o говорит «ELF 64-bit relocatable». Что это значит?", "o": ["Готовая программа", "Объектный файл: машинный код есть, но адреса не проставлены, нужна линковка", "Скрипт", "Сжатый архив"], "a": 1, "e": "Запустить .o нельзя, сначала gcc assembler.o -o assembler."}, {"k": "exec", "t": "cmd", "q": "Покажи байт-код класса Main (ты в папке с Main.class).", "ok": ["^javap -c Main(\\.class)?$"], "s": "javap -c Main", "e": "javap дизассемблирует .class, -c показывает инструкции."}, {"k": "exec", "t": "cmd", "q": "Собери main.c в программу prog с основными предупреждениями компилятора.", "ok": ["^gcc(?=.*\\s-Wall\\b)(?=.*\\s-o\\s+prog\\b)(?=.*\\smain\\.c\\b).*$"], "s": "gcc -Wall -Wextra -pedantic main.c -o prog", "e": "-Wall включает основные предупреждения, -o задаёт имя результата."}, {"k": "lang", "t": "out", "q": "Что выведет Python?\n\nprint(f\"{7:02d}\")", "ok": ["07"], "s": "07", "e": "Ширина 2, заполнение нулями."}, {"k": "lang", "t": "out", "q": "Что выведет JavaScript?\n\nconsole.log(\"⟦EN⟧\".length)", "ok": ["⟦EN_LEN⟧"], "s": "⟦EN_LEN⟧", "e": "⟦EN_LETTERSW⟧ и ⟦EN_SPW⟧."}, {"k": "lang", "t": "out", "q": "Что получится в F#?\n\n[|⟦EN_LENS_FS⟧|] |> Array.sum", "ok": ["⟦EN_LETTERS⟧"], "s": "⟦EN_LETTERS⟧", "e": "|> передаёт массив в Array.sum."}, {"k": "lang", "t": "out", "q": "Что выведет bash?\n\necho -n \"⟦EN⟧\" | wc -c", "ok": ["⟦EN_LEN⟧"], "s": "⟦EN_LEN⟧", "e": "-n убирает перевод строки, иначе было бы ⟦EN_LEN1⟧."}, {"k": "lang", "t": "out", "q": "Что ответит Prolog на запрос?\n\n?- X is 304 * 2.", "ok": ["608", "x = 608", "x = 608.", "x=608"], "s": "X = 608.", "e": "is вычисляет арифметическое выражение."}, {"k": "lang", "t": "mc", "q": "Что значит {student.Number:D2} в C#?", "o": ["Разделить на 2", "Целое минимум в 2 цифры с ведущим нулём", "Дробь с 2 знаками", "Вывести 2 раза"], "a": 1, "e": "Аналог %02d."}, {"k": "lang", "t": "mc", "q": "Почему в Rust пишут println! с восклицательным знаком?", "o": ["Это макрос", "Это значит «срочно»", "Без перевода строки", "Это unsafe"], "a": 0, "e": "Макросы раскрываются при компиляции и проверяют формат."}, {"k": "lang", "t": "mc", "q": "Что делает x := 5 в Go?", "o": ["Сравнивает x с 5", "Объявляет константу", "Объявляет переменную, выводя тип из значения (только внутри функции)", "Присваивает уже объявленной переменной"], "a": 2, "e": "Короткое объявление, визитная карточка Go."}, {"k": "lang", "t": "mc", "q": "Что будет с interface Student после tsc?", "o": ["Станет классом", "Исчезнет, типы стираются", "Попадёт в комментарий", "Станет JSON"], "a": 1, "e": "Интерфейсы нужны только для проверки при компиляции."}, {"k": "lang", "t": "mc", "q": "В Prolog Number и number это одно и то же?", "o": ["Да", "Нет: с большой буквы это переменная, с маленькой атом", "Нет: number это функция", "Prolog не различает регистр"], "a": 1, "e": "Переменные начинаются с заглавной буквы или _."}, {"k": "lang", "t": "mc", "q": "Что сделает строка name = \"x\" в bash?", "o": ["Создаст переменную", "Попробует запустить команду name", "Сравнит строки", "Ничего"], "a": 1, "e": "Пробелы вокруг = недопустимы при присваивании."}, {"k": "lang", "t": "mc", "q": "Чем snprintf лучше sprintf?", "o": ["Быстрее", "Знает размер буфера и не пишет за его границу", "Поддерживает %02d", "Печатает на экран"], "a": 1, "e": "Защита от переполнения буфера."}, {"k": "lang", "t": "cmd", "q": "Запусти Prolog-файл main.pl: без приветствия, выполнить цель main и выйти.", "ok": ["^swipl(?=.*\\s-q\\b)(?=.*\\s-s\\s+main\\.pl\\b)(?=.*\\s-g\\s+main\\b)(?=.*\\s-t\\s+halt\\b).*$"], "s": "swipl -q -s main.pl -g main -t halt", "e": "-q тихо, -s загрузить, -g цель, -t halt выйти."}, {"k": "enc", "t": "out", "q": "Сколько байт выведет команда?\n\nprintf 'Привет' | wc -c", "ok": ["12"], "s": "12", "e": "6 кириллических букв по 2 байта в UTF-8."}, {"k": "enc", "t": "out", "q": "А эта?\n\nprintf 'Привет' | wc -m", "ok": ["6"], "s": "6", "e": "-m считает символы, а не байты."}, {"k": "enc", "t": "mc", "q": "Почему в консоли Windows без исправления русский текст из C превращается в кракозябры?", "o": ["gcc не поддерживает кириллицу", "Программа выводит байты UTF-8, а консоль читает их как cp866", "Windows не умеет UTF-8", "Нужен wchar_t"], "a": 1, "e": "Кодировки исходника и консоли не совпадают."}, {"k": "enc", "t": "mc", "q": "Что делает SetConsoleOutputCP(CP_UTF8)?", "o": ["Перекодирует исходник", "Переключает кодировку вывода консоли Windows на UTF-8", "Включает русскую раскладку", "Ничего на Windows"], "a": 1, "e": "То же для ввода делает SetConsoleCP."}, {"k": "enc", "t": "mc", "q": "Зачем вызовы SetConsole... обёрнуты в #ifdef _WIN32?", "o": ["Для скорости", "Чтобы этот код компилировался только под Windows, а на Linux его не было", "Чтобы он выполнялся дважды", "Так требует printf"], "a": 1, "e": "На Linux нет windows.h, и этот код не нужен."}, {"k": "enc", "t": "mc", "q": "Почему проблему кириллицы задание выделяет именно для C/C++?", "o": ["Они старые", "Они выводят байты как есть, без знания о кодировке; среды Python/Java/.NET сами перекодируют", "В них нет строк", "Они не поддерживают Unicode в принципе"], "a": 1, "e": "Строка в C это просто массив байтов."}, {"k": "enc", "t": "mc", "q": "Латинская M и кириллическая М в UTF-8:", "o": ["Одинаковые байты", "Разные: 4d и d0 9c", "Обе по 2 байта", "Обе по 1 байту"], "a": 1, "e": "Поэтому в asm группа записана латиницей, чтобы было чистое ASCII."}, {"k": "enc", "t": "mc", "q": "Что делает chcp 65001 в Windows?", "o": ["Меняет кодовую страницу текущей консоли на UTF-8", "Удаляет кракозябры из файла", "Устанавливает шрифт", "Перезапускает консоль"], "a": 0, "e": "65001 это номер кодовой страницы UTF-8."}, {"k": "asm", "t": "mc", "q": "Почему в Linux-версии адрес строки кладут в rdi?", "o": ["Это регистр для строк", "По System V ABI первый аргумент функции передаётся в rdi", "rdi самый быстрый", "puts так требует везде"], "a": 1, "e": "На Windows первый аргумент передаётся в rcx."}, {"k": "asm", "t": "mc", "q": "Что делает xor eax, eax перед ret?", "o": ["Очищает экран", "Обнуляет eax, то есть main возвращает 0", "Выравнивает стек", "Вызывает puts"], "a": 1, "e": "Возвращаемое значение функции лежит в rax/eax."}, {"k": "asm", "t": "mc", "q": "Что такое .asciz?", "o": ["Строка с нулевым байтом в конце", "Комментарий", "Секция кода", "Регистр"], "a": 0, "e": "puts печатает до нулевого байта."}, {"k": "asm", "t": "mc", "q": "Зачем .globl main?", "o": ["Сделать main видимым линковщику и стартовому коду libc", "Объявить глобальную переменную", "Ускорить программу", "Подключить libc"], "a": 0, "e": "Без этого линковщик не найдёт main."}, {"k": "asm", "t": "mc", "q": "Зачем адресация [rip + message]?", "o": ["Так короче", "Программа PIE грузится по любому адресу, а смещение строки от кода известно заранее", "Это требование Intel синтаксиса", "Для Windows"], "a": 1, "e": "Абсолютный адрес заранее неизвестен."}, {"k": "asm", "t": "mc", "q": "Что делает gcc assembler.o -o assembler?", "o": ["Компилирует C", "Линкует объектный файл с libc и стартовым кодом", "Ассемблирует .s", "Запускает программу"], "a": 1, "e": "Ассемблирует as, линкует gcc (через ld)."}, {"k": "asm", "t": "mc", "q": "Почему в Windows-шаблоне sub rsp, 40?", "o": ["40 байт под строку", "32 байта shadow space по Microsoft x64 ABI плюс 8 для выравнивания стека", "Так быстрее", "Ошибка в шаблоне"], "a": 1, "e": "call уже сдвинул стек на 8, нужно выровнять на 16."}, {"k": "asm", "t": "mc", "q": "Что значит .intel_syntax noprefix?", "o": ["Синтаксис Intel и регистры без %", "Только процессоры Intel", "Без префиксов команд", "Отключить AT&T процессоры"], "a": 0, "e": "По умолчанию GNU as использует синтаксис AT&T."}, {"k": "asm", "t": "cmd", "q": "Собери assembler.s в объектный файл assembler.o.", "ok": ["^as assembler\\.s -o assembler\\.o$", "^as -o assembler\\.o assembler\\.s$"], "s": "as assembler.s -o assembler.o", "e": "as это GNU Assembler."}, {"k": "gitb", "t": "cmd", "q": "Добавь в индекс только README.md.", "ok": ["^git add README\\.md$"], "s": "git add README.md", "e": "Конкретный путь, не git add ."}, {"k": "gitb", "t": "cmd", "q": "Создай коммит с сообщением Add C implementation.", "ok": ["^git commit -m [\\\"']Add C implementation[\\\"']$"], "s": "git commit -m \"Add C implementation\"", "e": "-m передаёт сообщение без открытия редактора."}, {"k": "gitb", "t": "cmd", "q": "Покажи разницу между индексом и последним коммитом (что войдёт в коммит).", "ok": ["^git diff (--staged|--cached)$"], "s": "git diff --staged", "e": "Без флага git diff сравнивает рабочую директорию с индексом."}, {"k": "gitb", "t": "cmd", "q": "Убери c/main.c из индекса, не трогая сам файл.", "ok": ["^git restore --staged c/main\\.c$", "^git reset( HEAD)? (-- )?c/main\\.c$"], "s": "git restore --staged c/main.c", "e": "Файл останется изменённым, но не войдёт в коммит."}, {"k": "gitb", "t": "cmd", "q": "Покажи историю: одна строка на коммит, графом, все ветки, с метками веток и тегов.", "ok": ["^git log(?=.*--oneline)(?=.*--graph)(?=.*--all)(?=.*--decorate).*$"], "s": "git log --oneline --graph --all --decorate", "e": "Это одна из четырёх команд финальной проверки."}, {"k": "gitb", "t": "mc", "q": "Ты изменил README и сделал git add README.md. Что покажет git diff без флагов?", "o": ["Изменения README", "Ничего", "Ошибку", "Весь файл"], "a": 1, "e": "Рабочая директория уже совпадает с индексом."}, {"k": "gitb", "t": "mc", "q": "git commit -am \"...\" при новом файле lua/main.lua (ни разу не добавленном):", "o": ["Закоммитит и его", "Не закоммитит: -a берёт только уже отслеживаемые файлы", "Выдаст ошибку", "Добавит его в .gitignore"], "a": 1, "e": "Новые файлы нужно добавить явно через git add."}, {"k": "gitb", "t": "mc", "q": "Бинарник c/main уже закоммичен. Ты добавил c/main в .gitignore. Что будет?", "o": ["Git сам удалит его из репозитория", "Ничего: .gitignore не действует на отслеживаемые файлы, нужен git rm --cached c/main", "Файл удалится с диска", "Коммит откатится"], "a": 1, "e": "После git rm --cached и коммита файл перестанет отслеживаться."}, {"k": "gitb", "t": "mc", "q": "Почему csharp.csproj хранится в git, а csharp/bin/ нет?", "o": ["csproj маленький", "csproj это описание проекта, без него не собрать; bin/ это результат сборки", "bin/ секретный", "Случайно"], "a": 1, "e": "Храним то, из чего собирается проект; не храним то, что получается сборкой."}, {"k": "gitr", "t": "cmd", "q": "Создай голый репозиторий server.git с веткой по умолчанию main.", "ok": ["^git init(?=.*\\s--bare\\b)(?=.*\\s(--initial-branch[= ]main|-b main)\\b).*\\sserver\\.git$"], "s": "git init --bare --initial-branch=main server.git", "e": "--bare без рабочей директории."}, {"k": "gitr", "t": "cmd", "q": "Склонируй server.git в папку work так, чтобы объекты копировались, а не связывались жёсткими ссылками.", "ok": ["^git clone --no-hardlinks server\\.git work$", "^git clone server\\.git work --no-hardlinks$"], "s": "git clone --no-hardlinks server.git work", "e": "Так клон независим, как будто он с настоящего сервера."}, {"k": "gitr", "t": "cmd", "q": "Отправь main в origin и запомни связь, чтобы потом писать просто git push.", "ok": ["^git push (-u|--set-upstream) origin main$"], "s": "git push -u origin main", "e": "-u настраивает upstream."}, {"k": "gitr", "t": "cmd", "q": "Покажи список удалённых репозиториев с адресами.", "ok": ["^git remote -v$"], "s": "git remote -v", "e": ""}, {"k": "gitr", "t": "mc", "q": "Чем bare-репозиторий отличается от обычного?", "o": ["Нет рабочей директории, только данные Git", "Нельзя делать коммиты в историю вообще", "Нет веток", "Он только на GitHub"], "a": 0, "e": "Его используют как центральный, в него пушат."}, {"k": "gitr", "t": "mc", "q": "git push выдал: rejected ... (fetch first). Почему?", "o": ["Нет интернета", "На origin есть коммиты, которых нет у тебя; сначала нужно их забрать", "Ветка удалена", "Неверный пароль"], "a": 1, "e": "git pull --no-rebase, при необходимости разрешить конфликт, потом push."}, {"k": "gitr", "t": "mc", "q": "Чем git fetch отличается от git pull?", "o": ["Ничем", "fetch только скачивает и обновляет origin/main; pull ещё и сливает с текущей веткой", "fetch отправляет коммиты", "pull работает только с тегами"], "a": 1, "e": "pull = fetch + merge (или rebase)."}, {"k": "gitr", "t": "mc", "q": "Что такое origin/main?", "o": ["Ветка на твоём компе, которую ты редактируешь", "Запись о том, где была main на origin при последнем обмене (remote-tracking ветка)", "Тег", "Папка"], "a": 1, "e": "Обновляется при fetch, pull и push."}, {"k": "gitr", "t": "mc", "q": "Что сам настраивает git clone?", "o": ["Ничего", "Remote origin, указывающий на источник, и ветку, связанную с origin/main", ".gitignore", "Тег v1.0.0"], "a": 1, "e": "Поэтому после clone сразу работают git pull и git push."}, {"k": "gitbr", "t": "cmd", "q": "Создай ветку feature/rust и сразу переключись на неё.", "ok": ["^git (switch -c|switch --create|checkout -b) feature/rust$"], "s": "git switch -c feature/rust", "e": "Старый вариант: git checkout -b."}, {"k": "gitbr", "t": "cmd", "q": "Влей ветку feature/rust в текущую.", "ok": ["^git merge( --no-edit)? feature/rust$"], "s": "git merge feature/rust", "e": ""}, {"k": "gitbr", "t": "cmd", "q": "Отмени начатое слияние, которое закончилось конфликтом.", "ok": ["^git merge --abort$"], "s": "git merge --abort", "e": "Всё вернётся как было до merge/pull."}, {"k": "gitbr", "t": "cmd", "q": "Создай аннотированный тег v2.0.0 с сообщением Release.", "ok": ["^git tag(?=.*\\s-a\\s+v2\\.0\\.0\\b)(?=.*\\s-m\\s+[\\\"']Release[\\\"']).*$", "^git tag(?=.*\\s-a\\b)(?=.*\\sv2\\.0\\.0\\b)(?=.*\\s-m\\s+[\\\"']Release[\\\"']).*$"], "s": "git tag -a v2.0.0 -m \"Release\"", "e": "-a аннотированный, -m сообщение."}, {"k": "gitbr", "t": "cmd", "q": "Отправь тег v2.0.0 в origin.", "ok": ["^git push origin v2\\.0\\.0$", "^git push( origin)? --tags$"], "s": "git push origin v2.0.0", "e": "Обычный git push теги не отправляет."}, {"k": "gitbr", "t": "mc", "q": "Что такое ветка в Git?", "o": ["Копия файлов", "Подвижный указатель на коммит", "Отдельный репозиторий", "Папка"], "a": 1, "e": "При коммите указатель текущей ветки сдвигается вперёд."}, {"k": "gitbr", "t": "mc", "q": "Когда merge делается fast-forward?", "o": ["Всегда", "Когда текущая ветка не ушла вперёд с момента ответвления", "Когда есть конфликт", "Когда используется -u"], "a": 1, "e": "Метка просто передвигается вперёд, без merge-коммита."}, {"k": "gitbr", "t": "mc", "q": "Что между <<<<<<< HEAD и =======?", "o": ["Вариант origin", "Твой вариант (текущей ветки)", "Общий предок", "Сообщение коммита"], "a": 1, "e": "Ниже ======= вариант вливаемой стороны."}, {"k": "gitbr", "t": "mc", "q": "Как завершить разрешение конфликта в README.md?", "o": ["git resolve", "Убрать маркеры, git add README.md, git commit", "git push --force", "git merge --abort"], "a": 1, "e": "git add помечает файл как разрешённый."}, {"k": "gitbr", "t": "mc", "q": "Чем тег отличается от ветки?", "o": ["Ничем", "Тег всегда на одном коммите, ветка двигается с новыми коммитами", "Тег нельзя отправить", "Ветка нужна для релизов"], "a": 1, "e": ""}, {"k": "gitbr", "t": "mc", "q": "Сколько родителей у merge-коммита?", "o": ["0", "1", "2", "Сколько веток в репозитории"], "a": 2, "e": "Последний коммит текущей ветки и последний коммит вливаемой."}, {"k": "free", "t": "cmd", "q": "Выбрось изменения в README.md, которые ещё не добавлены в индекс.", "ok": ["^git restore README\\.md$", "^git checkout -- README\\.md$"], "s": "git restore README.md", "e": "Осторожно: эти изменения пропадут безвозвратно."}, {"k": "free", "t": "cmd", "q": "Поменяй сообщение последнего, ещё не отправленного коммита на Add Go implementation.", "ok": ["^git commit --amend -m [\\\"']Add Go implementation[\\\"']$"], "s": "git commit --amend -m \"Add Go implementation\"", "e": "amend переписывает последний коммит, поэтому только если он не запушен."}, {"k": "free", "t": "cmd", "q": "Создай коммит, который отменяет изменения коммита a1b2c3d (он уже запушен).", "ok": ["^git revert a1b2c3d$", "^git revert --no-edit a1b2c3d$"], "s": "git revert a1b2c3d", "e": "revert не переписывает историю, поэтому безопасен для отправленных коммитов."}, {"k": "free", "t": "cmd", "q": "Найди строку Status во всех файлах текущей папки и подпапок, с номерами строк.", "ok": ["^grep\\s+(-rn|-nr|-r\\s+-n|-n\\s+-r|-Rn|-nR)\\s+[\\\"']?Status[\\\"']?(\\s+\\.)?$"], "s": "grep -rn Status .", "e": "-r рекурсивно, -n номера строк."}, {"k": "free", "t": "cmd", "q": "Найди все файлы с расширением .c в текущей папке и подпапках.", "ok": ["^find \\. -name [\\\"']?\\*\\.c[\\\"']?$", "^find \\. -type f -name [\\\"']?\\*\\.c[\\\"']?$"], "s": "find . -name '*.c'", "e": "Кавычки нужны, чтобы оболочка сама не раскрыла *.c."}, {"k": "free", "t": "cmd", "q": "Сделай script.sh исполняемым.", "ok": ["^chmod (\\+x|u\\+x|a\\+x|755|744|700) script\\.sh$"], "s": "chmod +x script.sh", "e": "После этого можно запускать ./script.sh."}, {"k": "free", "t": "cmd", "q": "Покажи содержимое README.md в той версии, которая отмечена тегом v1.0.0.", "ok": ["^git show v1\\.0\\.0:README\\.md$"], "s": "git show v1.0.0:README.md", "e": "Формат ревизия:путь."}, {"k": "free", "t": "cmd", "q": "Открой встроенную справку по git merge.", "ok": ["^git help merge$", "^git merge --help$", "^man git-merge$"], "s": "git help merge", "e": "Выход из справки клавишей q."}, {"k": "free", "t": "mc", "q": "Ты на ветке с незакоммиченными правками, но срочно нужно переключиться на другую. Что подходит?", "o": ["git reset --hard", "git stash, переключиться, вернуться, git stash pop", "Удалить папку", "git push --force"], "a": 1, "e": "stash временно убирает правки в «карман»."}, {"k": "free", "t": "mc", "q": "Чем опасен git reset --hard?", "o": ["Ничем", "Выбрасывает незакоммиченные изменения безвозвратно и может откатить ветку", "Удаляет репозиторий на сервере", "Удаляет теги"], "a": 1, "e": "Перед ним всегда смотри git status."}, {"k": "free", "t": "mc", "q": "git switch --detach v1.0.0, и Git пишет про detached HEAD. Что это?", "o": ["Ошибка", "HEAD указывает прямо на коммит, а не на ветку; новые коммиты здесь не попадут ни в какую ветку", "Репозиторий повреждён", "Тег удалён"], "a": 1, "e": "Вернуться: git switch main."}, {"k": "free", "t": "mc", "q": "./script.sh выдаёт Permission denied. Что делать?", "o": ["sudo rm", "chmod +x script.sh или запускать bash script.sh", "Переименовать в .exe", "git add"], "a": 1, "e": "У файла нет права на выполнение."}, {"k": "os", "t": "mc", "q": "Почему бинарник c/main с твоего Linux не запустится на Windows, а Main.class запустится?", "o": ["Нет расширения .exe", "c/main это ELF с машинным кодом и вызовами Linux, а .class байт-код для JVM, которая есть на любой ОС", "На Windows нет C", "Запустится, если переименовать"], "a": 1, "e": "Форматы ELF, Mach-O и PE разные, байт-код от ОС не зависит."}, {"k": "os", "t": "mc", "q": "Bash-скрипт, написанный в Блокноте на Windows, на Linux падает с $'\\r': command not found. Почему?", "o": ["Нет прав x", "Переводы строк CRLF, bash принимает \\r за часть команды", "Нет shebang", "Неправильная кодировка кириллицы"], "a": 1, "e": "Чинится сохранением с LF или правилом в .gitattributes."}, {"k": "os", "t": "mc", "q": "Что на самом деле запускает команда gcc на macOS?", "o": ["GCC", "Apple Clang", "MSVC", "Ничего"], "a": 1, "e": "Ставится через xcode-select --install."}, {"k": "os", "t": "mc", "q": "Почему в консоли Windows нужна возня с кодировкой, а в Linux и macOS нет?", "o": ["Windows не поддерживает Unicode", "Консоль Windows ради совместимости стартует в старой кодовой странице (cp866), Unix-системы целиком в UTF-8", "В Linux нет кириллицы", "Из-за PowerShell"], "a": 1, "e": ""}, {"k": "os", "t": "mc", "q": "Чем ассемблер для Mac на Apple Silicon принципиально отличается от твоего?", "o": ["Только синтаксисом комментариев", "Другая архитектура ARM64: другие регистры (x0), инструкции (bl, adrp), плюс имена _main/_puts", "Ничем", "Там нельзя вызывать puts"], "a": 1, "e": ""}, {"k": "os", "t": "mc", "q": "Чем для этой лабы отличаются CachyOS, Ubuntu и Fedora?", "o": ["Разными командами git", "Пакетным менеджером, названиями пакетов и свежестью версий", "Синтаксисом bash", "Форматом исполняемых файлов"], "a": 1, "e": "pacman / apt / dnf; роллинг-релиз против LTS."}, {"k": "os", "t": "mc", "q": "В PowerShell свою программу запускают как:", "o": ["prog.exe", ".\\prog.exe", "run prog", "./prog"], "a": 1, "e": "PowerShell, как и Unix-оболочки, не ищет программы в текущей папке."}, {"k": "os", "t": "mc", "q": "Разделитель путей в переменной PATH на Windows:", "o": [":", ";", "/", ","], "a": 1, "e": "В Unix двоеточие, отсюда и -cp a;b у Java на Windows."}, {"k": "os", "t": "mc", "q": "Как на Mac выведет echo \"a b c\" | wc -w?", "o": ["3", "число 3 с пробелами слева", "ошибку", "a b c"], "a": 1, "e": "BSD-версия wc выравнивает вывод пробелами; GNU нет."}, {"k": "os", "t": "mc", "q": "Какой файл macOS сыплет в каждую папку и его добавляют в .gitignore?", "o": ["Thumbs.db", ".DS_Store", "desktop.ini", "*.swp"], "a": 1, "e": "Thumbs.db и desktop.ini это Windows, *.swp это Vim."}, {"k": "os", "t": "cmd", "q": "На Windows из Git Bash нужно, чтобы bash/main.sh в репозитории получил бит исполняемости. Какая команда git это делает?", "ok": ["^git update-index --chmod=\\+x bash/main\\.sh$"], "s": "git update-index --chmod=+x bash/main.sh", "e": "На Windows Git не видит права файловой системы (core.fileMode=false)."}, {"k": "os", "t": "open", "q": "Что бы ты поменял в лабе, если бы делал её на Windows?", "model": "Git Bash или WSL для bash; MinGW-w64, бинарники .exe и *.exe в .gitignore; блок #ifdef _WIN32 с SetConsoleOutputCP реально нужен, консоль в cp866 (или chcp 65001); ассемблер под Microsoft x64 ABI: rcx, sub rsp, 40 (shadow space и выравнивание), .rdata; переводы строк LF для .sh; Thumbs.db/desktop.ini в .gitignore; команды git те же."}, {"k": "term", "t": "mc", "q": "Зачем запуск программы в Unix разделён на fork и exec?", "o": ["Так быстрее", "Между ними потомок настраивает себя (дескрипторы, папку, окружение), поэтому > и | работают для любой программы", "Из-за Windows", "exec не может создать процесс"], "a": 1, "e": "dup2 между fork и exec перенаправляет stdout в файл или pipe."}, {"k": "term", "t": "mc", "q": "Почему cd не может быть внешней программой?", "o": ["Она слишком маленькая", "Текущая папка это свойство процесса; внешний процесс сменит папку только себе", "Из соображений безопасности", "Так исторически"], "a": 1, "e": "Поэтому cd встроена в оболочку."}, {"k": "term", "t": "out", "q": "Что выведет команда, если файла nofile нет?\n\nls nofile | wc -l", "ok": ["0"], "s": "0", "e": "Ошибка идёт в stderr, а в pipe попадает только stdout. Сообщение ты увидишь, но wc получит 0 строк."}, {"k": "term", "t": "mc", "q": "Кто превращает *.c в список файлов в команде ls *.c?", "o": ["ls", "ядро", "оболочка, до запуска ls", "файловая система"], "a": 2, "e": "Программа получает уже готовые имена."}, {"k": "exec", "t": "mc", "q": "nm main.o показывает «U printf». Что это значит?", "o": ["printf удалён", "printf используется, но его кода в файле нет; его даст линковка", "printf встроен", "Ошибка компиляции"], "a": 1, "e": "U значит undefined."}, {"k": "exec", "t": "mc", "q": "Почему Node на числовом цикле в десятки раз быстрее CPython?", "o": ["JS проще Python", "V8 JIT-компилирует горячий цикл в машинный код с учётом реальных типов", "Node написан на C", "Python не компилируется"], "a": 1, "e": "С --jitless Node становится в разы медленнее."}, {"k": "exec", "t": "mc", "q": "Чем статически слинкованный бинарник отличается от динамического?", "o": ["Ничем", "Код нужных функций libc скопирован внутрь: файл больше, но не зависит от версии libc в системе", "Он медленнее", "Он не запускается на Linux"], "a": 1, "e": "У тебя 16 КБ против 907 КБ."}, {"k": "exec", "t": "mc", "q": "Чем байт-код JVM принципиально удобнее машинного кода для распространения программ?", "o": ["Он меньше", "Он не привязан к процессору и ОС и проверяется VM при загрузке", "Он быстрее", "Его не видно"], "a": 1, "e": ""}, {"k": "lang", "t": "mc", "q": "var x = 5; в C# это:", "o": ["Динамическая типизация", "Вывод типа: x навсегда int, проверяется при компиляции", "Ошибка", "Строка"], "a": 1, "e": "Не путай var с динамикой."}, {"k": "lang", "t": "out", "q": "Что выведет JavaScript?\n\nconsole.log(\"5\" * 2)", "ok": ["10"], "s": "10", "e": "Слабая типизация: строка неявно стала числом."}, {"k": "lang", "t": "mc", "q": "Что делает Rust без сборщика мусора, чтобы память была безопасной?", "o": ["Ничего", "Система владения: компилятор доказывает, что память освобождается один раз и не используется после освобождения", "Освобождает при выходе из программы", "Запрещает указатели"], "a": 1, "e": ""}, {"k": "enc", "t": "out", "q": "Что выведет JavaScript?\n\nconsole.log(\"😀\".length)", "ok": ["2"], "s": "2", "e": "UTF-16 хранит эмодзи суррогатной парой."}, {"k": "enc", "t": "mc", "q": "На экране «РџСЂРёРІРµС‚». Что произошло?", "o": ["Текст в cp866 прочитан как UTF-8", "Текст в UTF-8 прочитан как cp1251", "Файл повреждён", "Шрифт без кириллицы"], "a": 1, "e": "Узор «Р/С через букву» это UTF-8 в cp1251."}, {"k": "enc", "t": "mc", "q": "Почему strlen и printf из C работают с UTF-8 без доработки?", "o": ["Их обновили", "В UTF-8 нет нулевых байтов внутри символов, а ASCII кодируется как есть", "UTF-8 это ASCII", "Они не работают"], "a": 1, "e": ""}, {"k": "asm", "t": "mc", "q": "lea rdi,[rip+0xec0] по адресу 0x113d длиной 7 байт. Какой адрес попадёт в rdi?", "o": ["0xec0", "0x113d + 0xec0", "0x1144 + 0xec0 = 0x2004", "0x2000"], "a": 2, "e": "Смещение считается от следующей инструкции."}, {"k": "asm", "t": "mc", "q": "Зачем программы собирают как PIE?", "o": ["Они меньше", "Чтобы их можно было грузить по случайному адресу (ASLR) и усложнить эксплуатацию уязвимостей", "Для Windows", "Так быстрее"], "a": 1, "e": ""}, {"k": "asm", "t": "mc", "q": "Кто заполняет ячейку GOT для puts?", "o": ["Компилятор", "Ты в коде", "Загрузчик ld-linux при запуске", "Ядро при компиляции"], "a": 2, "e": "PLT-заглушка прыгает по адресу из GOT."}, {"k": "gitb", "t": "mc", "q": "Когда в .git/objects появляется blob нового файла?", "o": ["При git commit", "Уже при git add", "При git push", "При git status"], "a": 1, "e": "commit добавляет tree и commit-объекты."}, {"k": "gitb", "t": "mc", "q": "Что такое ветка main физически?", "o": ["Папка с копией файлов", "Файл .git/refs/heads/main с хешем коммита", "Запись на сервере", "Тег"], "a": 1, "e": ""}, {"k": "gitb", "t": "out", "q": "В пустом репозитории создали a.txt и b.txt с одинаковым текстом и сделали git add обоих. Сколько blob-объектов?", "ok": ["1"], "s": "1", "e": "Имя объекта это хеш содержимого; одинаковое содержимое хранится один раз."}, {"k": "gitb", "t": "mc", "q": "Почему git commit --amend меняет хеш коммита?", "o": ["Так задумано для красоты", "Хеш вычисляется от содержимого коммита (дерево, родитель, автор, время, сообщение); новое содержимое значит новый объект", "Из-за push", "Он не меняет"], "a": 1, "e": ""}, {"k": "gitbr", "t": "mc", "q": "Зачем при слиянии нужен общий предок (merge-base)?", "o": ["Для красоты графа", "Только сравнение с ним показывает, какая сторона меняла кусок; без него нельзя решить автоматически", "Чтобы найти автора", "Для push"], "a": 1, "e": "Трёхстороннее слияние."}, {"k": "gitbr", "t": "mc", "q": "Почему сервер отклоняет push, когда на нём есть чужие новые коммиты?", "o": ["Нет прав", "Передвинуть ветку на твой коммит значило бы потерять чужие коммиты; сервер принимает только fast-forward", "Сервер занят", "Нужно сделать tag"], "a": 1, "e": ""}, {"k": "gitbr", "t": "mc", "q": "Что лежит в индексе во время конфликта?", "o": ["Ничего", "Три версии файла: стадии 1 (base), 2 (ours), 3 (theirs)", "Только твоя версия", "Маркеры"], "a": 1, "e": "git add заменяет их одной записью стадии 0."}, {"k": "gitbr", "t": "mc", "q": "Слияние прошло без конфликтов. Значит ли это, что код рабочий?", "o": ["Да, всегда", "Нет: Git сливает строки, а не смысл; изменения в разных строках могут вместе сломать программу", "Да, если нет маркеров", "Только для Python"], "a": 1, "e": "Поэтому после merge код собирают и проверяют."}, {"k": "exec", "t": "open", "q": "Зачем Java компилирует в байт-код, а не сразу в машинный код? Что выигрывает и чем платит?", "model": "Байт-код не привязан к процессору и ОС: один .class работает везде, где есть JVM; JVM проверяет его при загрузке (безопасность); JIT оптимизирует горячий код под конкретный процессор и реальные данные. Платит временем старта и прогрева, памятью на VM/JIT/GC и необходимостью иметь JVM у пользователя."}, {"k": "gitb", "t": "open", "q": "Почему создание ветки мгновенное и почему нельзя незаметно поменять старый коммит?", "model": "Ветка это файл с хешем коммита, создать её значит записать 41 байт, объекты общие. Имя объекта это SHA-1 содержимого: изменение файла меняет хеш blob, tree, коммита и всех потомков (каждый хранит хеш родителя), поэтому подмена видна."}, {"k": "gitbr", "t": "open", "q": "Объясни, как Git решает, что брать при слиянии, и когда возникает конфликт.", "model": "Трёхстороннее слияние: ours и theirs сравниваются с общим предком base. Кусок, изменённый одной стороной, берётся с этой стороны; одинаково изменённый обеими берётся; изменённый обеими по-разному даёт конфликт, во время которого в индексе три стадии, а в файле маркеры."}, {"k": "exec", "t": "open", "q": "Объясни разницу между компиляцией, интерпретацией и байт-кодом на примерах из своей лабы.", "model": "C/C++/Rust/Go/asm компилируются заранее в машинный код, получается исполняемый файл. Python/Bash/Prolog/JS выполняет интерпретатор (или движок с JIT), отдельного файла нет. Java компилируется javac в .class с байт-кодом JVM, C#/F# в .dll с CIL; виртуальная машина выполняет байт-код и JIT-компилирует его. TypeScript транспилируется tsc в JavaScript."}, {"k": "enc", "t": "open", "q": "Как ты обеспечил вывод кириллицы в C/C++ и что было бы на Windows без этого?", "model": "Исходники в UTF-8, C выводит байты как есть. На Linux терминал и локаль UTF-8, поэтому всё совпадает. На Windows консоль в cp866, были бы кракозябры; поэтому под #ifdef _WIN32 подключён windows.h и вызваны SetConsoleCP(CP_UTF8) и SetConsoleOutputCP(CP_UTF8), альтернатива chcp 65001."}, {"k": "gitbr", "t": "open", "q": "Расскажи по шагам, как в лабе был получен и разрешён конфликт.", "model": "Второй клон second_dev. В dev и second_dev по-разному изменена строка Status, оба закоммитили; second_dev запушил первым. В dev git pull --no-rebase дал конфликт с маркерами <<<<<<< ======= >>>>>>>. Вручную оставил одну строку, убрал маркеры, git add README.md, git commit (merge-коммит), git push; в second_dev git pull получил итог."}, {"k": "gitr", "t": "open", "q": "Зачем в лабе bare-репозиторий и что делает git clone?", "model": "origin.git изображает сервер: bare, без рабочей директории, только данные Git; в него пушат. git clone копирует репозиторий, создаёт рабочую копию, настраивает remote origin на источник и связь main с origin/main. --no-hardlinks копирует объекты вместо жёстких ссылок."}, {"k": "gitb", "t": "open", "q": "Что такое индекс (staging area) и зачем он нужен?", "model": "Промежуточная зона между рабочей директорией и историей, черновик следующего коммита. git add кладёт туда версию файла, git commit делает снимок индекса. Позволяет собрать в коммит только связанные изменения и проверить их через git diff --staged."}, {"k": "asm", "t": "open", "q": "Объясни строки lea rdi, [rip + message] и call puts@PLT.", "model": "lea кладёт в rdi адрес строки, вычисленный относительно rip (нужно для PIE, адрес загрузки неизвестен заранее). rdi это первый аргумент по System V ABI. call puts@PLT вызывает puts из динамической libc через таблицу PLT, реальный адрес становится известен при запуске; puts печатает строку до нулевого байта и добавляет перевод строки."}, {"k": "lang", "t": "open", "q": "Что делают визитные карточки F# и Bash в твоей лабе и как они работают?", "model": "F#: studentNameEn.Split(' ') |> Array.map String.length даёт [⟦EN_LENS_C⟧], |> Array.sum = ⟦EN_LETTERSW⟧, |> Array.length = ⟦EN_WORDSW⟧; |> передаёт результат слева в функцию справа. Bash: echo \"$student_name_en\" | wc -w, pipe отдаёт вывод echo на вход wc, $(...) подставляет результат ⟦EN_WORDS⟧ в переменную; echo -n ... | wc -c даёт ⟦EN_LENB⟧."}, {"k": "free", "t": "open", "q": "Ты запушил коммит с ошибкой. Как его отменить и почему не через reset?", "model": "git revert <hash> создаёт новый коммит, отменяющий изменения, и его можно спокойно запушить. reset переписывает историю: у других она уже есть, push потребует --force и сломает им историю. reset/amend годятся только для неотправленных коммитов."}, {"k": "term", "t": "open", "q": "Что такое PATH и почему свою программу запускают как ./c/main?", "model": "PATH это переменная окружения со списком папок, где оболочка ищет программу по имени. Текущей папки там нет ради безопасности, поэтому свою программу запускают с явным путём ./c/main."}, {"k": "gitb", "t": "open", "q": "Препод показывает на *.class в .gitignore: почему это не хранится?", "model": "Это байт-код, который javac генерирует из Main.java, он восстанавливается сборкой; хранить его значит дублировать исходник в бинарном виде, он меняется при каждой пересборке и не сравнивается в diff. Правило: храним исходники и описание проекта, не храним результаты сборки."}]}</script>
