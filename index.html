 «1», «2»… это разные виды проблем.", "ex": "<code>return 0;<\/code> в C и <code>xor eax, eax<\/code> в твоём ассемблере как раз отдают 0. Посмотреть последний код: <code>echo $?<\/code> в bash, <code>echo $status<\/code> в fish.", "pro": "<p><b>exit code<\/b>, <b>exit status<\/b>, «код выхода». Почему 0 это успех: успех бывает один, а причин ошибки много, и ненулевые коды позволяют их различать. Например у grep: 0 нашёл, 1 не нашёл, 2 ошибка.<\/p>"}, {"t": "do", "h": "Посмотри коды", "task": "Выполни в bash (если ты в fish, сначала набери <code>bash<\/code>).", "cmd": "true; echo $?; false; echo $?; ls nofile; echo $?", "look": "0, 1 и код ошибки ls (обычно 2).", "explain": "<p><code>true<\/code> и <code>false<\/code> это программы, которые ничего не делают, кроме кода возврата 0 и 1. Ими удобно проверять логику.<\/p>"}, {"t": "word", "term": "Цепочки && и ||", "node": "chain", "pt": "&& · || · ;", "simple": "<code>A &amp;&amp; B<\/code>: выполнить B, только если A успешна. <code>A || B<\/code>: выполнить B, только если A провалилась. <code>A ; B<\/code>: выполнить обе по очереди в любом случае.", "like": "«Если сдал экзамен, И иди праздновать» против «если не сдал, ТО иди на пересдачу».", "ex": "<code>gcc c/main.c -o c/main &amp;&amp; ./c/main<\/code>: запускать имеет смысл, только если сборка прошла.", "pro": "<p>Это логические И/ИЛИ с <b>ленивым вычислением<\/b> (short-circuit evaluation): если по первой части результат уже ясен, вторая не выполняется. Так же работают <code>&amp;&amp;<\/code> и <code>||<\/code> в C, Java, JS.<\/p>"}, {"t": "predict", "q": "В main.c синтаксическая ошибка. Что сделает <code>gcc c/main.c -o c/main &amp;&amp; ./c/main<\/code>, если старый бинарник c/main остался с прошлого раза?", "o": ["Запустит старую версию", "Покажет ошибку компиляции и ничего не запустит", "Исправит ошибку"], "a": 1, "reveal": "<p>gcc завершится с ненулевым кодом, и <code>&amp;&amp;<\/code> не запустит правую часть. А вот с <code>;<\/code> вместо <code>&amp;&amp;<\/code> запустилась бы <b>старая<\/b> версия, и ты бы долго удивлялся, почему правки не работают.<\/p>"}, {"t": "check", "q": "Что выведет <code>false || echo запасной план<\/code>?", "o": ["Ничего", "запасной план", "false", "Ошибку"], "a": 1, "why": "false провалилась, поэтому || выполняет правую часть."}, {"t": "why", "q": "Почему 0 означает успех, а не ошибку? И как этим пользуется &&?", "model": "Успешный исход один, а причин неудачи много, поэтому успех закодирован одним значением 0, а разные ошибки разными ненулевыми кодами. && смотрит код возврата левой команды и запускает правую, только если он 0."}, {"t": "pro", "simple": "Если сборка завершилась удачно, запускаем программу, иначе нет.", "terms": ["exit code", "&&", "short-circuit"], "model": "Сборку и запуск связываю через &&: при ненулевом exit code компилятора short-circuit не даёт запустить бинарник."}, {"t": "sum", "items": ["Код возврата: 0 успех, не 0 ошибка; смотреть через $? (fish: $status).", "A && B: B только при успехе A; A || B: B только при неудаче A; ; выполняет всё.", "&& спасает от запуска старого бинарника после неудачной сборки."]}], "cards": [{"q": "Что такое код возврата?", "a": "Число при завершении программы: 0 успех, не 0 ошибка. В bash $?, в fish $status."}, {"q": "Чем && отличается от ;?", "a": "&& выполняет правую часть только при успехе левой; ; выполняет обе всегда."}, {"q": "Что делает A || B?", "a": "Выполняет B, только если A завершилась с ошибкой."}, {"q": "Почему 0 это успех?", "a": "Успех один, причин ошибки много; ненулевые коды различают ошибки."}]}, {"id": "t2l4", "title": "Потоки, перенаправления, pipe", "min": 15, "steps": [{"t": "intro", "h": "Как программы обмениваются данными", "body": "<p>Визитка Bash в лабе требовала настоящий pipe: <code>echo \"$student_name_en\" | wc -w<\/code>. Разберёмся, что такое вывод программы, куда он идёт и как его направить в другую программу.<\/p>"}, {"t": "word", "term": "Потоки ввода-вывода", "node": "streams", "pt": "stdin · stdout · stderr", "simple": "У каждой программы три «трубы»: вход (откуда читать), выход (куда писать результат) и выход ошибок (куда писать ошибки). По умолчанию все три подключены к терминалу.", "like": "Три лотка на столе сотрудника: «входящие», «исходящие» и «жалобы».", "ex": "printf в C, print в Python, echo в Bash пишут в обычный выход. Сообщения компилятора об ошибках идут в выход ошибок.", "pro": "<p><b>stdin<\/b> (0), <b>stdout<\/b> (1), <b>stderr<\/b> (2). Числа это <b>файловые дескрипторы<\/b> (file descriptors): номера открытых «файлов» процесса. Программа пишет в «дескриптор 1» и не знает, куда он ведёт.<\/p>"}, {"t": "word", "term": "Перенаправление", "node": "redirect", "pt": "> · >> · 2>", "simple": "Отправить поток не в терминал, а в файл (или взять вход из файла).", "like": "Сказать сотруднику: «исходящие складывай не мне на стол, а в эту папку».", "ex": "<code>python3 main.py &gt; out.txt<\/code> записывает вывод в файл (перезаписывает), <code>&gt;&gt;<\/code> дописывает в конец, <code>2&gt; err.txt<\/code> перенаправляет ошибки, <code>2&gt;&amp;1<\/code> отправляет ошибки туда же, куда вывод.", "pro": "<p><b>redirection<\/b>. <code>/dev/null<\/code> это «чёрная дыра»: <code>2&gt;/dev/null<\/code> выбрасывает ошибки. Говорят «перенаправь stderr в stdout», «залогируй вывод в файл».<\/p>"}, {"t": "word", "term": "Pipe", "node": "pipe", "pt": "pipe · |", "simple": "Соединить выход одной программы со входом другой, чтобы данные шли из первой прямо во вторую.", "like": "Конвейер на заводе: деталь с одного станка сразу едет на следующий.", "ex": "<code>echo \"⟦EN⟧\" | wc -w<\/code>: echo пишет имя, wc получает его на вход и считает слова, получается ⟦EN_WORDS⟧.", "pro": "<p><b>pipe<\/b>, <b>pipeline<\/b> (конвейер), знак <code>|<\/code>. Это механизм ядра ОС: буфер в памяти, обе программы работают <b>одновременно<\/b>. Так весь Unix построен на маленьких программах, которые соединяют в цепочки (философия Unix: «делай одну вещь хорошо»).<\/p>"}, {"t": "idea", "h": "Как bash строит pipe (реальный вывод с твоего компа)", "body": "<p>Вот что показала трассировка <code>strace<\/code> для <code>echo \"⟦EN⟧\" | wc -w<\/code>:<\/p><pre class=\"out\">pipe2([3, 4])          ← ядро создало трубу: 3 для чтения, 4 для записи\ndup2(4, 1)             ← процессу echo: «твой stdout теперь труба»\ndup2(3, 0)             ← процессу wc: «твой stdin теперь труба»\nexecve(\"/usr/bin/wc\", [\"wc\", \"-w\"])\n⟦EN_WORDS⟧<\/pre><p>Оболочка сначала подключает трубы, потом запускает программы. Сами echo и wc ничего не знают о трубе: echo пишет в «свой выход», wc читает «свой вход». Поэтому pipe и перенаправления работают с <b>любой<\/b> программой.<\/p>"}, {"t": "word", "term": "Подстановка команды", "node": "subst", "pt": "command substitution · $( )", "simple": "Выполнить команду и вставить её вывод как текст прямо в другую команду или в переменную.", "like": "Попросить помощника что-то посчитать и вписать ответ в бланк.", "ex": "<code>words=$(echo \"$student_name_en\" | wc -w)<\/code>: выполнить конвейер и положить результат «3» в переменную words.", "pro": "<p><b>command substitution<\/b>, синтаксис <code>$( )<\/code> (старый вариант обратные кавычки). В fish пишут просто <code>(команда)<\/code>. Отличие от pipe: pipe передаёт данные <b>на вход программе<\/b>, а <code>$( )<\/code> превращает вывод <b>в строку<\/b> внутри команды.<\/p>"}, {"t": "do", "h": "Собери визитку Bash руками", "task": "Выполни в bash по одной строке и смотри, что получается.", "cmd": "n=\"⟦EN⟧\"; echo \"$n\" | wc -w; echo -n \"$n\" | wc -c; words=$(echo \"$n\" | wc -w); echo \"слов: $words\"", "look": "⟦EN_WORDS⟧, ⟦EN_LEN⟧, «слов: ⟦EN_WORDS⟧».", "explain": "<p><code>wc -w<\/code> считает слова, <code>wc -c<\/code> байты. <code>echo -n<\/code> не добавляет перевод строки, иначе было бы ⟦EN_LEN1⟧. Ровно это и делает твой <code>bash/main.sh<\/code>.<\/p>"}, {"t": "predict", "q": "Файла nofile нет. Что выведет <code>ls nofile | wc -l<\/code>?", "o": ["1", "0 (и сообщение об ошибке на экране)", "Ошибку и ничего больше", "2"], "a": 1, "reveal": "<p>Ошибка ls идёт в <b>stderr<\/b>, а pipe передаёт только <b>stdout<\/b>. wc получает пустой вход и печатает 0, а сообщение об ошибке ты всё равно видишь в терминале. С <code>ls nofile 2&gt;&amp;1 | wc -l<\/code> ответ был бы 1.<\/p>"}, {"t": "order", "q": "Расставь по порядку, что делает оболочка со строкой <code>words=$(echo \"$n\" | wc -w)<\/code>:", "items": ["Подставляет значение переменной $n в строку", "Создаёт pipe между echo и wc", "Запускает echo и wc одновременно, echo пишет в трубу, wc читает", "Забирает вывод wc («3») как строку", "Кладёт строку «3» в переменную words"], "why": "<p>Обрати внимание: переменные подставляются <b>до<\/b> запуска программ. Программа никогда не видит <code>$n<\/code>, только готовый текст.<\/p>"}, {"t": "story", "h": "Картина целиком", "body": "<p>Ты набираешь строку в <b>эмуляторе терминала<\/b> (kitty). <b>Shell<\/b> (bash, fish) её разбирает: подставляет переменные, раскрывает <code>*<\/code> в имена файлов, режет по пробелам на <b>аргументы<\/b>. Если первое слово это <b>builtin<\/b> (cd), shell выполняет его сам. Иначе ищет программу: по пути, если есть слэш (<code>./c/main<\/code>), или по папкам из <b>PATH<\/b>.<\/p><p>Затем shell запускает <b>процесс<\/b> (fork + exec) и до запуска подключает его <b>потоки<\/b>: stdout в терминал, в файл (<code>&gt;<\/code>) или в <b>pipe<\/b> к следующей программе. Процессы конвейера работают одновременно. Каждый при завершении отдаёт <b>exit code<\/b>, и по нему <code>&amp;&amp;<\/code> и <code>||<\/code> решают, что запускать дальше. <code>$( )<\/code> превращает вывод в строку внутри команды.<\/p><p>Так одна строка вроде <code>gcc c/main.c -o c/main &amp;&amp; ./c/main | tee log.txt<\/code> оказывается маленькой программой из нескольких процессов.<\/p>"}, {"t": "why", "q": "Объясни своими словами, как работает <code>echo \"$name\" | wc -w<\/code> и почему он не посчитал бы ошибку, если бы echo её выдал.", "model": "Оболочка создаёт трубу, подключает к ней stdout процесса echo и stdin процесса wc и запускает их одновременно. echo пишет имя в трубу, wc читает его и считает слова. В трубу попадает только stdout; ошибки идут в stderr, который остаётся подключён к терминалу, поэтому wc их не увидит, если не перенаправить 2>&1."}, {"t": "pro", "simple": "Я соединил вывод одной программы со входом другой, а результат положил в переменную.", "terms": ["pipe", "stdout / stdin", "command substitution"], "model": "Через pipe stdout echo уходит на stdin wc, а command substitution $( ) кладёт вывод конвейера в переменную."}, {"t": "sum", "items": ["У процесса три потока: stdin (0), stdout (1), stderr (2).", "> >> 2> 2>&1 перенаправляют потоки в файлы.", "| соединяет stdout одной программы со stdin другой; обе работают одновременно.", "$( ) превращает вывод команды в строку.", "Программы не знают о перенаправлениях: их настраивает оболочка до запуска."]}], "cards": [{"q": "Назови три стандартных потока и их номера.", "a": "stdin 0 (вход), stdout 1 (вывод), stderr 2 (ошибки)."}, {"q": "Чем > отличается от >>?", "a": "> перезаписывает файл, >> дописывает в конец."}, {"q": "Что такое pipe?", "a": "Соединение stdout одной программы со stdin другой; обе работают одновременно."}, {"q": "Pipe против $( )?", "a": "Pipe передаёт данные на вход программе; $( ) вставляет вывод команды как текст."}, {"q": "Почему ls nofile | wc -l даёт 0?", "a": "Ошибка идёт в stderr, а в pipe попадает только stdout."}, {"q": "Что значит 2>&1?", "a": "Направить stderr туда же, куда сейчас идёт stdout."}]}, {"id": "t2l5", "title": "Neovim: минимум, чтобы не застрять", "min": 10, "steps": [{"t": "intro", "h": "Редактор в терминале", "body": "<p>Лабу ты делал в Neovim. Если на защите попросят что-то поправить при преподе, нужно уметь открыть файл, поменять строку, сохранить и выйти.<\/p>"}, {"t": "word", "term": "Режимы Vim", "node": "vimmodes", "pt": "normal · insert · command mode", "simple": "В Vim клавиши значат разное в зависимости от режима: в обычном они командуют, в режиме вставки печатают текст.", "like": "Пульт с переключателем: в одном положении кнопки переключают каналы, в другом набирают текст.", "ex": "<kbd>i<\/kbd> войти в режим вставки, <kbd>Esc<\/kbd> вернуться в обычный, <kbd>:<\/kbd> начать команду.", "pro": "<p><b>Normal mode<\/b>, <b>Insert mode<\/b>, <b>Command-line mode<\/b>. Отсюда вечный мем «как выйти из vim»: <code>:q<\/code>.<\/p>"}, {"t": "idea", "h": "Набор выживания", "body": "<div class=\"tbl\"><table><tr><th>Нужно<\/th><th>Клавиши<\/th><\/tr><tr><td>открыть файл<\/td><td><code>nvim README.md<\/code><\/td><\/tr><tr><td>печатать<\/td><td><kbd>i<\/kbd>, закончить <kbd>Esc<\/kbd><\/td><\/tr><tr><td>сохранить и выйти<\/td><td><code>:wq<\/code><\/td><\/tr><tr><td>выйти без сохранения<\/td><td><code>:q!<\/code><\/td><\/tr><tr><td>найти слово<\/td><td><code>/Status<\/code> Enter, дальше <kbd>n<\/kbd><\/td><\/tr><tr><td>удалить строку<\/td><td><kbd>d<\/kbd><kbd>d<\/kbd><\/td><\/tr><tr><td>отменить<\/td><td><kbd>u<\/kbd><\/td><\/tr><tr><td>к строке 7<\/td><td><code>:7<\/code><\/td><\/tr><\/table><\/div><p>Если запустить <code>git commit<\/code> без <code>-m<\/code>, Git откроет этот редактор для сообщения: напиши текст, <kbd>Esc<\/kbd>, <code>:wq<\/code>.<\/p>"}, {"t": "check", "q": "Ты в Neovim набираешь текст. Как сохранить и выйти?", "o": ["Ctrl+S", "Esc, потом :wq", "Ctrl+C", "q"], "a": 1, "why": "Сначала Esc выходит из режима вставки, потом команда :wq."}, {"t": "task", "h": "Поправь строку как на защите", "goal": "Создай файл <code>/tmp/s.md<\/code> со строкой <code>Status: draft<\/code>, открой его в nvim, замени draft на ready, сохрани, выйди и выведи файл в терминал.", "hint": "Создать файл можно через echo и >. В nvim: найти слово через /, заменить слово cw.", "solution": "<pre>echo 'Status: draft' &gt; /tmp/s.md\nnvim /tmp/s.md\n/draft  Enter,  cw  ready  Esc,  :wq\ncat /tmp/s.md<\/pre><p>Должно вывести <code>Status: ready<\/code>.<\/p>"}, {"t": "sum", "items": ["В Vim режимы: Normal, Insert (i), команды (:).", "Сохранить и выйти :wq, выйти без сохранения :q!.", "git commit без -m открывает редактор."]}], "cards": [{"q": "Как выйти из Neovim с сохранением и без?", "a": ":wq и :q! (после Esc)."}, {"q": "Как начать печатать в Vim?", "a": "Нажать i (режим вставки)."}]}, {"id": "t2l6", "title": "Практика: терминал сам", "min": 12, "steps": [{"t": "intro", "h": "Терминал без подсказок", "body": "<p>Четыре задания. Делай в bash (если ты в fish, набери <code>bash<\/code>).<\/p>"}, {"t": "task", "h": "Найди всё про свою лабу", "goal": "В папке лабы dev: найди все файлы <code>main.*<\/code> (кроме .git), все строки с числом 304 с номерами строк, и посчитай, сколько всего строк во всех main.*.", "hint": "find ищет файлы по имени, grep -rn ищет текст, wc -l считает строки; xargs превращает список в аргументы.", "solution": "<pre>cd ~/Documents/vpd/lab01/dev\nfind . -name 'main.*' -not -path './.git/*'\ngrep -rn 304 --exclude-dir=.git .\nfind . -name 'main.*' -not -path './.git/*' | xargs wc -l<\/pre>"}, {"t": "task", "h": "Собери лог для отчёта", "goal": "Одной строкой: запусти Python-программу лабы так, чтобы её вывод и сразу же вывод ошибок попали в файл <code>/tmp/run.log<\/code>, а потом допиши в конец этого же файла вывод <code>git log --oneline<\/code>.", "hint": "> перезаписывает, >> дописывает, 2>&1 отправляет ошибки туда же.", "solution": "<pre>python3 python/main.py &gt; /tmp/run.log 2&gt;&amp;1 &amp;&amp; git log --oneline &gt;&gt; /tmp/run.log\ncat /tmp/run.log<\/pre>"}, {"t": "task", "h": "Повтори визитку Bash без шпаргалки", "goal": "В переменной <code>n<\/code> английское имя. Положи в переменную <code>w<\/code> число слов в нём, а в <code>c<\/code> число байт без перевода строки, и выведи «слов: …, байт: …».", "hint": "pipe в wc и подстановка $( ); echo -n не добавляет перевод строки.", "solution": "<pre>n=\"⟦EN⟧\"\nw=$(echo \"$n\" | wc -w); c=$(echo -n \"$n\" | wc -c)\necho \"слов: $w, байт: $c\"<\/pre><p>Должно быть: слов ⟦EN_WORDS⟧, байт ⟦EN_LEN⟧.<\/p>"}, {"t": "task", "h": "Коды возврата", "goal": "Напиши одну строку: если файл <code>nofile<\/code> показывается командой ls, напечатать «есть», иначе «нет». Ошибку ls спрятать.", "hint": "&& выполняет при успехе, || при неудаче, 2>/dev/null выбрасывает ошибки.", "solution": "<pre>ls nofile 2&gt;/dev/null &amp;&amp; echo есть || echo нет<\/pre>"}, {"t": "sum", "items": ["Ты сам искал файлы и текст, перенаправлял потоки, писал pipe и использовал коды возврата."]}], "cards": [{"q": "Как найти строку во всех файлах с номерами строк?", "a": "grep -rn текст ."}, {"q": "Как записать и вывод, и ошибки в файл?", "a": "команда > файл 2>&1"}], "opt": true}], "defense": true}, {"id": "t3", "title": "Данные и 13 языков", "role": "Одни и те же данные на 13 языках: переменные, типы, форматирование, чем языки отличаются, визитная карточка каждого и ассемблер изнутри.", "link": "запущенная программа работает с данными, и каждый язык описывает их по-своему", "map": {"lead": "Сверху общее для всех языков. Ниже оси, по которым языки различаются. Ещё ниже сами языки и их визитные карточки. В самом низу ассемблер: как всё это выглядит для процессора.", "rows": [{"label": "Общее для всех программ", "nodes": ["var", "type", "string", "format"], "arrow": "языки по-разному решают, как с этим обращаться"}, {"label": "Чем языки отличаются", "nodes": ["static", "dynamic", "inference", "gc", "immut"], "arrow": "поэтому у каждого языка своя визитная карточка"}, {"label": "Компилируемые", "nodes": ["c", "cpp", "go", "rs"], "arrow": ""}, {"label": "Байт-код + VM", "nodes": ["java", "cs", "fs"], "arrow": ""}, {"label": "Скрипты и транспиляция", "nodes": ["py", "js", "ts", "sh", "pl"], "arrow": "в визитных карточках встречаются понятия"}, {"label": "Понятия из визитных карточек", "nodes": ["pointer", "ifdef", "oop", "tsiface", "fspipe", "shebang", "prolog"], "arrow": "а ниже всех, у самого процессора"}, {"label": "Ассемблер", "nodes": ["register", "cstack", "abi", "section", "pie", "plt"], "arrow": ""}], "extra": {"c": {"label": "C", "simple": "printf со спецификаторами, %02d через snprintf. Ручная работа с памятью.", "pro": "низкоуровневый, компилируемый, ручное управление памятью", "lesson": "t3l3"}, "cpp": {"label": "C++", "simple": "std::cout и оператор &lt;&lt;, setw/setfill.", "pro": "C с классами и стандартной библиотекой; RAII", "lesson": "t3l3"}, "py": {"label": "Python", "simple": "f-строки, число слов len(name.split()).", "pro": "динамическая сильная типизация, интерпретатор CPython", "lesson": "t3l4"}, "js": {"label": "JavaScript", "simple": "template literals `${}`, длина имени .length.", "pro": "динамическая слабая типизация, движок V8 с JIT", "lesson": "t3l4"}, "ts": {"label": "TypeScript", "simple": "interface Student и типизированный объект.", "pro": "статические типы поверх JS, транспиляция tsc", "lesson": "t3l4"}, "java": {"label": "Java", "simple": "System.out.printf, .class и javap -c.", "pro": "статическая типизация, ООП, байт-код JVM", "lesson": "t3l5"}, "cs": {"label": "C#", "simple": "record Student и интерполяция $\"\".", "pro": "статическая типизация, ООП, байт-код CIL для .NET", "lesson": "t3l5"}, "fs": {"label": "F#", "simple": "конвейер |&gt;: слова → длины → сумма.", "pro": "функциональный язык на .NET, неизменяемость по умолчанию", "lesson": "t3l5"}, "go": {"label": "Go", "simple": "fmt.Printf и короткое объявление :=.", "pro": "компилируемый, простой, со сборщиком мусора", "lesson": "t3l6"}, "rs": {"label": "Rust", "simple": "неизменяемые let, format!/println!, отдельная строка student_id.", "pro": "компилируемый, безопасность памяти через владение, без GC", "lesson": "t3l6"}, "sh": {"label": "Bash", "simple": "переменные, pipe | wc, подстановка $( ).", "pro": "язык оболочки, «клей» между программами", "lesson": "t3l6"}, "pl": {"label": "Prolog", "simple": "факт student, правило, запрос in_group.", "pro": "логический, декларативный: факты, правила, поиск с возвратом", "lesson": "t3l6"}}}, "lessons": [{"id": "t3l1", "title": "Данные: переменные, типы, строки", "min": 12, "steps": [{"t": "intro", "h": "Что общего у всех 13 программ", "body": "<p>Все 13 программ делают одно и то же: хранят твои данные, считают из них два значения и выводят три строки. Начнём с понятий, которые есть в любом языке.<\/p>"}, {"t": "word", "term": "Переменная", "node": "var", "pt": "variable · binding", "simple": "Имя, под которым программа хранит значение.", "like": "Подписанная коробка: на коробке «student_number», внутри ⟦N⟧.", "ex": "<code>student_number = ⟦N⟧<\/code> в Python, <code>int student_number = ⟦N⟧;<\/code> в C, <code>let student_number = ⟦N⟧<\/code> в Rust.", "pro": "<p><b>variable<\/b>. Объявить переменную это <b>declare<\/b>, положить значение <b>assign<\/b> (присвоить), задать первое значение <b>initialize<\/b>. В Rust и F# говорят <b>binding<\/b> (связывание имени со значением). Значение, вписанное прямо в код (⟦N⟧, \"C\"), называется <b>литерал<\/b>.<\/p>"}, {"t": "word", "term": "Тип", "node": "type", "pt": "type · int · string", "simple": "Вид данных: что лежит в переменной и что с этим можно делать.", "like": "Пометка на коробке: «жидкость» или «стекло». От неё зависит, что с коробкой можно делать.", "ex": "⟦N⟧ это целое число (можно умножать), «⟦EN⟧» это строка (можно взять длину, разбить на слова).", "pro": "<p><b>type<\/b>. Основные: <b>int<\/b> (integer, целое), <b>float<\/b> (дробное), <b>string<\/b> (строка), <b>bool<\/b> (true/false). Неверное сочетание типов это <b>type error<\/b>.<\/p>"}, {"t": "word", "term": "Строка", "node": "string", "pt": "string · char · \\0", "simple": "Текст в программе. Внутри это последовательность байтов, по одному или несколько на символ.", "like": "Бусы: каждая бусина это символ, а нитка держит их по порядку.", "ex": "В C строка это массив байтов, а в конце стоит байт 0, чтобы было понятно, где конец. Поэтому в твоём C-коде буфер <code>char student_id[64]<\/code>.", "pro": "<p><b>string<\/b>; один символ в C это <b>char<\/b>. Байт 0 в конце называют <b>нуль-терминатор<\/b> (null terminator), а такие строки <b>C-строками<\/b>. Склеить строки это <b>конкатенация<\/b> (concatenation).<\/p>"}, {"t": "idea", "h": "Что требует задание", "body": "<ol><li>В начале задать 5 значений: имя по-русски и по-английски, номер ⟦N⟧, группа, название языка.<\/li><li>Из них <b>программно<\/b> получить <code>student_id<\/code> = «⟦GROUP⟧/⟦N2⟧», номер минимум двумя цифрами.<\/li><li>Посчитать <code>control_value<\/code> = 304 × ⟦N⟧ = ⟦CTRL⟧.<\/li><li>Вывести три строки.<\/li><\/ol><p>Нельзя написать готовую строку целиком (<code>print(\"Student ID: ⟦GROUP⟧/⟦N2⟧ ...\")<\/code>). Строки надо <b>собрать из переменных<\/b>, в этом смысл задания. Исключение только ассемблер.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> вписать готовое значение в код вместо вычисления это <b>хардкод<\/b> (hardcode). Число без имени, как 304 в трёх местах, называют <b>магическим числом<\/b> (magic number), поэтому у тебя оно вынесено в константу department.<\/p>"}, {"t": "word", "term": "Форматирование", "node": "format", "pt": "format string · %02d", "simple": "Собрать строку из шаблона и значений: в шаблоне места-заглушки, а программа подставляет туда значения.", "like": "Бланк с пропусками: «Студент ___, номер ___». Ты вписываешь значения в пропуски.", "ex": "<code>printf(\"номер %d\", ⟦N⟧)<\/code>: <code>%d<\/code> заглушка для целого числа. <code>%02d<\/code> значит «целое, минимум 2 знака, дополнить нулями»: 7 станет 07.", "pro": "<p><b>format string<\/b> (строка формата), заглушки называют <b>спецификаторами формата<\/b> (format specifiers): <code>%d<\/code> целое, <code>%s<\/code> строка. Разбор %02d: <code>0<\/code> флаг «заполнять нулями», <code>2<\/code> ширина, <code>d<\/code> decimal. Подстановку прямо в строку (<code>f\"{x}\"<\/code>, <code>`${x}`<\/code>) называют <b>интерполяцией<\/b> (string interpolation).<\/p>"}, {"t": "predict", "q": "Что выведет <code>printf(\"%02d\", 7)<\/code>?", "o": ["7", "07", "2d7", " 7 (с пробелом)"], "a": 1, "reveal": "<p>Ширина 2, заполнение нулями. Без нуля (<code>%2d<\/code>) был бы пробел. ⟦N_NOTE⟧<\/p>"}, {"t": "do", "h": "Поиграй с форматом", "task": "Проверь в Python разные форматы.", "cmd": "python3 -c 'print(f\"{7:02d}|{21:02d}|{7:03d}|{123:02d}\")'", "look": "07|21|007|123", "explain": "<p>Ширина задаёт минимум и не обрезает длинное число. Во всех языках лабы это одна идея: <code>%02d<\/code> в C, Java, Go, Bash, F#; <code>:02d<\/code> в Python; <code>:D2<\/code> в C#; <code>{:02}<\/code> в Rust; <code>padStart(2,\"0\")<\/code> в JS/TS; <code>setw(2)<\/code> + <code>setfill('0')<\/code> в C++.<\/p>"}, {"t": "check", "q": "Какое решение нарушает требование задания?", "o": ["print(f\"Student ID: {student_id} | ...\")", "control_value = 304 * student_number", "print(\"Student ID: ⟦GROUP⟧/⟦N2⟧ | Language: Python | Control: ⟦CTRL⟧\")", "student_id = f\"{group_name}/{student_number:02d}\""], "a": 2, "why": "Третье это хардкод готовой строки без использования данных."}, {"t": "why", "q": "Объясни, что значит %02d и зачем в задании номер «минимум двумя цифрами».", "model": "%02d это спецификатор формата: вывести целое число в десятичном виде шириной минимум 2 символа, дополнив слева нулями. Так номер 7 станет 07, а 21 останется 21. Задание требует этого, чтобы student_id имел единый вид (группа/двузначный номер) и чтобы показать форматирование средствами языка, а не готовой строкой."}, {"t": "pro", "simple": "Я не вписал готовую строку, а собрал её из коробок с данными по шаблону с пропусками; число 304 у меня подписано именем.", "terms": ["переменные", "строка формата / интерполяция", "хардкод", "магическое число"], "model": "Вывод собирается форматированием (строка формата или интерполяция) из переменных, без хардкода; 304 вынесено в константу, чтобы не было магического числа."}, {"t": "sum", "items": ["Переменная это имя для значения; тип говорит, что это за данные.", "Строка это последовательность байтов; в C с нулём в конце.", "Форматирование подставляет значения в шаблон; %02d даёт 07 из 7.", "Задание запрещает хардкод: строки собираются из данных."]}], "cards": [{"q": "Что такое переменная и литерал?", "a": "Переменная это имя для значения; литерал это значение, вписанное в код (⟦N⟧, \"C\")."}, {"q": "Что такое тип? Назови основные.", "a": "Вид данных и допустимых операций: int, float, string, bool."}, {"q": "Как устроена строка в C?", "a": "Массив байтов (char) с нулевым байтом в конце (null terminator)."}, {"q": "Что значит %02d?", "a": "Целое десятичное, ширина минимум 2, дополнить нулями слева: 7 → 07."}, {"q": "Что такое хардкод и магическое число?", "a": "Хардкод: готовое значение вместо вычисления. Магическое число: число без имени в коде (304 без константы)."}, {"q": "Что такое интерполяция строк?", "a": "Подстановка значений прямо в строку: f\"{x}\", `${x}`, $\"{x}\"."}]}, {"id": "t3l2", "title": "Чем языки отличаются: типы и память", "min": 14, "steps": [{"t": "intro", "h": "Оси, по которым различаются все языки", "body": "<p>13 языков это 13 разных ответов на одни и те же вопросы: когда проверять типы, кто убирает память, можно ли менять значения. Поймёшь оси, и любой новый язык разложишь за минуту.<\/p>"}, {"t": "word", "term": "Статическая типизация", "node": "static", "pt": "static typing · compile-time", "simple": "Типы всех переменных известны и проверяются <b>до запуска<\/b>, при компиляции.", "like": "Таможня на границе: проверяют каждую коробку, прежде чем пустить машину в страну.", "ex": "C, C++, Java, C#, F#, Go, Rust, TypeScript. Если умножить строку на число, компилятор откажется собирать программу.", "pro": "<p><b>static typing<\/b>, ошибки ловятся в <b>compile-time<\/b>. Говорят «статически типизированный язык», «компилятор не пропустит». Плюс: ошибки находятся рано, код быстрее. Минус: больше писать.<\/p>"}, {"t": "word", "term": "Динамическая типизация", "node": "dynamic", "pt": "dynamic typing · runtime", "simple": "Тип есть у значения, а не у переменной, и проверяется <b>во время работы<\/b>, когда программа доходит до операции.", "like": "Проверка уже на месте: коробку открыли и только тогда поняли, что внутри не то.", "ex": "Python, JavaScript, Bash, Prolog. В Python <code>\"5\" + 2<\/code> упадёт с TypeError только когда выполнится эта строка.", "pro": "<p><b>dynamic typing<\/b>, ошибки в <b>runtime<\/b>. Ещё говорят про <b>утиную типизацию<\/b> (duck typing): «если крякает как утка, это утка», важно, что объект умеет, а не как называется его тип.<\/p>"}, {"t": "predict", "q": "Что даст JavaScript на <code>\"5\" * 2<\/code> и <code>\"5\" + 2<\/code>?", "o": ["10 и 7", "10 и \"52\"", "Ошибку в обоих", "\"55\" и \"52\""], "a": 1, "reveal": "<p>JS молча превращает типы: при умножении строку в число (10), а при сложении число в строку (\"52\"). Python бы на <code>\"5\" + 2<\/code> выдал ошибку. Это вторая ось: <b>сильная<\/b> типизация (Python, без неявных превращений) и <b>слабая<\/b> (JS, с ними). Отсюда в JS правило «всегда ===», и отсюда же появился TypeScript.<\/p>"}, {"t": "word", "term": "Вывод типов", "node": "inference", "pt": "type inference · var/:=", "simple": "Тип не пишешь руками, но компилятор сам его вычисляет из значения. Типизация при этом остаётся статической.", "like": "Таможенник сам смотрит в коробку и пишет на ней пометку, тебе не надо заполнять бланк.", "ex": "<code>var student = ...<\/code> в C#, <code>controlValue := ...<\/code> в Go, <code>let x = ⟦N⟧<\/code> в Rust и F#.", "pro": "<p><b>type inference<\/b>. Частая ошибка: считать <code>var<\/code> в C# динамической типизацией. Нет: тип вычислен при компиляции и дальше не меняется.<\/p>"}, {"t": "word", "term": "Сборщик мусора", "node": "gc", "pt": "garbage collector · GC", "simple": "Часть среды выполнения, которая сама находит ненужные данные в памяти и освобождает её.", "like": "Уборщик в столовой: ты просто уходишь, а он сам уносит посуду.", "ex": "Java, C#, F#, Go, JS, Python. В C память под буфер ты выделяешь и контролируешь сам (<code>char student_id[64]<\/code>, а для динамической памяти <code>malloc<\/code>/<code>free<\/code>).", "pro": "<p><b>garbage collector<\/b>, GC. Альтернативы: <b>ручное управление<\/b> памятью (C), <b>RAII<\/b> (C++: память освобождается при выходе переменной из области видимости), <b>владение<\/b> (ownership, Rust: компилятор доказывает, что память освобождается ровно один раз). Ошибки ручной памяти, <b>переполнение буфера<\/b> (buffer overflow) и <b>use-after-free<\/b>, главный источник уязвимостей.<\/p>"}, {"t": "word", "term": "Неизменяемость", "node": "immut", "pt": "immutability · let/mut", "simple": "Значение после создания нельзя поменять. Хочешь другое значение, создай новое.", "like": "Чернила против карандаша: написанное ручкой не сотрёшь, можно только написать новую строчку.", "ex": "В Rust <code>let<\/code> по умолчанию неизменяемый (для изменяемого нужно <code>let mut<\/code>), в F# так же. В C, Java, Python наоборот, всё изменяемо, а константы помечают (<code>const<\/code>, <code>final<\/code>).", "pro": "<p><b>immutable<\/b> / <b>mutable<\/b>. Зачем: меньше ошибок «значение неожиданно поменялось где-то ещё», особенно когда программа работает в нескольких потоках одновременно (многопоточность, concurrency).<\/p>"}, {"t": "check", "q": "<code>var x = 5;<\/code> в C# это...", "o": ["Динамическая типизация", "Вывод типа: x навсегда int, проверка при компиляции", "Ошибка", "Строка"], "a": 1, "why": "var это вывод типа в статическом языке."}, {"t": "idea", "h": "Где какой язык", "body": "<div class=\"tbl\"><table><tr><th>Язык<\/th><th>Типизация<\/th><th>Память<\/th><\/tr><tr><td>C<\/td><td>статическая, слабая<\/td><td>вручную<\/td><\/tr><tr><td>C++<\/td><td>статическая<\/td><td>RAII<\/td><\/tr><tr><td>Java, C#<\/td><td>статическая<\/td><td>GC<\/td><\/tr><tr><td>F#<\/td><td>статическая + вывод, неизменяемость<\/td><td>GC<\/td><\/tr><tr><td>Go<\/td><td>статическая + :=<\/td><td>GC<\/td><\/tr><tr><td>Rust<\/td><td>статическая + вывод, неизменяемость<\/td><td>владение, без GC<\/td><\/tr><tr><td>Python<\/td><td>динамическая, сильная<\/td><td>GC<\/td><\/tr><tr><td>JavaScript<\/td><td>динамическая, слабая<\/td><td>GC<\/td><\/tr><tr><td>TypeScript<\/td><td>статическая поверх JS<\/td><td>GC (JS)<\/td><\/tr><tr><td>Bash<\/td><td>всё строки<\/td><td>не нужно<\/td><\/tr><\/table><\/div>"}, {"t": "why", "q": "Если статическая типизация ловит ошибки раньше, почему Python и JavaScript так популярны?", "model": "Статическая типизация требует больше писать и дольше учиться, а динамическая позволяет быстро написать и поменять код; для небольших скриптов и прототипов это важнее, и ошибки типов там дешевле. Когда проекты на JS выросли, тихие ошибки стали дорогими, поэтому появился TypeScript. Это компромисс между скоростью разработки и надёжностью."}, {"t": "pro", "simple": "В Python тип проверяется только когда программа дошла до строки, а в Rust компилятор заранее проверит типы, хотя я их не писал, и не даст поменять значение без разрешения.", "terms": ["динамическая типизация", "статическая типизация", "вывод типов", "неизменяемость (mut)"], "model": "Python динамически типизирован, type error ловится в runtime. Rust статически типизирован с выводом типов, проверка в compile-time, а let по умолчанию immutable, для изменения нужен mut."}, {"t": "sum", "items": ["Статическая типизация: проверка до запуска; динамическая: во время работы.", "Сильная против слабой: есть ли неявные превращения типов (Python против JS).", "Вывод типов не делает язык динамическим.", "Память: вручную (C), RAII (C++), GC (Java, C#, Go, JS, Python), владение (Rust).", "Неизменяемость по умолчанию в Rust и F#."]}], "cards": [{"q": "Статическая и динамическая типизация?", "a": "Статическая: типы проверяются при компиляции (C, Java, Rust). Динамическая: при выполнении (Python, JS)."}, {"q": "Сильная и слабая типизация?", "a": "Сильная: без явного преобразования смешение типов даёт ошибку (Python). Слабая: неявные преобразования (JS: \"5\"*2 = 10)."}, {"q": "Что такое вывод типов?", "a": "Компилятор сам вычисляет статический тип из значения: var, :=, let. Это не динамика."}, {"q": "Что такое сборщик мусора?", "a": "Часть рантайма, которая сама освобождает неиспользуемую память (Java, C#, Go, JS, Python)."}, {"q": "Как Rust обходится без GC?", "a": "Через владение (ownership): компилятор доказывает, что память освобождается ровно один раз."}, {"q": "Зачем неизменяемость по умолчанию?", "a": "Меньше ошибок «значение неожиданно поменялось», безопаснее в многопоточности."}]}, {"id": "t3l3", "title": "C и C++", "min": 14, "steps": [{"t": "intro", "h": "Два самых «низких» языка лабы", "body": "<p>C близок к железу: ты сам отвечаешь за память, строки это массивы байтов. C++ строит поверх C удобства. Оба компилируются gcc/g++ в нативный бинарник.<\/p>"}, {"t": "idea", "h": "C: что в твоём коде главное", "body": "<ul><li><code>#include &lt;stdio.h&gt;<\/code>: подключить объявления printf и snprintf (препроцессор вклеит файл).<\/li><li><code>int main(void)<\/code>: отсюда начинается программа, она возвращает число (код возврата).<\/li><li><code>const char *student_name_ru = \"...\"<\/code>: указатель на строку, которую нельзя менять.<\/li><li><code>char student_id[64]<\/code>: буфер на 64 байта под строку.<\/li><li><code>snprintf(student_id, sizeof(student_id), \"%s/%02d\", ...)<\/code>: собрать строку <b>в буфер<\/b>, не больше 64 байт.<\/li><li><code>printf(\"Hello to %d from %s...\")<\/code>: вывести по шаблону.<\/li><li><code>return 0;<\/code>: «всё хорошо».<\/li><\/ul><p><b>Визитная карточка C<\/b>: вывод через printf со спецификаторами, номер через форматирование.<\/p>"}, {"t": "word", "term": "Указатель", "node": "pointer", "pt": "pointer · char *", "simple": "Переменная, в которой лежит не само значение, а адрес в памяти, где оно лежит.", "like": "Не сама книга, а бумажка с номером полки, где книга стоит.", "ex": "<code>const char *student_name_en<\/code>: в переменной адрес первой буквы строки.", "pro": "<p><b>pointer<\/b>. Обращение по нему это <b>разыменование<\/b> (dereference). Ошибочный указатель приводит к падению <b>Segmentation fault<\/b> (segfault): программа полезла в чужую память.<\/p>"}, {"t": "predict", "q": "Почему у тебя <code>snprintf<\/code>, а не <code>sprintf<\/code>?", "o": ["snprintf быстрее", "snprintf получает размер буфера и не запишет больше, чем влезает", "sprintf не умеет %02d", "sprintf только для Windows"], "a": 1, "reveal": "<p><code>sprintf<\/code> не знает размер буфера и может записать за его конец. Это <b>переполнение буфера<\/b> (buffer overflow), классическая уязвимость: лишние байты затирают соседнюю память. <code>n<\/code> в названии значит «не больше n байт».<\/p>"}, {"t": "word", "term": "Условная компиляция", "node": "ifdef", "pt": "#ifdef · preprocessor directive", "simple": "Кусок кода, который попадёт в программу, только если выполнено условие. Решается до компиляции.", "like": "Пометка в рецепте: «только для газовой плиты». Если плита электрическая, этот абзац просто вырывают из рецепта.", "ex": "<code>#ifdef _WIN32 ... #endif<\/code> вокруг <code>SetConsoleOutputCP<\/code>: на Windows код есть, на Linux препроцессор его выбрасывает.", "pro": "<p><b>conditional compilation<\/b>; строки с <code>#<\/code> это <b>директивы препроцессора<\/b>. <code>_WIN32<\/code> это <b>макрос<\/b>, который компилятор определяет сам при сборке под Windows. Так пишут <b>кроссплатформенный<\/b> код.<\/p>"}, {"t": "do", "h": "Собери с предупреждениями", "task": "Флаги -Wall -Wextra -pedantic включают предупреждения компилятора.", "cmd": "cd ~/Documents/vpd/lab01/dev && gcc -Wall -Wextra -pedantic c/main.c -o c/main && ./c/main; echo \"код: $?\"", "look": "Три строки вывода и «код: 0», без единого предупреждения.", "explain": "<p><b>Предупреждение<\/b> (warning) это не ошибка: программа соберётся, но компилятор подсказывает подозрительное место (неиспользуемая переменная, неверный тип в printf). <code>-Wall<\/code> основные, <code>-Wextra<\/code> дополнительные, <code>-pedantic<\/code> строго по стандарту C. Чистая сборка без warnings это хороший аргумент на защите.<\/p>"}, {"t": "idea", "h": "C++: что добавляется", "body": "<ul><li><code>std::string<\/code>: строка, которая сама знает длину и сама управляет памятью.<\/li><li><code>std::cout &lt;&lt; ... &lt;&lt; ...<\/code>: вывод цепочкой. Тип каждого значения компилятор знает сам, спецификаторы не нужны.<\/li><li><code>std::setw(2) &lt;&lt; std::setfill('0')<\/code>: ширина 2 и заполнение нулями. <b>setw<\/b> действует только на следующий вывод, <b>setfill<\/b> остаётся.<\/li><li><code>std::ostringstream<\/code>: как cout, но пишет в строку в памяти.<\/li><li><code>std::<\/code>: пространство имён стандартной библиотеки.<\/li><\/ul><p><b>Визитная карточка C++<\/b>: вывод через cout и <code>&lt;&lt;<\/code>, номер через setw/setfill.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> &lt;&lt; это <b>перегруженный оператор<\/b> (operator overloading); <code>std::<\/code> это <b>namespace<\/b>; <code>#include &lt;iomanip&gt;<\/code> даёт <b>манипуляторы потока<\/b>.<\/p>"}, {"t": "check", "q": "Что правда про std::setw(2)?", "o": ["Действует на все следующие выводы", "Обрезает число до 2 цифр", "Действует только на следующее выводимое значение", "Работает только со строками"], "a": 2, "why": "Поэтому setw ставят прямо перед номером."}, {"t": "why", "q": "Чем вывод в C++ через cout &lt;&lt; лучше printf в C?", "model": "printf полагается на строку формата: если спецификатор не совпал с типом аргумента, компилятор только предупредит, а программа может вывести мусор. В C++ оператор << перегружен для каждого типа, компилятор сам выбирает правильный вывод, поэтому перепутать тип нельзя, и спецификаторы не нужны."}, {"t": "pro", "simple": "В C я сам выделил кусок памяти под строку и следил, чтобы не записать за его край; кусок кода для Windows вырезается при сборке на Linux.", "terms": ["буфер", "buffer overflow", "snprintf", "условная компиляция #ifdef"], "model": "В C управление памятью ручное: student_id собирается в буфер через snprintf с размером, чтобы не было buffer overflow. Windows-специфичный код обёрнут в #ifdef _WIN32, на Linux препроцессор его выкидывает."}, {"t": "sum", "items": ["C: printf со спецификаторами, буферы, указатели, ручная память.", "snprintf безопаснее sprintf: защищает от переполнения буфера.", "#ifdef _WIN32 делает код кроссплатформенным.", "C++: std::string, cout <<, setw/setfill; типобезопасный вывод.", "-Wall -Wextra -pedantic: предупреждения компилятора."]}], "cards": [{"q": "Визитная карточка C?", "a": "printf со спецификаторами (%d, %s), номер через %02d в snprintf."}, {"q": "Что такое указатель?", "a": "Переменная с адресом в памяти, а не самим значением."}, {"q": "Почему snprintf, а не sprintf?", "a": "snprintf получает размер буфера и не пишет за его границу (защита от buffer overflow)."}, {"q": "Что делает #ifdef _WIN32?", "a": "Условная компиляция: код попадёт в сборку только под Windows."}, {"q": "Визитная карточка C++?", "a": "std::cout с оператором <<, номер через setw(2) и setfill('0')."}, {"q": "Что делают -Wall -Wextra -pedantic?", "a": "Включают предупреждения: основные, дополнительные, строгое соответствие стандарту."}]}, {"id": "t3l4", "title": "Python, JavaScript, TypeScript", "min": 13, "steps": [{"t": "intro", "h": "Три динамичных соседа", "body": "<p>Python и JavaScript это популярные языки с динамической типизацией. TypeScript это JavaScript, к которому добавили статические типы.<\/p>"}, {"t": "idea", "h": "Python", "body": "<ul><li>Переменные без типов: <code>student_number = ⟦N⟧<\/code>.<\/li><li><b>f-строки<\/b>: <code>f\"{group_name}/{student_number:02d}\"<\/code>, выражения в фигурных скобках, формат после двоеточия.<\/li><li>Константа по соглашению БОЛЬШИМИ буквами: <code>DEPARTMENT = 304<\/code> (Python её не защищает).<\/li><\/ul><p><b>Визитная карточка<\/b>: f-строки и число слов в имени: <code>len(student_name_en.split())<\/code>. <code>split()<\/code> режет строку по пробелам в список <code>⟦EN_PYLIST⟧<\/code>, <code>len<\/code> даёт его длину ⟦EN_WORDS⟧.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> f-строка это <b>formatted string literal<\/b>; split возвращает <b>список<\/b> (list); соглашения стиля Python описаны в <b>PEP 8<\/b>.<\/p>"}, {"t": "predict", "q": "Что выведет <code>len(\"⟦EN⟧\".split())<\/code>?", "o": ["⟦EN_LEN⟧", "⟦EN_WORDS⟧", "⟦EN_LETTERS⟧", "1"], "a": 1, "reveal": "<p>split делает список из 3 слов, len считает элементы списка. 22 была бы длина самой строки.<\/p>"}, {"t": "idea", "h": "JavaScript", "body": "<ul><li><code>const<\/code>: переменная, которой нельзя присвоить новое значение (<code>let<\/code> можно, <code>var<\/code> устарел).<\/li><li><b>Template literals<\/b> в обратных кавычках: <code>`${groupName}/${String(studentNumber).padStart(2, \"0\")}`<\/code>.<\/li><li><code>padStart(2, \"0\")<\/code>: дополнить строку слева нулями до длины 2.<\/li><li>Имена в стиле camelCase: <code>studentNameEn<\/code>.<\/li><\/ul><p><b>Визитная карточка<\/b>: template literals и длина имени <code>studentNameEn.length<\/code> = ⟦EN_LEN⟧ (⟦EN_LETTERSW⟧ + ⟦EN_SPW⟧).<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> запускает <b>Node.js<\/b>, рантайм на движке <b>V8<\/b>; <code>.length<\/code> это <b>свойство<\/b> (property) строки.<\/p>"}, {"t": "check", "q": "Почему <code>\"⟦EN⟧\".length<\/code> равно ⟦EN_LEN⟧, а не ⟦EN_LETTERS⟧?", "o": ["Считаются и пробелы", "Кириллица считается за 2", "Считается ещё \\0", "Ошибка в JS"], "a": 0, "why": "6 + 4 + 10 букв и 2 пробела."}, {"t": "word", "term": "TypeScript и интерфейс", "node": "tsiface", "pt": "interface · type erasure", "simple": "Интерфейс описывает форму объекта: какие поля и каких типов. Компилятор tsc проверяет по нему код, а потом стирает типы и выдаёт обычный JavaScript.", "like": "Чертёж коробки: какие отделения и что в каждом. Сама коробка (JS) потом едет без чертежа.", "ex": "<code>interface Student { nameRu: string; number: number; ... }<\/code> и <code>const student: Student = {...}<\/code>. Если написать <code>number: \"⟦N⟧\"<\/code>, tsc выдаст ошибку и не соберёт.", "pro": "<p><b>interface<\/b>, <b>type annotation<\/b> (<code>: number<\/code>), стирание типов это <b>type erasure<\/b>. <code>tsc main.ts --outDir dist<\/code> кладёт результат в папку dist (distribution), она в .gitignore как артефакт сборки.<\/p>"}, {"t": "do", "h": "Сломай типы специально", "task": "Попроси tsc собрать объект с неправильным типом.", "cmd": "cd /tmp && printf 'interface S { n: number }\\nconst s: S = { n: \"⟦N⟧\" };\\nconsole.log(s.n);\\n' > t.ts && tsc t.ts", "look": "error TS2322: Type 'string' is not assignable to type 'number'.", "explain": "<p>tsc нашёл ошибку <b>до запуска<\/b>. Обычный JS выполнил бы такой код молча. В этом и смысл TypeScript.<\/p>"}, {"t": "predict", "q": "Что будет с <code>interface Student<\/code> в файле dist/main.js после tsc?", "o": ["Станет классом", "Исчезнет, типы стираются", "Станет комментарием", "Станет JSON"], "a": 1, "reveal": "<p>Интерфейсы нужны только для проверки. В dist/main.js их нет. Убедись сам: <code>cat ~/Documents/vpd/lab01/dev/typescript/dist/main.js<\/code>.<\/p>"}, {"t": "why", "q": "Зачем нужен TypeScript, если в итоге всё равно выполняется JavaScript?", "model": "TypeScript добавляет статическую типизацию: форму данных описывают заранее (interface), и компилятор tsc проверяет код до запуска. Ошибки вроде строки вместо числа или забытого поля находятся при сборке, а не у пользователя. После проверки tsc транспилирует код в обычный JavaScript, стирая типы, и его выполняет Node."}, {"t": "pro", "simple": "Я описал, какие поля и каких типов должны быть у студента; программа-переводчик проверила это и выдала обычный JS без описаний.", "terms": ["interface", "type annotation", "tsc", "type erasure / транспиляция"], "model": "Данные студента описаны через interface с аннотациями типов; tsc проверил типы и транспилировал код в JavaScript, интерфейсы при этом стёрлись (type erasure)."}, {"t": "sum", "items": ["Python: f-строки, split и len; визитка: число слов 3.", "JavaScript: template literals, padStart; визитка: длина имени 22.", "TypeScript: interface и типизированный объект; tsc проверяет типы и стирает их в JS."]}], "cards": [{"q": "Визитная карточка Python?", "a": "f-строки и число слов в имени: len(student_name_en.split()) = 3."}, {"q": "Визитная карточка JavaScript?", "a": "Template literals `${...}` и длина имени .length = 22."}, {"q": "Визитная карточка TypeScript?", "a": "interface Student с типами полей и типизированный объект."}, {"q": "Что делает padStart(2, \"0\")?", "a": "Дополняет строку слева нулями до длины 2: \"7\" → \"07\"."}, {"q": "Что такое type erasure?", "a": "Стирание типов при транспиляции TS в JS: в dist/main.js нет interface и аннотаций."}]}, {"id": "t3l5", "title": "Java, C#, F#", "min": 15, "steps": [{"t": "intro", "h": "Три языка на виртуальных машинах", "body": "<p>Java работает на JVM, C# и F# на .NET. Все три компилируются в байт-код (вспомни тему 1). Но устроены по-разному: Java и C# объектно-ориентированные, F# функциональный.<\/p>"}, {"t": "word", "term": "Класс и объект", "node": "oop", "pt": "class · object · OOP", "simple": "Класс это описание (какие данные и действия), объект это конкретный экземпляр по этому описанию.", "like": "Класс это чертёж дома, объект это конкретный построенный по нему дом.", "ex": "В Java даже <code>main<\/code> живёт внутри класса <code>Main<\/code>. В C# студент описан как <code>record Student(...)<\/code>, а <code>new Student(...)<\/code> создаёт объект.", "pro": "<p><b>class<\/b>, <b>object<\/b>, <b>instance<\/b> (экземпляр); подход называется <b>ООП<\/b> (объектно-ориентированное программирование, OOP). Функции внутри класса называют <b>методами<\/b>, данные <b>полями<\/b> или <b>свойствами<\/b>.<\/p>"}, {"t": "idea", "h": "Java", "body": "<ul><li><code>public class Main<\/code> в файле <code>Main.java<\/code>: имя публичного класса обязано совпадать с именем файла.<\/li><li><code>public static void main(String[] args)<\/code>: точка входа. <code>static<\/code> значит «вызывается без создания объекта».<\/li><li>Перед каждой переменной тип: <code>String<\/code>, <code>int<\/code>. <code>final int department = 304<\/code> это константа.<\/li><li><code>String.format(\"%s/%02d\", ...)<\/code> и <code>System.out.printf<\/code>; <code>%n<\/code> это перевод строки, правильный для текущей ОС.<\/li><\/ul><p><b>Визитная карточка<\/b>: типизированные переменные, printf, и показать Main.class через <code>javap -c<\/code>.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> javac делает <b>class-файл<\/b>; <code>java Main<\/code> принимает <b>имя класса<\/b>, а не файла, и ищет его в <b>classpath<\/b>.<\/p>"}, {"t": "idea", "h": "C#", "body": "<ul><li>Нет ни класса, ни main: код пишется сразу, компилятор сам заворачивает его. Это <b>top-level statements<\/b>.<\/li><li><code>record Student(string NameRu, ..., int Number, ...)<\/code>: одной строкой описан тип для данных.<\/li><li><b>Интерполяция<\/b> <code>$\"{student.Group}/{student.Number:D2}\"<\/code>; <code>D2<\/code> значит «целое, минимум 2 цифры».<\/li><li><code>Console.OutputEncoding = UTF8<\/code> для кириллицы на Windows.<\/li><li>Проект создаётся <code>dotnet new console<\/code> (файл <code>csharp.csproj<\/code>), запускается <code>dotnet run<\/code>: restore, build в <code>bin/<\/code> и <code>obj/<\/code>, запуск.<\/li><\/ul><p><b>Визитная карточка<\/b>: $\"\" и record.<\/p>"}, {"t": "check", "q": "Почему <code>bin/<\/code> и <code>obj/<\/code> в .gitignore, а <code>csharp.csproj<\/code> нет?", "o": ["csproj маленький", "csproj описывает проект, без него не собрать; bin/ и obj/ результаты сборки", "bin/ секретный", "Случайно"], "a": 1, "why": "Храним то, из чего собирается проект, не храним то, что получается сборкой."}, {"t": "word", "term": "Конвейер |> (F#)", "node": "fspipe", "pt": "pipe operator · |>", "simple": "Передать результат слева как последний аргумент функции справа. Цепочка читается слева направо, как шаги.", "like": "Конвейер на заводе, но для данных: деталь проходит станок за станком.", "ex": "<code>studentNameEn.Split(' ') |&gt; Array.map String.length<\/code> даёт <code>[|⟦EN_LENS_FS⟧|]<\/code>, затем <code>|&gt; Array.sum<\/code> = ⟦EN_LETTERSW⟧, <code>|&gt; Array.length<\/code> = ⟦EN_WORDSW⟧.", "pro": "<p><b>pipe operator<\/b>. <code>x |&gt; f<\/code> это то же, что <code>f x<\/code>. Применить функцию к каждому элементу это <b>map<\/b>, свернуть в одно значение (сумму) это <b>reduce<\/b>/<b>fold<\/b>. Стиль, где программа это композиция функций, называется <b>функциональным программированием<\/b> (FP).<\/p>"}, {"t": "predict", "q": "Чему равно <code>[|1; 2; 3|] |&gt; Array.map (fun x -&gt; x * 10) |&gt; Array.sum<\/code>?", "o": ["6", "60", "[|10; 20; 30|]", "Ошибка"], "a": 1, "reveal": "<p>map умножает каждый на 10 → [|10;20;30|], sum складывает → 60.<\/p>"}, {"t": "idea", "h": "F#: ещё две вещи", "body": "<ul><li><code>let<\/code> это <b>неизменяемое<\/b> связывание. Изменить можно только <code>let mutable<\/code>.<\/li><li><code>sprintf \"%s/%02d\" groupName studentNumber<\/code>: формат проверяется <b>при компиляции<\/b>, подать строку в %d нельзя.<\/li><li>В <code>fsharp.fsproj<\/code> важен порядок файлов (Compile Include): F# видит только то, что объявлено выше.<\/li><li>Язык feature-ветки у тебя ⟦BR⟧ (⟦N⟧ mod 5 = ⟦NMOD⟧), ветки разберём в теме про Git.<\/li><\/ul><p><b>Визитная карточка<\/b>: конвейер <code>|&gt;<\/code>, вывод «Words: ⟦EN_WORDS⟧, letters without spaces: ⟦EN_LETTERS⟧».<\/p>"}, {"t": "why", "q": "Объясни, что делает |> в твоей программе и почему так удобнее вложенных вызовов.", "model": "|> передаёт результат слева в функцию справа: x |> f это f x. У меня имя режется Split(' ') на массив слов, потом Array.map String.length делает массив длин [⟦EN_LENS_C⟧], потом Array.sum даёт ⟦EN_LETTERSW⟧, Array.length даёт ⟦EN_WORDSW⟧. Цепочка читается слева направо как последовательность шагов, а вложенные вызовы Array.sum (Array.map ...) пришлось бы читать изнутри наружу."}, {"t": "pro", "simple": "В Java всё лежит внутри описаний-чертежей, в C# я одной строкой описал тип для данных студента, а в F# прогнал имя по цепочке функций: разбить, взять длины, сложить.", "terms": ["ООП / класс", "record", "pipe operator |>", "map / reduce"], "model": "Java и C# объектно-ориентированные: в Java код живёт в классах, в C# данные студента описаны record'ом. В F# имя проходит pipeline через |>: Split, map по длинам и reduce в сумму."}, {"t": "sum", "items": ["Java: всё в классах, типизированные переменные, printf, javap -c.", "C#: top-level statements, record, $\"\" с :D2, dotnet run делает bin/ и obj/.", "F#: неизменяемые let, sprintf с проверкой типов, конвейер |>.", "Класс это чертёж, объект это экземпляр (ООП)."]}], "cards": [{"q": "Визитная карточка Java?", "a": "Типизированные переменные, System.out.printf, наличие .class и javap -c."}, {"q": "Визитная карточка C#?", "a": "Интерполяция $\"\" и record Student."}, {"q": "Визитная карточка F#?", "a": "Конвейер |>: Split → map длин → sum = 20, length = 3."}, {"q": "Класс и объект?", "a": "Класс это описание (чертёж), объект это конкретный экземпляр."}, {"q": "Что делает x |> f?", "a": "То же, что f x: передаёт результат слева в функцию справа."}, {"q": "Что такое top-level statements в C#?", "a": "Код без класса и Main; компилятор сам заворачивает его."}]}, {"id": "t3l6", "title": "Go, Rust, Bash, Prolog", "min": 16, "steps": [{"t": "intro", "h": "Четыре очень разных языка", "body": "<p>Go и Rust это современные компилируемые языки. Bash это язык самой оболочки. Prolog вообще из другого мира: ты не пишешь шаги, а описываешь факты.<\/p>"}, {"t": "idea", "h": "Go", "body": "<ul><li><code>package main<\/code> и <code>func main()<\/code>: из пакета main получается программа.<\/li><li><code>var studentNameEn string = \"...\"<\/code>: тип пишется после имени.<\/li><li><b>Короткое объявление<\/b> <code>studentID := fmt.Sprintf(\"%s/%02d\", ...)<\/code>: создать переменную и вывести тип сам.<\/li><li><code>fmt.Printf<\/code> не добавляет перевод строки, поэтому <code>\\n<\/code> в конце.<\/li><li>Неиспользуемая переменная или импорт в Go это <b>ошибка компиляции<\/b>.<\/li><\/ul><p><b>Визитная карточка<\/b>: fmt.Printf и <code>:=<\/code>.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> <code>:=<\/code> это <b>short variable declaration<\/b>; стиль кода задаёт утилита <b>gofmt<\/b> (поэтому табы).<\/p>"}, {"t": "idea", "h": "Rust", "body": "<ul><li><code>let student_number: u32 = ⟦N⟧;<\/code>: неизменяемая переменная, тип u32 (целое без знака, 32 бита).<\/li><li><code>format!(\"{}/{:02}\", group_name, student_number)<\/code> возвращает строку; <code>println!<\/code> печатает.<\/li><li><b>Восклицательный знак<\/b> значит <b>макрос<\/b>: он раскрывается при компиляции и проверяет формат.<\/li><li>Изменить переменную без <code>mut<\/code> нельзя: ошибка «cannot assign twice to immutable variable».<\/li><\/ul><p><b>Визитная карточка<\/b>: let, format!/println!, отдельная строка student_id.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> обычно проекты собирают через <b>Cargo<\/b> (результат в <code>target/<\/code>); у тебя напрямую <code>rustc<\/code>, поэтому в .gitignore <code>rust/main<\/code>.<\/p>"}, {"t": "check", "q": "Почему в Rust пишут <code>println!<\/code> с восклицательным знаком?", "o": ["Чтобы громче", "Это макрос, а не функция", "Без перевода строки", "Это unsafe"], "a": 1, "why": "Макрос раскрывается при компиляции, принимает любое число аргументов и проверяет формат."}, {"t": "word", "term": "Shebang", "node": "shebang", "pt": "shebang · #!", "simple": "Первая строка скрипта, которая говорит системе, какой программой его выполнять.", "like": "Надпись на конверте «вскрыть переводчиком с французского».", "ex": "<code>#!/usr/bin/env bash<\/code> в начале <code>bash/main.sh<\/code>. Работает, когда скрипт запускают как <code>./bash/main.sh<\/code> (нужно право на выполнение <code>chmod +x<\/code>). При <code>bash bash/main.sh<\/code> строка просто комментарий.", "pro": "<p><b>shebang<\/b> (от sharp + bang, <code>#!<\/code>). Его читает <b>ядро ОС<\/b>. <code>/usr/bin/env bash<\/code> ищет bash по PATH, это переносимее, чем <code>/bin/bash<\/code>.<\/p>"}, {"t": "idea", "h": "Bash", "body": "<ul><li><code>name=\"⟦EN_SUR⟧\"<\/code> <b>без пробелов<\/b> вокруг =. С пробелами bash решит, что name это команда.<\/li><li><code>$((department * student_number))<\/code>: арифметика, иначе всё строки.<\/li><li><code>$(printf \"%s/%02d\" ...)<\/code>: подстановка команды.<\/li><li><code>\"$name\"<\/code> в двойных кавычках подставляется одним аргументом, в одинарных не подставляется вовсе.<\/li><\/ul><p><b>Визитная карточка<\/b>: настоящий pipe <code>echo \"$student_name_en\" | wc -w<\/code> и <code>$( )<\/code>; плюс <code>echo -n ... | wc -c<\/code> = ⟦EN_LENB⟧.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> разбиение значения без кавычек на слова называют <b>word splitting<\/b>, поэтому правило «quote your variables».<\/p>"}, {"t": "word", "term": "Факт, правило, запрос (Prolog)", "node": "prolog", "pt": "fact · rule · query", "simple": "Факт это то, что просто истинно. Правило это «истинно, если...». Запрос это вопрос, на который Prolog сам ищет ответ.", "like": "Справочник плюс сыщик: в справочнике факты, у сыщика правила вывода, а ты задаёшь вопрос, и он сам ищет ответ.", "ex": "Факт: <code>department(304).<\/code> Правило: <code>control_value(V) :- student(_, _, N, _), department(D), V is D * N.<\/code> (читается «V это control_value, ЕСЛИ есть номер N И кафедра D И V = D×N»). Запрос: <code>in_group('⟦EN⟧', '⟦GROUP⟧')<\/code>.", "pro": "<p><b>fact<\/b>, <b>rule<\/b>, <b>query<\/b>/<b>goal<\/b>. Переменные с заглавной буквы (<code>N<\/code>), атомы со строчной (<code>student<\/code>), <code>_<\/code> анонимная. <code>:-<\/code> значит «если», запятая «и», <code>is<\/code> вычисляет арифметику. Сопоставление с фактами называется <b>унификацией<\/b>, перебор вариантов <b>поиском с возвратом<\/b> (backtracking). Подход называют <b>декларативным<\/b>: описываешь что, а не как.<\/p>"}, {"t": "predict", "q": "Что ответит Prolog на <code>?- X is 304 * ⟦N⟧.<\/code>, а что на <code>?- X = 304 * ⟦N⟧.<\/code>?", "o": ["⟦CTRL⟧ и ⟦CTRL⟧", "⟦CTRL⟧ и X = 304*⟦N⟧", "Ошибка и ⟦CTRL⟧", "Оба ошибка"], "a": 1, "reveal": "<p><code>is<\/code> вычисляет. <code>=<\/code> только сопоставляет (унифицирует), и X становится выражением 304*⟦N⟧ без вычисления. В Prolog арифметика сама по себе не считается.<\/p>"}, {"t": "do", "h": "Позадавай вопросы Prolog", "task": "Загрузи свою программу и поговори с базой фактов. После каждого ответа нажимай Enter, выход <code>halt.<\/code>", "cmd": "cd ~/Documents/vpd/lab01/dev && swipl prolog/main.pl", "look": "Приглашение <code>?-<\/code>. Введи по очереди: <code>control_value(X).<\/code>  <code>in_group(Name, '⟦GROUP⟧').<\/code>  <code>in_group('Ivan', G).<\/code>", "explain": "<p>X = ⟦CTRL⟧; Name = '⟦EN⟧'; false (такого студента в базе нет). Ты не писал цикл поиска: Prolog сам перебирает факты. В лабе запуск без диалога: <code>swipl -q -s prolog/main.pl -g main -t halt<\/code> (тихо, загрузить файл, цель main, выйти).<\/p>"}, {"t": "why", "q": "Чем программа на Prolog принципиально отличается от программы на Go?", "model": "На Go ты пишешь последовательность шагов: создай переменную, посчитай, выведи (императивный стиль). На Prolog ты описываешь факты и правила, что истинно и при каких условиях, а потом задаёшь запрос, и Prolog сам ищет ответ, сопоставляя запрос с фактами и перебирая варианты (декларативный стиль, унификация и backtracking)."}, {"t": "pro", "simple": "В Go я создал переменную, не указывая тип; в Rust значение нельзя поменять, а println с восклицательным знаком; в Prolog я описал, что истинно, и задал вопрос.", "terms": ["short variable declaration :=", "immutable / mut", "макрос", "факт / правило / запрос, декларативный"], "model": "В Go studentID объявлен через :=, тип выведен. В Rust let immutable, println! это макрос. Prolog декларативный: база фактов, правило in_group и запрос, ответ ищется унификацией с backtracking."}, {"t": "sum", "items": ["Go: := и fmt.Printf; неиспользуемое это ошибка компиляции.", "Rust: неизменяемые let, макросы format!/println!, mut для изменения.", "Bash: shebang, переменные без пробелов, $(( )), кавычки, pipe | wc.", "Prolog: факты, правила, запросы; is вычисляет; поиск с возвратом."]}], "cards": [{"q": "Визитная карточка Go?", "a": "fmt.Printf и короткое объявление := (studentID)."}, {"q": "Визитная карточка Rust?", "a": "Неизменяемые let, format!/println!, отдельная строка student_id."}, {"q": "Визитная карточка Bash?", "a": "Переменные, настоящий pipe echo | wc -w и подстановка $( )."}, {"q": "Визитная карточка Prolog?", "a": "Факт student, правило (control_value, in_group) и запрос."}, {"q": "Что такое shebang?", "a": "Первая строка #!/usr/bin/env bash: ядро по ней понимает, чем выполнять скрипт."}, {"q": "Чем is отличается от = в Prolog?", "a": "is вычисляет арифметику; = только унифицирует (сопоставляет)."}, {"q": "Почему в Bash нельзя писать name = \"x\"?", "a": "С пробелами bash считает name командой с аргументами = и x."}]}, {"id": "t3l7", "title": "Ассемблер 1: регистры, стек, вызов функции", "min": 15, "steps": [{"t": "intro", "h": "Как выглядит программа для самого процессора", "body": "<p>В теме 1 ты видел байты своей программы. Теперь поймём, что она делает. Для этого нужно 4 понятия: регистр, стек, соглашение о вызовах и секции.<\/p>"}, {"t": "word", "term": "Регистр", "node": "register", "pt": "register · rax/rdi/rsp", "simple": "Маленькая сверхбыстрая ячейка прямо внутри процессора. С ней процессор работает напрямую.", "like": "Руки повара. Продукты лежат в холодильнике (память), но готовит он только то, что держит в руках.", "ex": "У x86-64 16 основных 64-битных регистров: <code>rax, rbx, rcx, rdx, rsi, rdi, rbp, rsp, r8–r15<\/code>, и ещё <code>rip<\/code> (адрес текущей инструкции). <code>eax<\/code> это младшие 32 бита <code>rax<\/code>.", "pro": "<p><b>registers<\/b>; регистры общего назначения называют <b>GPR<\/b> (general-purpose registers). <code>rsp<\/code> это <b>stack pointer<\/b> (указатель стека), <code>rbp<\/code> <b>base pointer<\/b>.<\/p>"}, {"t": "word", "term": "Стек вызовов", "node": "cstack", "pt": "call stack · push/pop · call/ret", "simple": "Область памяти, куда программа складывает временные данные стопкой. Когда функция вызывает другую, на стек кладётся адрес, куда вернуться.", "like": "Стопка закладок: открыл новую книгу, положил закладку старой сверху; закрыл, снял закладку и вернулся.", "ex": "<code>push rbp<\/code> кладёт значение на стек, <code>pop rbp<\/code> снимает. <code>call puts<\/code> кладёт адрес возврата и прыгает в puts, <code>ret<\/code> снимает адрес и прыгает обратно.", "pro": "<p><b>call stack<\/b>. Стек растёт вниз (к меньшим адресам). Кусок стека одной функции это <b>кадр стека<\/b> (stack frame). Начало функции, готовящее кадр, это <b>пролог<\/b>, конец <b>эпилог<\/b>. Бесконечная рекурсия переполняет стек: <b>stack overflow<\/b>.<\/p>"}, {"t": "word", "term": "Соглашение о вызовах (ABI)", "node": "abi", "pt": "ABI · calling convention", "simple": "Правила, как функции передают друг другу аргументы и результат: в каких регистрах, кто что сохраняет.", "like": "Договор между цехами: «детали кладём на третий стеллаж, готовое забираем со второго». Цеха никогда не встречались, но работают вместе, потому что соблюдают договор.", "ex": "На Linux (System V ABI): первый аргумент в <code>rdi<\/code>, второй <code>rsi<\/code>, потом <code>rdx, rcx, r8, r9<\/code>; результат в <code>rax<\/code>. Поэтому адрес строки для puts кладётся в <code>rdi<\/code>. На Windows другой ABI: первый аргумент в <code>rcx<\/code>.", "pro": "<p><b>ABI<\/b> (application binary interface), <b>calling convention<\/b>. На Linux это <b>System V AMD64 ABI<\/b>, на Windows <b>Microsoft x64<\/b>. ABI позволяет коду, скомпилированному разными людьми в разное время (твой main и puts из glibc), работать вместе. Ещё правило: перед <code>call<\/code> стек должен быть <b>выровнен<\/b> на 16 байт (alignment).<\/p>"}, {"t": "predict", "q": "Почему в твоём коде адрес строки кладётся именно в <code>rdi<\/code>?", "o": ["Это регистр для строк", "По ABI Linux первый аргумент функции передаётся в rdi", "rdi самый быстрый", "Так требует puts на любой ОС"], "a": 1, "reveal": "<p>Это договор (ABI), а не свойство регистра. На Windows тот же puts ждал бы аргумент в rcx, поэтому шаблон в задании для Windows другой.<\/p>"}, {"t": "word", "term": "Секции и метки", "node": "section", "pt": "section · label · directive", "simple": "Программа делится на части: в одной код, в другой данные. Метка это имя для адреса. Строки, начинающиеся с точки, это указания ассемблеру, а не процессору.", "like": "Книга: раздел «рецепты» и раздел «список продуктов»; закладки с именами на нужных страницах; пометки для наборщика типографии.", "ex": "<code>.section .rodata<\/code> данные только для чтения (там строка); <code>.text<\/code> код; <code>message:<\/code> метка; <code>.asciz \"...\"<\/code> строка с нулём в конце; <code>.globl main<\/code> «main видно снаружи».", "pro": "<p><b>sections<\/b> (.text, .data, .rodata, .bss), <b>labels<\/b>, <b>directives<\/b>. <code>.intel_syntax noprefix<\/code> включает синтаксис Intel (сначала куда, потом откуда, регистры без %); по умолчанию GNU as использует <b>AT&amp;T<\/b> синтаксис.<\/p>"}, {"t": "check", "q": "Что делает <code>ret<\/code>?", "o": ["Возвращает 0", "Снимает со стека адрес возврата и прыгает туда", "Выводит строку", "Завершает процесс"], "a": 1, "why": "Адрес туда положил call."}, {"t": "why", "q": "Зачем вообще нужен ABI? Что сломалось бы без него?", "model": "ABI это договор о том, как функции передают аргументы и результат, какие регистры сохраняются и как выровнен стек. Без договора отдельно скомпилированный код не смог бы работать вместе: мой main положил бы аргумент в один регистр, а puts из библиотеки искал бы его в другом. Поэтому все на Linux следуют System V ABI, а на Windows свой."}, {"t": "pro", "simple": "Я положил адрес строки в нужную ячейку процессора по общему договору и позвал функцию, которая потом вернулась по адресу, оставленному в стопке.", "terms": ["регистр rdi", "System V ABI", "call / ret", "стек вызовов"], "model": "По System V ABI первый аргумент передаётся в rdi, поэтому кладу туда адрес строки и делаю call puts; call кладёт адрес возврата на стек вызовов, ret его снимает."}, {"t": "sum", "items": ["Регистры это сверхбыстрые ячейки процессора (rax, rdi, rsp, rip...).", "Стек вызовов хранит адреса возврата: call кладёт, ret снимает.", "ABI это договор о вызовах: на Linux первый аргумент в rdi, результат в rax.", "Секции: .text код, .rodata данные; метки и директивы для ассемблера."]}], "cards": [{"q": "Что такое регистр?", "a": "Сверхбыстрая ячейка внутри процессора (rax, rdi, rsp, rip)."}, {"q": "Что делают call и ret?", "a": "call кладёт адрес возврата на стек и прыгает в функцию; ret снимает его и возвращается."}, {"q": "Что такое ABI?", "a": "Соглашение о вызовах: где аргументы, где результат, что сохраняется; на Linux System V (rdi), на Windows Microsoft x64 (rcx)."}, {"q": "Где у функции результат по ABI x86-64?", "a": "В rax (eax для 32 бит)."}, {"q": "Что такое .rodata и .text?", "a": "Секции: .rodata данные только для чтения, .text исполняемый код."}, {"q": "Что делает .asciz?", "a": "Кладёт строку с нулевым байтом в конце."}]}, {"id": "t3l8", "title": "Ассемблер 2: твоя программа целиком", "min": 15, "steps": [{"t": "intro", "h": "Собираем всё вместе", "body": "<p>Теперь ты знаешь регистры, стек и ABI. Пройдём твою программу от начала до конца и поймём каждую строку, а заодно две защиты современных программ.<\/p>"}, {"t": "idea", "h": "Построчно", "body": "<pre>main:\n    push rbp                  ; пролог: сохранить rbp, выровнять стек на 16\n    mov rbp, rsp              ; база кадра\n    lea rdi, [rip + message]  ; адрес строки → rdi (1-й аргумент)\n    call puts@PLT             ; вызвать puts из libc\n    xor eax, eax              ; результат 0 (return 0)\n    pop rbp                   ; эпилог: восстановить rbp\n    ret                       ; вернуться в стартовый код libc<\/pre><p><code>lea<\/code> (load effective address) кладёт <b>адрес<\/b>, а не содержимое. <code>xor eax, eax<\/code> обнуляет регистр (XOR числа с самим собой даёт 0); так короче, чем <code>mov eax, 0<\/code>.<\/p>"}, {"t": "idea", "h": "Зачем пролог и почему «16 байт»", "body": "<p><b>Пролог<\/b> это две первые строки функции: <code>push rbp<\/code> и <code>mov rbp, rsp<\/code>. <b>Эпилог<\/b> это последние: <code>pop rbp<\/code> и <code>ret<\/code>. Пролог готовит рабочее место функции, эпилог убирает за собой.<\/p><p>Теперь про 16 байт. ABI требует: в момент <code>call<\/code> адрес вершины стека (<code>rsp<\/code>) должен делиться на 16. Это называется <b>выравнивание стека<\/b>. Библиотечные функции вроде <code>puts<\/code> рассчитывают на это и могут упасть, если правило нарушено.<\/p><p>Считаем по шагам:<\/p><ol><li>Перед тем как вызвать твой <code>main<\/code>, стек был выровнен (делится на 16).<\/li><li>Вызов <code>main<\/code> положил на стек адрес возврата: 8 байт. Теперь стек «сдвинут» на 8 и не делится на 16.<\/li><li><code>push rbp<\/code> кладёт ещё 8 байт. 8 + 8 = 16, и стек снова выровнен.<\/li><li>Теперь можно делать <code>call puts<\/code>.<\/li><\/ol><p>Так что <code>push rbp<\/code> делает два дела сразу: сохраняет старое значение <code>rbp<\/code> (его потом вернёт <code>pop rbp<\/code>) и выравнивает стек.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> «пролог сохраняет rbp и выравнивает стек на 16 байт по System V ABI перед call».<\/p>"}, {"t": "word", "term": "Позиционно-независимый код (PIE)", "node": "pie", "pt": "PIE · ASLR · rip-relative", "simple": "Программа, которая работает, по какому бы адресу её ни загрузили в память. Для этого адреса в ней считаются относительно текущей инструкции.", "like": "Указание «третья дверь от этой» вместо «дом 15»: работает, где бы ты ни стоял.", "ex": "<code>[rip + message]<\/code>: адрес строки = адрес следующей инструкции + смещение. В байтах: <code>lea<\/code> по адресу 0x113d длиной 7 байт, смещение 0xec0, итого 0x1144 + 0xec0 = 0x2004.", "pro": "<p><b>PIE<\/b> (position-independent executable), адресация <b>rip-relative<\/b>. Нужно для <b>ASLR<\/b> (address space layout randomization): ОС при каждом запуске грузит программу по случайному адресу, чтобы атакующему было труднее использовать уязвимость. Проверь: <code>file c/main<\/code> пишет «pie executable».<\/p>"}, {"t": "word", "term": "PLT: вызов функции из библиотеки", "node": "plt", "pt": "PLT · GOT · dynamic linking", "simple": "Адрес puts в libc неизвестен до запуска. Поэтому программа зовёт маленькую заглушку внутри себя, а та прыгает по адресу, который вписал загрузчик при запуске.", "like": "Звонок через ресепшен: ты звонишь на внутренний номер, а ресепшен соединяет с нужным человеком, чей номер узнали утром.", "ex": "<code>call puts@PLT<\/code>. Новые версии as делают такой вызов и для простого <code>call puts<\/code>, но @PLT пишет намерение явно.", "pro": "<p><b>PLT<\/b> (procedure linkage table, заглушки) и <b>GOT<\/b> (global offset table, таблица адресов). Заполняет GOT <b>динамический загрузчик<\/b> ld-linux (dynamic loader). Это механизм <b>динамической линковки<\/b> из темы 1.<\/p>"}, {"t": "do", "h": "Собери в два шага и проверь код возврата", "task": "Ассемблер даёт объектный файл, gcc линкует его с libc.", "cmd": "cd ~/Documents/vpd/lab01/dev/asm && as assembler.s -o assembler.o && gcc assembler.o -o assembler && ./assembler; echo \"код: $?\"", "look": "Строка Hello... и «код: 0».", "explain": "<p>gcc тут ничего не компилирует, только линкует: подключает libc и стартовый код. Стартовый код (<code>_start<\/code>) готовит процесс и вызывает твой <code>main<\/code>, поэтому метка называется main. Код 0 дал <code>xor eax, eax<\/code>. Если его убрать, код станет 73: столько байт напечатал puts, и это значение осталось в eax.<\/p>"}, {"t": "order", "q": "Расставь по порядку, что происходит при <code>./assembler<\/code>:", "items": ["Ядро читает ELF-файл и видит, что нужен загрузчик ld-linux", "ld-linux загружает libc и заполняет GOT адресом puts", "Стартовый код _start вызывает main", "main кладёт адрес строки в rdi и вызывает puts через PLT", "main возвращает 0 в eax, процесс завершается с кодом 0"], "why": "<p>Это полный путь от команды до кода возврата: ELF, загрузчик, PLT/GOT, ABI.<\/p>"}, {"t": "idea", "h": "Как это было бы на других системах", "body": "<div class=\"tbl\"><table><tr><th><\/th><th>Linux x86-64 (ты)<\/th><th>Windows x86-64<\/th><th>Mac M1 (ARM64)<\/th><\/tr><tr><td>1-й аргумент<\/td><td>rdi<\/td><td>rcx + 32 байта shadow space<\/td><td>x0<\/td><\/tr><tr><td>Стек перед call<\/td><td>push rbp<\/td><td>sub rsp, 40<\/td><td>stp x29, x30<\/td><\/tr><tr><td>Строки<\/td><td>.rodata<\/td><td>.rdata<\/td><td>__TEXT,__cstring<\/td><\/tr><tr><td>Вызов<\/td><td>call puts@PLT<\/td><td>call puts<\/td><td>bl _puts<\/td><\/tr><\/table><\/div><p>Разные ABI и разные процессоры, поэтому три разных шаблона в задании.<\/p>"}, {"t": "story", "h": "Картина целиком", "body": "<p>Все 13 программ работают с одними данными: <b>переменными<\/b> разных <b>типов<\/b> и <b>строками<\/b>, а вывод собирается <b>форматированием<\/b> без хардкода.<\/p><p>Языки различаются по осям. <b>Типизация<\/b>: статическая (C, Java, Rust, TS; ошибки в compile-time) или динамическая (Python, JS; ошибки в runtime), сильная или слабая, с <b>выводом типов<\/b> или без. <b>Память<\/b>: вручную (C, отсюда snprintf и буферы), RAII (C++), <b>GC<\/b> (Java, C#, Go, JS, Python), владение (Rust). <b>Неизменяемость<\/b> по умолчанию у Rust и F#. <b>Парадигма<\/b>: императивная (C, Go), ООП (Java, C#), функциональная (F# и |&gt;), декларативная (Prolog), «клей» (Bash и pipe).<\/p><p>Поэтому у каждого языка своя визитная карточка: она показывает его суть. А под всеми языками лежит то, что видит процессор: <b>регистры<\/b>, <b>стек вызовов<\/b>, договор <b>ABI<\/b>, секции, <b>PIE<\/b> для ASLR и <b>PLT/GOT<\/b> для вызова libc. Твой ассемблер показывает это без прикрас.<\/p>"}, {"t": "why", "q": "Препод: «Расскажи, как работает твоя программа на ассемблере». Ответь в 4–6 предложениях.", "model": "В секции .rodata лежит строка message, .asciz добавляет нулевой байт. В .text объявлен глобальный main, его вызывает стартовый код libc. Пролог push rbp/mov rbp, rsp сохраняет rbp и выравнивает стек на 16 байт, как требует ABI перед call. lea rdi, [rip + message] кладёт в rdi адрес строки (rip-relative, потому что программа PIE); rdi это первый аргумент по System V ABI. call puts@PLT вызывает puts из libc через PLT. xor eax, eax делает результат 0, pop rbp и ret возвращают управление, процесс завершается с кодом 0."}, {"t": "pro", "simple": "Программа может загрузиться по любому адресу, поэтому строку она ищет относительно себя, а функцию из общей библиотеки зовёт через заглушку, адрес в которую подставили при запуске.", "terms": ["PIE / ASLR", "rip-relative адресация", "PLT / GOT", "динамический загрузчик"], "model": "Бинарник собран как PIE для ASLR, поэтому строка адресуется rip-relative. puts вызывается через PLT, а реальный адрес в GOT проставляет динамический загрузчик ld-linux при старте."}, {"t": "sum", "items": ["Твоя программа: пролог, lea rdi, call puts@PLT, xor eax, эпилог, ret.", "PIE и rip-relative адреса нужны для ASLR (безопасность).", "PLT/GOT позволяют вызывать функции libc, адрес которых известен только при запуске.", "as делает .o, gcc линкует с libc и стартовым кодом.", "На Windows и Mac другой ABI и другие шаблоны."]}], "cards": [{"q": "Что делает lea rdi, [rip + message]?", "a": "Кладёт в rdi адрес строки, вычисленный относительно rip (нужно для PIE)."}, {"q": "Зачем xor eax, eax?", "a": "Обнулить eax, то есть вернуть 0 из main; короче, чем mov eax, 0."}, {"q": "Что такое PIE и ASLR?", "a": "PIE работает с любого адреса загрузки; ASLR грузит программу по случайному адресу для защиты."}, {"q": "Что такое PLT и GOT?", "a": "PLT это заглушки для вызова функций библиотек; GOT это таблица их адресов, которую заполняет загрузчик."}, {"q": "Почему метка main, а не _start?", "a": "Линкуем через gcc: стартовый код libc (_start) готовит процесс и сам вызывает main."}, {"q": "Почему push rbp перед call?", "a": "Пролог: сохранить rbp и выровнять стек на 16 байт, как требует ABI."}]}, {"id": "t3l9", "title": "Код руками: читаем и правим", "min": 18, "steps": [{"t": "intro", "h": "Препод может попросить поменять код", "body": "<p>На защите любят: «поменяй номер на 7 и запусти», «что выведет эта строка», «найди ошибку». Тренируемся на копии лабы, чтобы ничего не испортить.<\/p>"}, {"t": "do", "h": "Сделай копию лабы для экспериментов", "task": "Копия вне git-репозитория лабы.", "cmd": "rm -rf /tmp/lab && cp -r ~/Documents/vpd/lab01/dev /tmp/lab && cd /tmp/lab && ls", "look": "Папки языков.", "explain": "<p>Дальше все правки в <code>/tmp/lab<\/code>. Настоящая лаба останется нетронутой.<\/p>"}, {"t": "predict", "q": "В C поменяли <code>student_number<\/code> на 7. Что будет в строке Student ID?", "o": ["⟦GROUP⟧/7", "⟦GROUP⟧/07", "⟦GROUP⟧/ 7", "Ошибка"], "a": 1, "reveal": "<p>%02d дополнит нулём до двух цифр. А control_value станет 304 × 7 = 2128.<\/p>"}, {"t": "task", "h": "Поменяй номер на 7 в трёх языках", "goal": "В копии поменяй номер студента на 7 в C, Python и Rust, собери и запусти. Проверь, что везде /07 и Control: 2128.", "hint": "Номер задан в начале каждого файла. C: gcc ... -o, Rust: rustc ... -o.", "solution": "<pre>cd /tmp/lab\nsed -i 's/student_number = ⟦N⟧/student_number = 7/' c/main.c python/main.py\nsed -i 's/student_number: u32 = ⟦N⟧/student_number: u32 = 7/' rust/main.rs\ngcc c/main.c -o c/main &amp;&amp; ./c/main\npython3 python/main.py\nrustc rust/main.rs -o rust/main &amp;&amp; ./rust/main<\/pre><p>Можно править и в nvim руками. Главное: /07 и 2128 во всех трёх.<\/p>"}, {"t": "predict", "q": "Что выведет Python?<br><code>name = \"Ivan Petrov\"<br>print(len(name.split()), len(name))<\/code>", "o": ["2 11", "2 10", "11 2", "1 11"], "a": 0, "reveal": "<p>split даёт 2 слова, длина строки 11 (10 букв и пробел).<\/p>"}, {"t": "predict", "q": "В Bash написали <code>name = \"Ivan\"<\/code>. Что будет?", "o": ["Переменная создастся", "Ошибка name: command not found", "Ничего", "Сравнение"], "a": 1, "reveal": "<p>С пробелами вокруг = это вызов команды name. Правильно <code>name=\"Ivan\"<\/code>.<\/p>"}, {"t": "check", "q": "В Java забыли <code>%n<\/code> в конце printf. Что изменится?", "o": ["Ошибка компиляции", "Строки слипнутся в одну, перевод строки не выведется", "Ничего", "Программа упадёт"], "a": 1, "why": "printf сам не добавляет перевод строки, в отличие от println."}, {"t": "task", "h": "Найди и почини ошибку в Rust", "goal": "В копии добавь в rust/main.rs после объявления student_number строку <code>student_number = 22;<\/code>, собери и прочитай ошибку. Почини так, чтобы программа собралась с этим присваиванием.", "hint": "Сообщение компилятора прямо говорит, что добавить; в Rust изменяемость надо объявить.", "solution": "<p>rustc: <code>cannot assign twice to immutable variable<\/code> и подсказка <code>help: consider making this binding mutable: mut student_number<\/code>. Починка: <code>let mut student_number: u32 = ⟦N⟧;<\/code>. Вывод: Rust неизменяем по умолчанию.<\/p>"}, {"t": "task", "h": "Добавь строку в Prolog", "goal": "В копии prolog/main.pl добавь факт <code>student('Иван Петров', 'Ivan Petrov', 7, '⟦GROUP⟧').<\/code> и в swipl спроси, кто состоит в группе ⟦GROUP⟧ (все ответы, через ;).", "hint": "Факт пишется отдельной строкой с точкой. Запрос in_group(Name, '⟦GROUP⟧').", "solution": "<p>Prolog выдаст оба имени: сначала ⟦EN⟧, после <kbd>;<\/kbd> Ivan Petrov. Это поиск с возвратом. Заметь: control_value теперь тоже даст два ответа.<\/p>"}, {"t": "task", "h": "TypeScript поймает ошибк
