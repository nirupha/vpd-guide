<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#17181A" media="(prefers-color-scheme: dark)"><style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0}</style></head><body><title>ВПД шаг за шагом</title><meta name="description" content="Интерактивный учебник по лабораторным ВПД. Сейчас: ЛР1 «Языки программирования, терминал и Git».">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Конспект с маркером: белая страница, чернила, один цвет — жёлтый маркер для нового и для «ты здесь». Без карточек и теней: структуру держат отступы и тонкие линии. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --raise:#F4F4F1; --ink:#1C1D20; --muted:#686B71; --line:#E9E9E5; --line2:#D2D3CE;
  --accent:#1C1D20; --accent-ink:#FFFFFF; --accent-soft:#F1F1ED; --accent-2:#3B3D42;
  --mark:#FFE15A; --mark-soft:#FFF3B0; --mark-ink:#1C1D20;
  --ok:#1E7A4C; --ok-soft:#EAF4EE; --bad:#C2372B; --bad-soft:#FCEDEB; --warm:#8C5B00; --warm-soft:#FFF6D8;
  --code-bg:#F4F4F1; --code-ink:#1C1D20; --scrim:rgba(20,21,24,.32);
  --f-display:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181A; --surface:#17181A; --raise:#212225; --ink:#ECECE8; --muted:#9C9EA3; --line:#2A2B2F; --line2:#3C3E43;
  --accent:#ECECE8; --accent-ink:#17181A; --accent-soft:#232427; --accent-2:#D4D4D0;
  --mark:#E9CD45; --mark-soft:#3A3417; --mark-ink:#17181A;
  --ok:#6DCB97; --ok-soft:#18271F; --bad:#F2897C; --bad-soft:#33201D; --warm:#E8C35A; --warm-soft:#2E2816;
  --code-bg:#212225; --code-ink:#E2E2DE; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181A; --surface:#17181A; --raise:#212225; --ink:#ECECE8; --muted:#9C9EA3; --line:#2A2B2F; --line2:#3C3E43;
  --accent:#ECECE8; --accent-ink:#17181A; --accent-soft:#232427; --accent-2:#D4D4D0;
  --mark:#E9CD45; --mark-soft:#3A3417; --mark-ink:#17181A;
  --ok:#6DCB97; --ok-soft:#18271F; --bad:#F2897C; --bad-soft:#33201D; --warm:#E8C35A; --warm-soft:#2E2816;
  --code-bg:#212225; --code-ink:#E2E2DE; --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.62 var(--f-body);margin:0;font-feature-settings:"kern","liga"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:3px}
::selection{background:var(--mark);color:var(--mark-ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
code{font-family:var(--f-mono);background:var(--code-bg);color:var(--code-ink);padding:.1em .36em;border-radius:4px;font-size:.84em;overflow-wrap:anywhere}
pre{font-family:var(--f-mono);background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:14px 16px;overflow-x:auto;font-size:13.5px;line-height:1.6;white-space:pre;margin:14px 0}
pre.out{background:transparent;border:1px solid var(--line);color:var(--muted)}
kbd{font:600 .85em var(--f-mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 .35em;background:var(--surface)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 22px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;min-width:0;line-height:1.25}
.top .ttl small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.iconbtn:hover{background:var(--raise)}
.segs{display:flex;gap:3px;margin-top:10px}
.segs button{flex:1;height:4px;border:0;padding:0;border-radius:2px;background:var(--line);cursor:pointer}
.segs button.p{background:color-mix(in srgb,var(--ink) 32%,var(--line))}
.segs button.c{background:var(--ink)}
.segs button[disabled]{cursor:default}
.pbar{display:none;width:100%;align-items:center;gap:12px;margin-top:6px;padding:6px 0;background:none;border:0;font:inherit;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pbar .trk{position:relative;flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pbar .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.pbar .rch{background:color-mix(in srgb,var(--ink) 32%,var(--line))}
.pbar .cur{background:var(--ink)}
.pbar .pl{font:500 13px/1 var(--f-body);white-space:nowrap;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.pbar .pl .i{width:16px;height:16px}
@media (max-width:600px){.top .segs.lsegs{display:none}.pbar{display:flex}}

/* «что значит каждое слово» под шагом */
details.lexd{margin:28px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
details.lexd>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 0;cursor:pointer;font:500 15px/1.3 var(--f-body);color:var(--ink)}
details.lexd>summary::-webkit-details-marker{display:none}
details.lexd>summary .i{width:18px;height:18px;flex:none;color:var(--muted)}
details.lexd>summary .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
details.lexd>summary .chev{width:18px;height:18px;transition:transform .2s;color:var(--muted)}
details.lexd[open]>summary .chev{transform:rotate(180deg)}
.lexmini{padding:0 0 8px}
.lexmini button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 8px;margin:0 -8px;width:calc(100% + 16px);font:15px/1.45 var(--f-body);color:var(--ink);cursor:pointer}
.lexmini button:hover{background:var(--raise)}
.lexmini b{font-weight:600}
.lexmini span{color:var(--muted)}
.lexmini .more{font-size:13px;color:var(--muted);padding:6px 0 4px;margin:0}

/* кнопки */
.btn{font:500 15px/1 var(--f-body);border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:10px;padding:13px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--raise)}
.btn.small{padding:8px 12px;font-size:14px;min-height:36px;border-radius:8px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.35;cursor:default}
.btn[disabled]:hover{border-color:var(--line2)}

/* шаг урока: без рамки, текст прямо на странице */
.card{background:transparent;border:0;border-radius:0;padding:4px 0 0}
.card+.card{border-top:1px solid var(--line);padding-top:22px}
.kind{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px;font-size:14px;color:var(--muted)}
.kind b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:8px;font:500 14px/1 var(--f-body);color:var(--muted)}
.pill::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--k,var(--ink))}
.kind span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
h1{font:700 clamp(34px,8.6vw,48px)/1.06 var(--f-display);margin:0 0 14px;text-wrap:balance;letter-spacing:-.028em}
h2{font:650 clamp(22px,5.4vw,26px)/1.25 var(--f-display);margin:0 0 14px;text-wrap:balance;letter-spacing:-.015em}
h3{font:600 17px/1.35 var(--f-body);margin:26px 0 8px}
p,li{max-width:62ch}
p{margin:12px 0}
ol,ul{padding-left:1.3em}
li{margin:5px 0}
li::marker{color:var(--muted)}
.term{font:700 clamp(32px,8.4vw,44px)/1.14 var(--f-display);margin:0 0 16px;letter-spacing:-.025em;text-wrap:balance}
.term span{background:linear-gradient(transparent 52%,var(--mark) 52%,var(--mark) 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .06em}
.lab{font:600 14px/1.3 var(--f-body);color:var(--muted);margin:26px 0 6px}
.lab:first-of-type{margin-top:0}
.like{border-left:2px solid var(--line2);padding:2px 0 2px 16px;margin:0}
.pro{background:var(--raise);border-radius:10px;padding:12px 16px;font-size:15.5px}
.pro p{margin:4px 0}
.opts{display:grid;gap:8px;margin-top:20px}
.opt{text-align:left;font:16px/1.45 var(--f-body);border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){opacity:.55}
.reveal{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
details.reveal summary{cursor:pointer;color:var(--ink);font-weight:500;font-size:15px;list-style:none;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px}
details.reveal summary::-webkit-details-marker{display:none}
details.reveal summary::before{content:"+ "}
details.reveal[open] summary::before{content:"− "}
.note{font-size:14.5px;color:var(--muted)}
.ok-msg{color:var(--ok);font-weight:600}
.cmd{position:relative}
.cmd pre{padding-right:84px}
.cmd .cp{position:absolute;top:7px;right:7px;background:var(--bg)}
textarea{width:100%;min-height:120px;font:16px/1.55 var(--f-body);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;background:var(--surface);color:var(--ink);resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.fb{white-space:pre-wrap;margin-top:16px;font-size:15.5px;background:var(--raise);border-radius:10px;padding:13px 16px}
.fb:empty{display:none}
.model{background:var(--ok-soft);border-radius:10px;padding:12px 16px;margin-top:12px;font-size:15.5px}
.nav{display:flex;gap:10px;margin-top:20px;align-items:center;flex-wrap:wrap}
.nav .grow{flex:1}
.tbl{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;font-size:14.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:9px 12px 9px 0;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-weight:600;font-size:13.5px;color:var(--muted);border-bottom-color:var(--line2)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0}
.flow .s{border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:14px;line-height:1.3}
.flow .s small{display:block;color:var(--muted);font-size:12.5px}
.flow .a{color:var(--muted);font-family:var(--f-mono);font-size:13px}
.sum{padding-left:0;list-style:none}
.sum li{margin:12px 0;padding-left:30px;position:relative}
.sum li::before{content:"";position:absolute;left:4px;top:.42em;width:13px;height:7px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}

/* понятия на карте и в уроке */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:7px;font:500 14px/1.2 var(--f-body);border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 11px;cursor:pointer}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line2)}
.chip:hover{border-color:var(--ink)}
.chip.got::before{background:var(--ok)}
.chip.here{border-color:var(--ink);background:var(--mark);color:var(--mark-ink)}
.chip.here::before{background:var(--mark-ink)}
.chip.lock{color:var(--muted);border-style:dashed;background:transparent}
.chip.plain{cursor:default}
.chip.plain::before{display:none}
.dlg{margin-top:14px}
.dlg .m{padding:11px 14px;border-radius:12px;white-space:pre-wrap;margin:8px 0;font-size:15.5px}
.dlg .m.u{background:var(--ink);color:var(--accent-ink);margin-left:14%}
.dlg .m.a{background:var(--raise)}
.dlg form{display:flex;gap:8px;margin-top:12px}
.dlg input{flex:1;min-width:0;font:16px var(--f-body);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;background:var(--surface);color:var(--ink)}
.ord{display:grid;gap:8px;margin-top:14px}
.ordpick{min-height:50px;border:1px dashed var(--line2);border-radius:10px;padding:8px;display:grid;gap:6px;margin-top:14px}
.ordpick .it{background:var(--raise);border-radius:8px;padding:9px 12px;font-size:15px;display:flex;gap:10px}
.ordpick .it b{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* нижняя панель урока */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.dock .in{max-width:648px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.has-dock{padding-bottom:96px}
.card h2.q{font:600 20px/1.42 var(--f-body);letter-spacing:-.005em}
.todo .info{opacity:1}
.todo .info b{text-decoration:none;color:var(--muted);font-weight:500}
.todo .info .bx{color:var(--ok);border-color:transparent;background:transparent}
.more{font-size:13.5px;color:var(--muted);padding:4px 0}
.dock .mid{justify-self:center;font-variant-numeric:tabular-nums}
.under{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

/* листы снизу */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:39}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:84vh;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.14);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:9px auto 0}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:10px max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px))}
.sheet .hd b{flex:1;font:650 19px/1.3 var(--f-display);letter-spacing:-.01em}
.sheet .bd{overflow-y:auto;padding:4px max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.sheet{left:50%;right:auto;bottom:24px;transform:translateX(-50%);width:540px;border-radius:16px;max-height:78vh}.sheet .grab{display:none}}
.steplist{display:grid;gap:2px}
.steplist button{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:9px 8px;border-radius:8px;cursor:pointer}
.steplist button:hover{background:var(--raise)}
.steplist button.cur{background:var(--raise)}
.steplist button[disabled]{opacity:.45;cursor:default}
.steplist .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:500 12.5px var(--f-body);border:1px solid var(--line2);color:var(--muted);font-variant-numeric:tabular-nums}
.steplist .done .n,.steplist button.p .n{background:var(--ink);border-color:var(--ink);color:var(--accent-ink)}
.steplist button.cur .n{background:var(--mark);border-color:var(--ink);color:var(--mark-ink)}
.steplist .t b{display:block;font-weight:500;font-size:15px;line-height:1.3}
.steplist .t span{font-size:12.5px;color:var(--muted)}

/* главная */
.hello{padding-top:44px;margin-bottom:28px}
.hello .cd{display:inline-block;font:600 14px/1.4 var(--f-body);color:var(--mark-ink);background:var(--mark);padding:1px 7px;border-radius:3px;margin-bottom:16px}
.hello p{color:var(--muted);margin:0;font-size:17px;max-width:44ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:16px 12px 14px 0}
.stat+.stat{padding-left:14px;border-left:1px solid var(--line)}
.stat .n{font:650 26px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.3}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){border-left:0;padding-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.today{border:1px solid var(--line2);border-radius:14px;padding:20px 20px 16px}
.today .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.today .hd b{font:650 20px/1.3 var(--f-display);letter-spacing:-.01em}
.today .hd span{font-size:13.5px;color:var(--muted)}
.todo{display:grid;gap:0;margin:14px 0 10px}
.todo button{display:flex;gap:14px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;border-radius:0;padding:13px 0;cursor:pointer}
.todo button:last-of-type{border-bottom:1px solid var(--line)}
.todo button:hover:not([disabled]) b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.todo button[disabled]{cursor:default}
.todo .bx{width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--accent-ink)}
.todo .ok .bx{background:var(--ink);border-color:var(--ink)}
.todo .ok b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.todo b{font-weight:500;font-size:16px;line-height:1.35;display:block}
.todo small{color:var(--muted);font-size:13.5px}
.todo button>.i{color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:28px 0}
.qa a,.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;color:var(--ink);text-decoration:none;font:inherit;cursor:pointer;transition:border-color .15s}
.qa a:hover,.qa button:hover{border-color:var(--ink)}
.qa b{font-weight:600;font-size:15.5px;line-height:1.3}

.dict-search{width:100%;font:16px var(--f-body);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;background:var(--surface);color:var(--ink);margin-top:6px}

.mybtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

<script type="application/json" id="content">[{"id": "t1", "title": "Как компьютер выполняет программу", "role": "Что происходит с текстом программы, чтобы она заработала: машинный код, компилятор, интерпретатор, байт-код, JIT.", "link": "", "map": {"lead": "Сверху то, что пишет человек. Снизу то, что реально выполняет железо. Посередине три способа перевода.", "rows": [{"label": "Что пишет человек", "nodes": ["src"], "arrow": "нужно перевести на язык процессора: три пути"}, {"label": "Путь 1 · заранее (C, C++, Rust, Go)", "nodes": ["compiler", "library", "linking", "exe", "exeformat"], "arrow": ""}, {"label": "Путь 2 · на лету (Python, Bash, Prolog)", "nodes": ["interp"], "arrow": ""}, {"label": "Путь 3 · через байт-код (Java, C#, F#, JS)", "nodes": ["bytecode", "vm", "stack", "jit"], "arrow": ""}, {"label": "Путь 4 · перевод в другой язык (TypeScript → JavaScript)", "nodes": ["transpile"], "arrow": "все пути в итоге приводят к машинному коду"}, {"label": "Что выполняет железо", "nodes": ["machinecode", "asm", "instr", "cpu", "memory"], "arrow": ""}], "extra": {"src": {"label": "Исходный код", "simple": "Текст программы, который пишет человек: main.c, main.py, Main.java.", "pro": "<b>source code<\/b>, «исходники», «сорцы». Говорят: «залей исходники в репозиторий».", "lesson": "t1l2"}}}, "lessons": [{"id": "t1l1", "title": "Процессор и машинный код", "min": 15, "steps": [{"t": "intro", "h": "С чего всё начинается", "body": "<p>Ты написал программу на 13 языках. Каждая выводит одно и то же, но запускаются они по-разному: C надо «собрать», Python запускается сразу, Java делает какой-то .class. Почему?<\/p><p>Чтобы это понять, начнём с самого низа: что вообще умеет компьютер. В этом уроке 5 новых слов. Каждое будет объяснено, прежде чем понадобится.<\/p>"}, {"t": "word", "term": "Процессор", "node": "cpu", "pt": "CPU", "simple": "Главная микросхема компьютера, которая выполняет команды.", "like": "Очень быстрый, но очень простой повар. Он умеет только элементарные действия: взять, сложить, сравнить, перейти к другому шагу рецепта. Зато делает миллиарды таких действий в секунду.", "ex": "Всё, что делает компьютер, от вывода текста до игр, складывается из таких простых действий.", "pro": "<p><b>CPU<\/b> (central processing unit). Тип процессора называют <b>архитектурой<\/b>: <b>x86-64<\/b> (он же amd64, у тебя), <b>ARM64<\/b> (он же AArch64, у Mac M1–M4 и телефонов).<\/p><p>В разговоре: «под какую архитектуру собрано?», «бинарник под x86-64».<\/p>"}, {"t": "word", "term": "Память и байт", "node": "memory", "pt": "RAM · байт · адрес", "simple": "Память это огромный ряд пронумерованных ячеек. В каждой ячейке лежит число от 0 до 255. Такая ячейка называется байт. Номер ячейки называется адрес.", "like": "Камера хранения: тысячи пронумерованных шкафчиков, в каждом лежит одно маленькое число.", "ex": "В 16 ГБ оперативной памяти примерно 17 миллиардов таких ячеек.", "pro": "<p><b>RAM<\/b> (оперативная память). Байт это 8 <b>бит<\/b> (бит это 0 или 1). Адреса пишут в шестнадцатеричной системе (<b>hex<\/b>): <code>0x2004<\/code>.<\/p><p>В разговоре: «переменная лежит по такому-то адресу», «этот массив занимает 64 байта».<\/p>"}, {"t": "predict", "q": "Если в каждой ячейке памяти только число от 0 до 255, как тогда хранятся буквы, картинки и сами программы?", "o": ["Всё превращается в числа по договорённости", "Для букв и картинок есть особые ячейки", "Буквы хранятся прямо буквами"], "a": 0, "reveal": "<p>Всё хранится числами, а что они значат, это договорённость. Например, буква <code>A<\/code> это число 65, буква <code>M<\/code> это 77. Картинка это числа яркости каждой точки. И программа тоже просто числа.<\/p>"}, {"t": "word", "term": "Инструкция", "node": "instr", "pt": "instruction · opcode", "simple": "Одна простейшая команда для процессора, записанная числами.", "like": "Одна строчка рецепта: «возьми яйцо». Не «приготовь омлет», а именно мельчайший шаг.", "ex": "Для процессоров x86 байт <code>c3<\/code> (число 195) значит «вернись туда, откуда тебя позвали». Это инструкция <code>ret<\/code>.", "pro": "<p><b>instruction<\/b>; число, которое кодирует операцию, называют <b>opcode<\/b> (код операции). Полный набор инструкций процессора называется <b>ISA<\/b> (instruction set architecture): у x86-64 одна ISA, у ARM64 другая.<\/p>"}, {"t": "word", "term": "Машинный код", "node": "machinecode", "pt": "machine code · бинарник", "simple": "Программа, записанная как последовательность инструкций-чисел. Только её процессор и умеет выполнять.", "like": "Рецепт, записанный шифром, который понимает только этот повар.", "ex": "Всё, что реально выполняется на компьютере, в итоге становится машинным кодом. Вопрос только в том, кто и когда его делает.", "pro": "<p><b>machine code<\/b>, «нативный код» (<b>native code<\/b>). Файл с ним зовут <b>бинарником<\/b> (binary). Говорят: «это нативный бинарник под Linux x86-64».<\/p>"}, {"t": "idea", "h": "Как процессор выполняет программу", "body": "<p>Процессор всё время делает один и тот же цикл:<\/p><ol><li><b>Взять<\/b> следующую инструкцию из памяти.<\/li><li><b>Понять<\/b>, что она значит.<\/li><li><b>Выполнить<\/b>.<\/li><li>Перейти к следующей и повторить.<\/li><\/ol><p>Чтобы не потеряться, у процессора есть «закладка»: ячейка внутри него с адресом текущей инструкции. У x86 она называется <code>rip<\/code>.<\/p><p>Внутри процессора есть ещё несколько десятков самых быстрых ячеек, они называются <b>регистры<\/b> (rax, rdi, rsp...). Это «руки» повара: с чем он работает прямо сейчас.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> цикл называется <b>fetch → decode → execute<\/b>; rip это <b>instruction pointer<\/b> (у других процессоров program counter, PC).<\/p>"}, {"t": "do", "h": "Посмотри на машинный код своей программы", "task": "Это твоя программа на ассемблере из лабы, уже собранная. Покажем её байты.", "cmd": "objdump -d -M intel ~/Documents/vpd/lab01/dev/asm/assembler | grep -A8 '<main>:'", "look": "В середине каждой строки числа вроде <code>55<\/code>, <code>48 89 e5<\/code>, <code>c3<\/code>. Справа слова вроде <code>push rbp<\/code>, <code>ret<\/code>.", "explain": "<p>Числа в середине это <b>и есть машинный код<\/b>, байты, которые читает процессор. Слова справа это те же инструкции, записанные для людей. <code>objdump -d<\/code> это <b>дизассемблер<\/b>: переводит машинный код обратно в ассемблер.<\/p><pre class=\"out\">55                     push   rbp\n48 89 e5               mov    rbp,rsp\n48 8d 3d c0 0e 00 00   lea    rdi,[rip+0xec0]\ne8 e7 fe ff ff         call   puts@plt\n31 c0                  xor    eax,eax\n5d                     pop    rbp\nc3                     ret<\/pre>"}, {"t": "word", "term": "Ассемблер", "node": "asm", "pt": "assembly · as", "simple": "Тот же машинный код, но каждая инструкция записана словом, а не числом. Одна строка ассемблера равна одной инструкции процессора.", "like": "Шифр рецепта, у которого рядом подписаны понятные названия шагов.", "ex": "<code>55<\/code> ↔ <code>push rbp<\/code>, <code>c3<\/code> ↔ <code>ret<\/code>. Программа <code>as<\/code> переводит слова обратно в числа.", "pro": "<p>Язык называется <b>assembly language<\/b>, программа-переводчик <b>assembler<\/b> (у тебя GNU as). Слова вроде push, mov, ret называют <b>мнемониками<\/b> (mnemonics). Перевод назад делает <b>дизассемблер<\/b> (objdump).<\/p>"}, {"t": "predict", "q": "Твою программу на ассемблере x86 переносят на Mac с процессором M1 (это процессор ARM). Что будет?", "o": ["Запустится, ассемблер везде одинаковый", "Не запустится: у процессора ARM другие инструкции и другие числа", "Запустится, но медленнее"], "a": 1, "reveal": "<p>У каждого типа процессора свой набор инструкций. Байт <code>55<\/code> у x86 значит одно, а у ARM совсем другое. Поэтому ассемблер и машинный код <b>привязаны к архитектуре<\/b>. Задание лабы поэтому и даёт разные шаблоны для x86 и для Mac.<\/p>"}, {"t": "check", "q": "Что из этого процессор выполняет напрямую?", "o": ["Текст программы на C", "Машинный код", "Файл main.py", "Ассемблер (текст .s)"], "a": 1, "why": "Только машинный код. Даже ассемблер это текст, который сначала надо перевести в числа программой as."}, {"t": "why", "q": "Объясни своими словами, как другу: что такое машинный код и почему он не одинаковый на всех компьютерах?", "model": "Машинный код это программа в виде чисел, каждое число или группа чисел это простейшая команда для процессора. Процессор выполняет их одну за другой. У разных архитектур процессоров (x86-64, ARM64) свой набор команд и свои числа, поэтому машинный код для одной архитектуры не работает на другой."}, {"t": "pro", "simple": "Программа в виде чисел-команд для процессора не запустится на компьютере с другим типом процессора, потому что у него другие команды.", "terms": ["машинный код", "архитектура", "x86-64 / ARM64", "набор инструкций (ISA)"], "model": "Машинный код собирается под конкретную архитектуру. У x86-64 и ARM64 разные наборы инструкций (ISA), поэтому бинарник под x86-64 на ARM64 не запустится."}, {"t": "sum", "items": ["Процессор умеет только простейшие команды, но очень быстро.", "Память это ячейки-байты с адресами; всё в компьютере хранится числами.", "Машинный код это команды-числа; только его выполняет процессор.", "Ассемблер это машинный код, записанный словами; он привязан к архитектуре."]}], "cards": [{"q": "Что такое машинный код?", "a": "Программа в виде чисел-инструкций, которые процессор выполняет напрямую (native code, бинарник)."}, {"q": "Что такое байт и адрес?", "a": "Байт это ячейка памяти с числом 0–255 (8 бит). Адрес это номер ячейки, пишется в hex, например 0x2004."}, {"q": "Что такое архитектура процессора? Какая у тебя?", "a": "Тип процессора с его набором инструкций (ISA). У тебя x86-64, у Mac M1 ARM64."}, {"q": "Чем ассемблер отличается от машинного кода?", "a": "Те же инструкции, но словами (мнемоники); as переводит их в числа, objdump обратно."}, {"q": "Почему код для x86-64 не работает на ARM64?", "a": "Разные наборы инструкций (ISA): те же байты значат там другое."}, {"q": "Как называется цикл работы процессора?", "a": "fetch → decode → execute: взять инструкцию по адресу из rip, понять, выполнить."}]}, {"id": "t1l2", "title": "Компилятор: как текст становится программой", "min": 15, "steps": [{"t": "intro", "h": "Проблема", "body": "<p>Писать программы числами невозможно. Даже на ассемблере долго: одна твоя строчка вывода это 7 инструкций.<\/p><p>Поэтому люди придумали языки, похожие на человеческие: C, Rust, Go. Но процессор понимает только машинный код. Значит, нужен <b>переводчик<\/b>. В этом уроке первый способ перевода.<\/p>"}, {"t": "idea", "h": "Исходный код", "body": "<p><b>Исходный код<\/b> это текст программы, который пишет человек: обычный текстовый файл. <code>c/main.c<\/code>, <code>python/main.py<\/code>, <code>java/Main.java<\/code> это всё исходный код.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> <b>source code<\/b>, «исходники», «сорцы».<\/p>", "unlock": ["src"]}, {"t": "word", "term": "Компилятор", "node": "compiler", "pt": "compiler · компиляция", "simple": "Программа-переводчик. Она читает весь исходный код <b>заранее<\/b> и переводит его в машинный код.", "like": "Переводчик книги. Он один раз перевёл книгу, и дальше читатель читает перевод сам, переводчик ему больше не нужен.", "ex": "<code>gcc<\/code> компилирует C, <code>g++<\/code> компилирует C++, <code>rustc<\/code> компилирует Rust.", "pro": "<p><b>compiler<\/b>; процесс называется <b>компиляция<\/b> (compilation), а «заранее» по-английски <b>AOT<\/b> (ahead-of-time). Набор инструментов для сборки (компилятор, ассемблер, линковщик) называют <b>тулчейн<\/b> (toolchain).<\/p><p>В разговоре: «проект собирается gcc», «ошибка компиляции» (compile error), «компилируемый язык».<\/p>"}, {"t": "word", "term": "Исполняемый файл", "node": "exe", "pt": "executable · бинарник", "simple": "Результат компиляции: файл с машинным кодом, который можно запускать.", "like": "Готовая переведённая книга.", "ex": "<code>c/main<\/code> после команды <code>gcc c/main.c -o c/main<\/code>. Флаг <code>-o<\/code> говорит, как назвать результат (output).", "pro": "<p><b>executable<\/b>, «бинарник», «экзешник» (на Windows .exe). Процесс превращения исходников в исполняемый файл называют <b>сборкой<\/b> (build), результат иногда <b>артефактом сборки<\/b> (build artifact).<\/p>"}, {"t": "predict", "q": "Ты собрал c/main, а потом удалил gcc из системы. Запустится ли ./c/main?", "o": ["Да", "Нет, без компилятора программа не работает", "Только один раз"], "a": 0, "reveal": "<p>Запустится. Компилятор нужен только чтобы <b>сделать<\/b> программу. Готовый исполняемый файл содержит машинный код и работает сам.<\/p>"}, {"t": "idea", "h": "gcc переводит в 4 этапа", "body": "<p>Команда <code>gcc<\/code> выглядит как одно действие, но внутри это конвейер:<\/p><ol><li><b>Препроцессор<\/b>: вклеивает в текст подключённые файлы. <code>#include &lt;stdio.h&gt;<\/code> заменяется содержимым stdio.h.<\/li><li><b>Компиляция<\/b>: переводит C в ассемблер.<\/li><li><b>Ассемблирование<\/b>: ассемблер в машинный код. Получается <code>.o<\/code>, «объектный файл».<\/li><li><b>Линковка<\/b>: соединяет твой код с чужим готовым кодом, например с кодом printf.<\/li><\/ol><p class=\"pro\"><b>Как говорят профи:<\/b> preprocessor, compiler proper, assembler, linker; .o это <b>object file<\/b>. Флаги gcc для остановки на этапе: <code>-E<\/code>, <code>-S<\/code>, <code>-c<\/code>.<\/p>"}, {"t": "do", "h": "Посмотри на этап 1", "task": "Сначала угадай: в твоём main.c 34 строки. Сколько строк станет после препроцессора? Потом проверь.", "cmd": "cd ~/Documents/vpd/lab01/dev && gcc -E c/main.c | wc -l", "look": "Число строк.", "explain": "<p>Около 870 строк. Препроцессор вклеил содержимое <code>stdio.h<\/code>: там описаны printf, snprintf и сотни других функций. Флаг <code>-E<\/code> значит «останови gcc после препроцессора».<\/p>"}, {"t": "word", "term": "Библиотека", "node": "library", "pt": "library · libc", "simple": "Готовый код, который написал кто-то другой и которым пользуются все программы.", "like": "В твоём рецепте написано «добавить соус по рецепту №5 из общей кулинарной книги». Сам соус ты не расписываешь.", "ex": "Функции <code>printf<\/code> и <code>puts<\/code> лежат в стандартной библиотеке C, она называется <b>libc<\/b>. В твоём main.c их кода нет, ты их только вызываешь.", "pro": "<p><b>library<\/b>, «либа». Стандартная библиотека языка: <b>standard library<\/b>, «стдлиб». Файлы библиотек: <code>.so<\/code> (Linux), <code>.dll<\/code> (Windows), <code>.dylib<\/code> (macOS). Внешние библиотеки проекта называют <b>зависимостями<\/b> (dependencies).<\/p>"}, {"t": "word", "term": "Линковка", "node": "linking", "pt": "linker · ld", "simple": "Последний этап сборки: связать твой код с библиотеками, чтобы вызов printf знал, где находится настоящий printf.", "like": "Подставить в рецепт ссылку на страницу общей книги, где описан соус.", "ex": "Программа, которая это делает, называется <b>линковщик<\/b> (ld). gcc вызывает её сам.", "pro": "<p><b>linking<\/b>, <b>linker<\/b> (у тебя GNU ld). Ошибка «undefined reference to ...» значит, что линковщик не нашёл функцию. Различают <b>статическую<\/b> (static) и <b>динамическую<\/b> (dynamic) линковку.<\/p>"}, {"t": "do", "h": "Увидь, что printf у тебя нет", "task": "Соберём только объектный файл (без линковки) и посмотрим список имён внутри.", "cmd": "cd /tmp && cp ~/Documents/vpd/lab01/dev/c/main.c . && gcc -c main.c && nm main.o", "look": "Буквы <code>T<\/code> и <code>U<\/code> слева от имён.", "explain": "<p><code>T main<\/code> значит «код main здесь есть». <code>U printf<\/code> значит <b>U<\/b>ndefined: «я этим пользуюсь, но кода у меня нет». Эти дыры и закрывает линковка. Имена функций внутри файла называют <b>символами<\/b> (symbols), а nm показывает таблицу символов.<\/p>"}, {"t": "idea", "h": "Два способа подключить библиотеку", "body": "<p><b>Динамически<\/b> (по умолчанию): в программу записано только «мне нужна libc», а настоящую libc подключают при запуске. Файл маленький: твой c/main весит 16 КБ.<\/p><p><b>Статически<\/b> (<code>gcc -static<\/code>): код нужных функций копируется прямо в программу. Тот же код весит 907 КБ, зато работает на любом Linux.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> «бинарник слинкован динамически, зависит от glibc», «собери статически, чтобы не тащить зависимости». Посмотреть зависимости: <code>ldd c/main<\/code>.<\/p>"}, {"t": "word", "term": "Формат исполняемого файла", "node": "exeformat", "pt": "ELF · PE · Mach-O", "simple": "У каждой ОС своё правило, как устроен файл программы, плюс свои системные библиотеки.", "like": "Разные стандарты переплёта книги: книгу одного формата не вставить в чужую полку.", "ex": "Linux: ELF. Windows: PE (.exe). macOS: Mach-O. Команда <code>file c/main<\/code> скажет «ELF 64-bit ... x86-64».", "pro": "<p>Говорят «бинарник под конкретную <b>платформу<\/b>»: платформа это пара ОС + архитектура, например <b>linux/amd64<\/b>, <b>windows/amd64<\/b>, <b>darwin/arm64<\/b> (darwin это macOS).<\/p>"}, {"t": "predict", "q": "Можно ли отправить c/main другу с Windows и запустить?", "o": ["Да, это же машинный код x86, а у друга тоже x86", "Нет: другой формат файла и другие системные библиотеки", "Да, если переименовать в main.exe"], "a": 1, "reveal": "<p>Процессор тот же, но программе нужна ещё «упаковка» (формат файла) и библиотеки своей ОС. Поэтому компилируемые программы собирают <b>отдельно под каждую платформу<\/b>.<\/p>"}, {"t": "why", "q": "Объясни своими словами: что делает компилятор, и почему уже собранная программа работает без него, но не на любой ОС?", "model": "Компилятор заранее переводит весь исходный код в машинный код и сохраняет исполняемый файл. Процессор выполняет машинный код сам, поэтому компилятор после сборки не нужен. Но файл привязан к платформе: архитектуре процессора, формату файла ОС и её библиотекам."}, {"t": "pro", "simple": "Компилятор заранее перевёл мой код в программу из чисел и соединил её с общим готовым кодом; эта программа работает только на Linux с таким же процессором.", "terms": ["компиляция (AOT)", "исполняемый файл / бинарник", "линковка с libc", "платформа linux/amd64"], "model": "Это AOT-компиляция: gcc собрал нативный бинарник и динамически слинковал его с libc. Бинарник под платформу linux/amd64, на другой ОС или архитектуре не запустится."}, {"t": "sum", "items": ["Исходный код это текст; компилятор заранее переводит его в машинный код.", "gcc работает в 4 этапа: препроцессор, компиляция, ассемблирование, линковка.", "Библиотеки это общий готовый код; линковка связывает с ними программу.", "Скомпилированная программа работает без компилятора, но только на своей платформе."]}], "cards": [{"q": "Что делает компилятор?", "a": "Заранее (AOT) переводит весь исходный код в машинный код и сохраняет исполняемый файл."}, {"q": "Назови 4 этапа gcc и флаги остановки.", "a": "Препроцессор (-E), компиляция в ассемблер (-S), ассемблирование в .o (-c), линковка."}, {"q": "Что значит U printf в выводе nm?", "a": "Символ используется, но не определён в этом файле; его даст линковка из libc."}, {"q": "Статическая и динамическая линковка?", "a": "Статическая копирует код библиотеки внутрь (большой, самодостаточный); динамическая подключает .so при запуске (маленький, зависит от системы)."}, {"q": "Что такое платформа?", "a": "Пара ОС + архитектура (linux/amd64, windows/amd64, darwin/arm64); бинарник собирается под неё."}, {"q": "Почему c/main не запустится на Windows?", "a": "Другой формат файла (ELF против PE) и другие системные библиотеки."}]}, {"id": "t1l3", "title": "Интерпретатор: переводчик на лету", "min": 12, "steps": [{"t": "intro", "h": "Второй способ перевода", "body": "<p>Компилятор переводит книгу заранее. Но можно иначе: взять <b>синхронного переводчика<\/b>, который переводит по ходу. Так работают Python, Bash, JavaScript и Prolog.<\/p>"}, {"t": "word", "term": "Интерпретатор", "node": "interp", "pt": "interpreter · runtime", "simple": "Программа, которая читает твой исходный код и сразу его выполняет. Отдельного исполняемого файла не появляется.", "like": "Синхронный переводчик: ты говоришь фразу, он тут же её переводит. Без него собеседник тебя не поймёт.", "ex": "<code>python3 python/main.py<\/code>: здесь <code>python3<\/code> это интерпретатор, а <code>main.py<\/code> просто текст, который он читает.", "pro": "<p><b>interpreter<\/b>; программы для него часто называют <b>скриптами<\/b>. Сам Python, установленный в системе, называют <b>рантаймом<\/b> (runtime, среда выполнения). Стандартный интерпретатор Python называется <b>CPython<\/b>.<\/p><p>В разговоре: «интерпретируемый язык», «скрипт падает в рантайме».<\/p>"}, {"t": "idea", "h": "Интерпретатор это тоже обычная программа", "body": "<p>Интерпретатор Python сам написан на C и скомпилирован в машинный код. Внутри крутится цикл: прочитать следующую команду твоей программы → понять, что это → выполнить → следующая.<\/p><p>Похоже на цикл процессора из первого урока? Так и есть: интерпретатор делает то же самое, но программно. Поэтому он медленнее: на каждую твою команду приходится много его собственных инструкций.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> такой цикл называют <b>eval loop<\/b> или «цикл диспетчеризации» (dispatch loop); лишняя работа на каждую команду это <b>overhead<\/b> (накладные расходы).<\/p>"}, {"t": "predict", "q": "Ты отправил другу только файл main.py. Что ему нужно, чтобы программа запустилась?", "o": ["Ничего, это же программа", "Установленный интерпретатор Python", "Компилятор gcc"], "a": 1, "reveal": "<p>Нужен интерпретатор. Без него main.py это просто текст. Зато тот же main.py запустится на Linux, Windows и Mac, лишь бы там был Python. Исходник переносим.<\/p>"}, {"t": "predict", "q": "В Python-скрипте 13 строк. В 13-й опечатка в имени переменной: <code>print(student_numbr)<\/code>. Что будет?", "o": ["Python сразу скажет об ошибке, ничего не выполнив", "Первые 12 строк выполнятся, на 13-й программа упадёт", "Python сам исправит опечатку"], "a": 1, "reveal": "<p>Python узнаёт, что такой переменной нет, только когда доходит до этой строки. Первые строки успеют выполниться. В C такую ошибку компилятор нашёл бы до запуска.<\/p><p>Но если ошибка <b>в синтаксисе<\/b> (забыта скобка), Python скажет о ней сразу. Почему, узнаешь в следующем уроке.<\/p>"}, {"t": "do", "h": "Проверь сам", "task": "Сделай скрипт с опечаткой в последней строке и запусти.", "cmd": "printf 'print(\"раз\")\\nprint(\"два\")\\nprint(nomer)\\n' > /tmp/t.py && python3 /tmp/t.py", "look": "Сначала «раз» и «два», потом ошибка NameError.", "explain": "<p>Две строки выполнились, третья упала с <code>NameError<\/code>. Такие ошибки называют <b>runtime error<\/b> (ошибка времени выполнения), в отличие от <b>compile-time error<\/b> (ошибки, найденной до запуска).<\/p>"}, {"t": "idea", "h": "Компиляция и интерпретация: сравнение", "body": "<div class=\"tbl\"><table><tr><th><\/th><th>Компиляция (C)<\/th><th>Интерпретация (Python)<\/th><\/tr><tr><td>Когда перевод<\/td><td>заранее, один раз<\/td><td>при каждом запуске<\/td><\/tr><tr><td>Что нужно для запуска<\/td><td>только сам файл<\/td><td>интерпретатор<\/td><\/tr><tr><td>Переносимость<\/td><td>собирать под каждую платформу<\/td><td>тот же файл везде, где есть интерпретатор<\/td><\/tr><tr><td>Скорость<\/td><td>быстро<\/td><td>медленнее<\/td><\/tr><tr><td>Ошибки в именах и типах<\/td><td>часто до запуска (compile-time)<\/td><td>когда дошло до строки (runtime)<\/td><\/tr><tr><td>Начать писать<\/td><td>сложнее<\/td><td>проще и быстрее<\/td><\/tr><\/table><\/div><p>У каждого способа свои плюсы. Поэтому существуют оба.<\/p>"}, {"t": "check", "q": "Какие языки из лабы запускаются интерпретатором?", "o": ["C, Rust", "Python, Bash, JavaScript, Prolog", "Java, C#", "Go, ассемблер"], "a": 1, "why": "python3, bash, node и swipl это интерпретаторы. У JavaScript есть ещё хитрость (JIT), про неё урок 5."}, {"t": "why", "q": "Объясни разницу между компилятором и интерпретатором через перевод книги и синхронного переводчика. Добавь по одному плюсу каждого.", "model": "Компилятор как переводчик книги: переводит всё заранее, получается готовый файл, который работает сам и быстро, но только на своей платформе. Интерпретатор как синхронный переводчик: читает и выполняет код по ходу; нужен установленный интерпретатор, зато тот же исходник работает везде, и писать проще. Ошибки в интерпретируемом коде часто видны только при выполнении."}, {"t": "pro", "simple": "Для запуска моего скрипта нужен установленный Python; ошибка в имени переменной вылезла, только когда программа дошла до этой строки.", "terms": ["интерпретатор / рантайм", "скрипт", "runtime error", "compile-time"], "model": "Скрипт выполняется интерпретатором, поэтому в системе нужен рантайм Python (CPython). NameError это runtime error: в интерпретируемом языке он не ловится на compile-time, а падает, когда выполнение доходит до строки."}, {"t": "sum", "items": ["Интерпретатор читает исходник и выполняет его сразу, без исполняемого файла.", "Сам интерпретатор это обычная скомпилированная программа с циклом «прочитай команду, выполни».", "Плюсы: переносимость исходника, простота. Минусы: медленнее, нужен рантайм, ошибки всплывают при выполнении.", "В лабе так работают Python, Bash, JavaScript, Prolog."]}], "cards": [{"q": "Что такое интерпретатор?", "a": "Программа, которая читает исходный код и сразу выполняет его, без исполняемого файла."}, {"q": "Компилятор против интерпретатора (аналогия)?", "a": "Компилятор как переводчик книги (заранее); интерпретатор как синхронный переводчик (по ходу, каждый раз)."}, {"q": "Почему интерпретатор медленнее?", "a": "Overhead: на каждую команду программы он выполняет много своих инструкций в цикле диспетчеризации."}, {"q": "Runtime error против compile-time error?", "a": "Runtime: ошибка найдена при выполнении (NameError в Python). Compile-time: найдена компилятором до запуска."}, {"q": "Что нужно, чтобы запустить main.py у друга?", "a": "Установленный рантайм Python; сам файл переносим между ОС."}]}, {"id": "t1l4", "title": "Байт-код и виртуальная машина", "min": 15, "steps": [{"t": "intro", "h": "Взять лучшее от обоих", "body": "<p>Компилированный код быстрый, но привязан к платформе. Интерпретация переносима, но медленная, и ошибки ловятся поздно.<\/p><p>Создатели Java придумали третий путь, посередине. Его используют Java, C#, F#, и даже Python внутри себя.<\/p>"}, {"t": "word", "term": "Виртуальная машина (VM)", "node": "vm", "pt": "VM · JVM · CLR", "simple": "Программа, которая притворяется процессором. У неё свой набор инструкций, и она их выполняет.", "like": "Эмулятор игровой приставки на компьютере: компьютер притворяется приставкой и запускает её игры.", "ex": "<b>JVM<\/b> (Java Virtual Machine) для Java, <b>.NET runtime<\/b> для C# и F#. Команда <code>java<\/code> запускает JVM.", "pro": "<p><b>virtual machine<\/b>, <b>JVM<\/b>; у .NET виртуальная машина называется <b>CLR<\/b> (Common Language Runtime). Говорят «код крутится на JVM», «нужен установленный рантайм .NET».<\/p>"}, {"t": "word", "term": "Байт-код", "node": "bytecode", "pt": "bytecode · IL", "simple": "Машинный код для виртуальной машины, а не для настоящего процессора. «Байт», потому что инструкции обычно по байту.", "like": "Рецепт на «универсальном кухонном языке», который понимает любой повар, прошедший специальные курсы (VM).", "ex": "<code>Main.class<\/code> после <code>javac Main.java<\/code> содержит байт-код JVM.", "pro": "<p><b>bytecode<\/b>; в .NET его называют <b>IL<\/b> или <b>CIL<\/b> (Common Intermediate Language). Общее название таких языков <b>промежуточное представление<\/b> (intermediate representation, IR).<\/p>"}, {"t": "idea", "h": "Как это работает в Java", "body": "<div class=\"flow\"><span class=\"s\">Main.java<small>исходник<\/small><\/span><span class=\"a\">→ javac →<\/span><span class=\"s\">Main.class<small>байт-код<\/small><\/span><span class=\"a\">→ java →<\/span><span class=\"s\">JVM<small>выполняет<\/small><\/span><\/div><p><b>javac<\/b> это компилятор, но не в машинный код, а в байт-код. Потом <b>java<\/b> запускает виртуальную машину, и она выполняет байт-код.<\/p><p>Главный выигрыш: <b>один и тот же Main.class<\/b> работает на Linux, Windows и Mac. JVM для каждой ОС своя, а байт-код общий.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> девиз Java «write once, run anywhere» (WORA): «напиши один раз, запускай везде».<\/p>"}, {"t": "predict", "q": "Ты отправил Main.class (не .java!) другу с Windows. Запустится?", "o": ["Да, если у него установлена Java", "Нет, нужно пересобирать под Windows", "Нет, .class работает только на Linux"], "a": 0, "reveal": "<p>Запустится: байт-код не привязан к платформе. Сравни с c/main из урока 2: тот на Windows не работал.<\/p>"}, {"t": "word", "term": "Стек (стопка)", "node": "stack", "pt": "stack · push/pop", "simple": "Способ хранить значения стопкой: кладёшь сверху, берёшь только сверху.", "like": "Стопка тарелок.", "ex": "JVM считает через стопку: «положи 304», «положи ⟦N⟧», «умножь», то есть сними две верхние тарелки, перемножь, положи результат.", "pro": "<p><b>stack<\/b>; положить это <b>push<\/b>, снять это <b>pop<\/b>. JVM и CPython это <b>стековые машины<\/b> (stack machine). Настоящий процессор x86 в основном <b>регистровая машина<\/b>, но у него тоже есть стек (вспомни push rbp).<\/p>"}, {"t": "do", "h": "Загляни в байт-код Java", "task": "Покажем инструкции JVM внутри твоего Main.class.", "cmd": "cd ~/Documents/vpd/lab01/dev/java && javac Main.java && javap -c Main | head -30", "look": "Найди <code>⟦JVM_PUSHN⟧<\/code>, <code>sipush 304<\/code>, <code>imul<\/code>.", "explain": "<p><code>⟦JVM_PUSHN⟧<\/code>: положи ⟦N⟧. <code>sipush 304<\/code>: положи 304. <code>imul<\/code>: сними два верхних, перемножь (i значит int), положи результат. <code>istore<\/code>: убери в переменную. Это твоё <code>control_value = 304 * ⟦N⟧<\/code> на языке JVM. <code>javap -c<\/code> это дизассемблер байт-кода.<\/p>"}, {"t": "do", "h": "Сюрприз: Python тоже делает байт-код", "task": "Помнишь, почему синтаксическую ошибку Python находит сразу? Посмотри, что он делает с файлом перед выполнением.", "cmd": "cd ~/Documents/vpd/lab01/dev && python3 -m dis python/main.py | head -25", "look": "Строки <code>LOAD_CONST<\/code>, <code>STORE_NAME<\/code>, <code>BINARY_OP (*)<\/code>.", "explain": "<p>Python сначала <b>переводит весь файл в байт-код<\/b>, а потом выполняет его своим циклом. Синтаксическую ошибку он находит на этапе перевода, а «нет такой переменной» только при выполнении. Байт-код импортируемых модулей Python кэширует в <code>__pycache__/*.pyc<\/code>, поэтому эта папка в .gitignore.<\/p>"}, {"t": "idea", "h": "Байт-код и машинный код: в чём разница", "body": "<div class=\"tbl\"><table><tr><th><\/th><th>Машинный код<\/th><th>Байт-код<\/th><\/tr><tr><td>Кто выполняет<\/td><td>настоящий процессор<\/td><td>виртуальная машина<\/td><\/tr><tr><td>Где работает<\/td><td>только на своей платформе<\/td><td>везде, где есть VM<\/td><\/tr><tr><td>Безопасность<\/td><td>процессор выполнит что угодно<\/td><td>VM проверяет байт-код перед запуском (verifier)<\/td><\/tr><tr><td>Скорость<\/td><td>максимальная<\/td><td>медленнее, если выполнять по одной инструкции<\/td><\/tr><\/table><\/div><p>Последняя строка это проблема: VM, выполняющая байт-код по одной инструкции, работает как интерпретатор. Как это решили, в следующем уроке.<\/p>"}, {"t": "check", "q": "Что получается у C# и F# после dotnet build?", "o": ["Исполняемый файл с машинным кодом", "Файл .dll с байт-кодом (CIL) для .NET", "JavaScript", "Ничего, они интерпретируются"], "a": 1, "why": ".NET устроен как Java: компилятор делает CIL, а CLR его выполняет. Отсюда папки bin/ и obj/ в .gitignore."}, {"t": "why", "q": "Зачем Java компилирует в байт-код, а не сразу в машинный код? Главный плюс и чем за него платят.", "model": "Главный плюс: переносимость. Байт-код не привязан к платформе, поэтому один .class работает везде, где установлена JVM. Ещё VM проверяет байт-код, это безопаснее. Платят тем, что нужна установленная JVM и что выполнение байт-кода медленнее машинного кода, если нет JIT."}, {"t": "pro", "simple": "Java переводит программу не в команды процессора, а в команды воображаемой машины; поэтому один и тот же файл запускается на любой системе, где установлена Java.", "terms": ["байт-код", "JVM", "кроссплатформенный", "write once, run anywhere"], "model": "javac компилирует исходники в байт-код, который исполняет JVM. Поэтому .class кроссплатформенный: write once, run anywhere, нужен только рантайм Java на целевой системе."}, {"t": "sum", "items": ["Виртуальная машина это программа, которая притворяется процессором.", "Байт-код это машинный код для VM: javac делает .class, dotnet делает .dll (CIL).", "Главный плюс байт-кода: один файл работает на любой платформе с VM.", "JVM считает через стек: bipush, sipush, imul.", "Python тоже переводит код в байт-код перед выполнением."]}], "cards": [{"q": "Что такое виртуальная машина?", "a": "Программа, которая притворяется процессором и выполняет байт-код (JVM для Java, CLR для .NET)."}, {"q": "Что такое байт-код?", "a": "Машинный код для VM, а не для процессора; промежуточное представление (IR). Пример: Main.class, CIL в .dll."}, {"q": "Главный плюс байт-кода?", "a": "Кроссплатформенность: write once, run anywhere."}, {"q": "Что делают javac и java?", "a": "javac компилирует .java в байт-код .class; java запускает JVM, которая его выполняет."}, {"q": "Что значат bipush, sipush, imul?", "a": "Положить число на стек (маленькое/побольше), перемножить два верхних int."}, {"q": "Почему синтаксическую ошибку Python видит сразу?", "a": "Перед выполнением он компилирует весь файл в байт-код; на этом этапе она и находится."}]}, {"id": "t1l5", "title": "JIT и вся картина целиком", "min": 15, "steps": [{"t": "intro", "h": "Последний кусочек", "body": "<p>Осталась проблема: VM, выполняющая байт-код по одной инструкции, медленная. Но Java и JavaScript работают быстро. Как?<\/p><p>После этого урока у тебя будет полная картина всех 13 языков лабы.<\/p>"}, {"t": "word", "term": "JIT-компилятор", "node": "jit", "pt": "JIT · hot path", "simple": "Компилятор, который работает <b>во время<\/b> выполнения программы. Он замечает куски кода, которые выполняются очень часто, и переводит их в настоящий машинный код.", "like": "Синхронный переводчик заметил, что ты сотый раз говоришь одну и ту же фразу, и выучил её перевод наизусть.", "ex": "JIT есть в JVM (Java), в .NET (C#, F#) и в движке V8 (Node.js).", "pro": "<p><b>JIT<\/b> (just-in-time) против <b>AOT<\/b> (ahead-of-time). Часто выполняемый код называют <b>горячим<\/b> (hot path, hot loop). Время, пока JIT ещё не разогнался, называют <b>прогревом<\/b> (warm-up).<\/p>"}, {"t": "idea", "h": "Как JIT решает, что переводить", "body": "<p>Сначала VM просто выполняет байт-код и <b>считает<\/b>, что сколько раз выполняется. Горячий кусок JIT переводит в машинный код и дальше выполняет уже его.<\/p><p>Бонус: JIT видит, какие данные реально приходят. Если в цикле всегда целые числа, он делает машинный код специально для них, без лишних проверок.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> сбор статистики это <b>профилирование<\/b> (profiling); если предположение JIT нарушилось, происходит <b>деоптимизация<\/b> (deopt), откат к интерпретации.<\/p>"}, {"t": "predict", "q": "Одна и та же задача (сложить 200 миллионов чисел) на C выполняется за 0,15 секунды. Сколько займут Node и Python?", "o": ["Оба около 0,2 с", "Node около 0,2 с, Python около 12 с", "Оба около 12 с", "Python быстрее Node"], "a": 1, "reveal": "<p>Реальный замер на твоём компьютере: C 0,15 с, Node 0,22 с, Python около 12 с. Node почти догнал C благодаря JIT. CPython в основном интерпретирует байт-код и проверяет типы на каждой операции.<\/p>"}, {"t": "do", "h": "Выключи JIT и посмотри", "task": "У Node есть флаг, который выключает JIT.", "cmd": "printf 'let s=0;for(let i=0;i<20000000;i++)s+=i%%7;console.log(s)\\n' > /tmp/l.js && time node /tmp/l.js && time node --jitless /tmp/l.js", "look": "Строки <code>real<\/code>: время с JIT и без.", "explain": "<p>Без JIT в несколько раз медленнее (у меня 0,04 с против 0,25 с). Скорость Node даёт именно JIT. Сравнивать скорость программ на одинаковой задаче называют <b>бенчмарком<\/b> (benchmark).<\/p>"}, {"t": "idea", "h": "Медленный не значит плохой", "body": "<p>Python медленнее на вычислениях, но для вывода трёх строк это неважно. Зато он запускается за доли секунды, и на нём быстрее писать. Java быстрая после прогрева, но JVM занимает память и время на старт.<\/p><p>Ядро ОС пишут на C (полный контроль, никакой VM), банковские серверы часто на Java (переносимость, надёжность), скрипты автоматизации на Python и Bash (быстро написать).<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> это <b>трейд-офф<\/b> (trade-off, компромисс): «скорость исполнения против скорости разработки», «время старта против пиковой производительности».<\/p>"}, {"t": "word", "term": "Транспиляция", "node": "transpile", "pt": "transpiler · tsc", "simple": "Перевод из одного языка программирования в другой, а не в машинный код.", "like": "Перевод книги с английского на испанский, а не на «язык повара».", "ex": "<code>tsc<\/code> переводит TypeScript в JavaScript (<code>dist/main.js<\/code>), а дальше его выполняет Node как обычный JS.", "pro": "<p><b>transpiler<\/b> (source-to-source compiler). Говорят «TS транспилируется в JS», «типы стираются при сборке» (type erasure).<\/p>"}, {"t": "idea", "h": "Вся картина: 13 языков лабы", "body": "<div class=\"tbl\"><table><tr><th>Способ<\/th><th>Языки<\/th><th>Что получается<\/th><\/tr><tr><td>AOT-компиляция в машинный код<\/td><td>C, C++, Rust, Go, ассемблер<\/td><td>нативный бинарник (у Go временный при go run)<\/td><\/tr><tr><td>Байт-код + VM + JIT<\/td><td>Java, C#, F#<\/td><td>.class / .dll<\/td><\/tr><tr><td>Интерпретация (внутри байт-код)<\/td><td>Python, Bash, Prolog<\/td><td>ничего, выполняется сразу<\/td><\/tr><tr><td>Байт-код + JIT в V8<\/td><td>JavaScript<\/td><td>ничего, выполняется сразу<\/td><\/tr><tr><td>Транспиляция<\/td><td>TypeScript<\/td><td>JavaScript в dist/<\/td><\/tr><\/table><\/div><p>Эту таблицу просит задание в отчёте («тип результата»). Теперь ты можешь объяснить каждую строку.<\/p>"}, {"t": "check", "q": "Что на самом деле делает <code>go run go/main.go<\/code>?", "o": ["Интерпретирует построчно", "Компилирует во временный исполняемый файл и сразу запускает", "Делает байт-код", "Транспилирует в C"], "a": 1, "why": "Go компилируемый. go run просто прячет промежуточный файл; go build оставил бы его рядом."}, {"t": "order", "q": "Расставь по порядку, что происходит, когда ты запускаешь <code>java Main<\/code> на большом цикле:", "items": ["javac заранее превратил Main.java в байт-код Main.class", "JVM загружает Main.class и проверяет байт-код", "JVM выполняет байт-код по одной инструкции и считает, что горячее", "JIT переводит горячий цикл в машинный код", "Процессор выполняет этот машинный код напрямую"], "why": "<p>Так байт-код соединяет лучшее от двух миров: переносимый файл и почти нативную скорость после прогрева.<\/p>"}, {"t": "story", "h": "Картина целиком", "body": "<p>Теперь всё вместе, одной историей, на языке программиста.<\/p><p>Процессор (CPU) умеет выполнять только <b>машинный код<\/b>: инструкции своей архитектуры (ISA), например x86-64. Человек пишет <b>исходный код<\/b>, и его надо перевести. Путей три.<\/p><p><b>AOT-компиляция<\/b>: компилятор (gcc, rustc) заранее переводит исходники в нативный бинарник; линковщик связывает его с библиотеками (libc). Получается быстрый исполняемый файл под одну платформу. Так C, C++, Rust, Go и ассемблер.<\/p><p><b>Интерпретация<\/b>: рантайм (CPython, bash, swipl) читает скрипт при каждом запуске и выполняет его в своём цикле. Переносимо и просто, но с overhead, и ошибки всплывают в рантайме.<\/p><p><b>Байт-код и VM<\/b>: компилятор (javac, dotnet) делает переносимый байт-код, VM (JVM, CLR) его выполняет, а JIT компилирует горячие места в машинный код. Write once, run anywhere плюс почти нативная скорость после прогрева. Так Java, C#, F#; по сути так же работает V8 для JavaScript. TypeScript сначала транспилируется в JavaScript.<\/p><p>Все пути заканчиваются одинаково: процессор выполняет машинный код. Разница только в том, <b>кто и когда<\/b> его делает. В этом и смысл первой части лабы.<\/p>"}, {"t": "why", "q": "Главный вопрос первой части лабы. Объясни разницу между компиляцией, интерпретацией и байт-кодом на примерах C, Python и Java. Для каждого назови плюс и минус.", "model": "C компилируется gcc заранее в машинный код, получается исполняемый файл: быстрый и работает без компилятора, но привязан к платформе. Python выполняется интерпретатором: он переводит код в свой байт-код и сразу выполняет его, отдельного файла нет; переносимо и просто, но медленнее, и ошибки видны только при выполнении. Java компилируется javac в байт-код .class, который выполняет JVM: один файл работает везде, где есть JVM, а JIT переводит горячий код в машинный, поэтому быстро; минус в том, что нужна JVM и время на запуск."}, {"t": "pro", "simple": "Node быстрый, потому что часто повторяющийся код он на ходу переводит в команды процессора, а TypeScript сначала переводится в JavaScript.", "terms": ["V8", "JIT", "горячий цикл (hot loop)", "транспиляция"], "model": "Движок V8 в Node JIT-компилирует hot loop в нативный машинный код, поэтому после прогрева он почти как C. TypeScript транспилируется tsc в JavaScript, типы при этом стираются."}, {"t": "sum", "items": ["JIT переводит горячий байт-код в машинный код прямо во время работы.", "Поэтому Java, C# и JavaScript быстрые, а обычный Python медленнее на вычислениях.", "Транспиляция это перевод в другой язык: TypeScript → JavaScript.", "Нет лучшего способа: это trade-off под задачу.", "Ты можешь объяснить тип результата у всех 13 языков лабы."]}], "cards": [{"q": "Что такое JIT?", "a": "Компилятор, который во время работы переводит горячий байт-код в машинный код (just-in-time)."}, {"q": "JIT против AOT?", "a": "AOT компилирует заранее (gcc); JIT во время выполнения, с учётом реальных данных, но нужен прогрев."}, {"q": "Почему Node быстрее Python на циклах?", "a": "V8 JIT-компилирует горячий цикл; CPython в основном интерпретирует байт-код."}, {"q": "Что такое транспиляция?", "a": "Перевод из одного языка в другой: tsc переводит TypeScript в JavaScript, типы стираются."}, {"q": "Что делает go run?", "a": "Компилирует во временный исполняемый файл и сразу запускает."}, {"q": "Тип результата: C, Java, Python, TypeScript?", "a": "C: нативный бинарник; Java: байт-код .class; Python: ничего (интерпретация); TS: JavaScript в dist/."}]}, {"id": "t1l6", "title": "Практика: разбери сборку сам", "min": 15, "steps": [{"t": "intro", "h": "Теперь сам, без готовых команд", "body": "<p>Три задания на темы урока. Команд нет, только цель. Можно пользоваться <code>--help<\/code> и <code>man<\/code>. Делай в папке <code>/tmp/p1<\/code>, чтобы не трогать лабу.<\/p>"}, {"t": "task", "h": "Останови gcc на каждом этапе", "goal": "Скопируй <code>c/main.c<\/code> из лабы в <code>/tmp/p1<\/code>. Получи по отдельности: текст после препроцессора (в файл), ассемблерный файл <code>.s<\/code>, объектный файл <code>.o<\/code> и готовую программу. Найди в объектном файле функции, которых в нём нет.", "hint": "Флаги gcc для остановки: -E, -S, -c. Список имён в объектном файле показывает nm.", "solution": "<pre>mkdir -p /tmp/p1 &amp;&amp; cd /tmp/p1 &amp;&amp; cp ~/Documents/vpd/lab01/dev/c/main.c .\ngcc -E main.c &gt; main.i\ngcc -S main.c\ngcc -c main.c\ngcc main.o -o main &amp;&amp; ./main\nnm main.o | grep ' U '<\/pre><p>Проверь: есть <code>main.i<\/code>, <code>main.s<\/code>, <code>main.o<\/code>, <code>main<\/code>; в nm с буквой U стоят printf, snprintf, __stack_chk_fail.<\/p>"}, {"t": "task", "h": "Докажи, что байт-код переносим, а бинарник нет", "goal": "Определи командой, что за файлы <code>c/main<\/code>, <code>java/Main.class<\/code> и <code>typescript/dist/main.js<\/code> в лабе. По выводу объясни себе, какой из них запустится на Windows.", "hint": "Есть команда, которая определяет тип файла по содержимому.", "solution": "<pre>cd ~/Documents/vpd/lab01/dev &amp;&amp; file c/main java/Main.class typescript/dist/main.js<\/pre><p>c/main это ELF x86-64 под Linux (на Windows нет). Main.class это байт-код Java (запустится там, где есть Java). main.js это текст JavaScript (запустится там, где есть Node).<\/p>"}, {"t": "task", "h": "Покажи эффект JIT цифрами", "goal": "Напиши одинаковый цикл на Python и JavaScript (сумма i % 7 для 20 миллионов i) и замерь время. Потом замерь JS с выключенным JIT.", "hint": "Время команды показывает time. У node есть флаг, выключающий JIT (смотри node --help | grep jit).", "solution": "<pre>printf 's=0\\nfor i in range(20000000): s+=i%%7\\nprint(s)\\n' &gt; /tmp/p1/l.py\nprintf 'let s=0;for(let i=0;i&lt;20000000;i++)s+=i%%7;console.log(s)\\n' &gt; /tmp/p1/l.js\ntime python3 /tmp/p1/l.py\ntime node /tmp/p1/l.js\ntime node --jitless /tmp/p1/l.js<\/pre><p>Ожидаемо: Python около 1 с, Node сотые доли, без JIT в несколько раз медленнее.<\/p>"}, {"t": "sum", "items": ["Ты сам прошёл конвейер gcc и нашёл неопределённые символы.", "Ты сам доказал разницу нативного бинарника и байт-кода.", "Ты сам измерил эффект JIT."]}], "cards": [{"q": "Как остановить gcc после препроцессора, компиляции, ассемблирования?", "a": "-E, -S, -c."}, {"q": "Как узнать тип файла?", "a": "file путь: например ELF 64-bit или compiled Java class data."}], "opt": true}], "defense": true}, {"id": "t2", "title": "Терминал: как ты командуешь компьютером", "role": "Как из одной строки в терминале получается запущенная программа: оболочка, команды, пути, процессы, pipe.", "link": "программу из темы 1 ты запускаешь командой в терминале", "map": {"lead": "Сверху ты, снизу работающие программы. Оболочка посередине переводит твою строку в запуск процессов и соединяет их.", "rows": [{"label": "Ты и экран", "nodes": ["terminal"], "arrow": "набираешь строку"}, {"label": "Посредник", "nodes": ["shell", "builtin"], "arrow": "разбирает строку на части"}, {"label": "Что ты пишешь", "nodes": ["command", "cwd", "path", "PATH"], "arrow": "находит программу и запускает"}, {"label": "Что запускается", "nodes": ["process", "exitcode", "chain"], "arrow": "программа читает вход и пишет выход"}, {"label": "Куда идут данные", "nodes": ["streams", "redirect", "pipe", "subst"], "arrow": "а правишь файлы прямо в терминале"}, {"label": "Редактор в терминале", "nodes": ["vimmodes"], "arrow": ""}]}, "lessons": [{"id": "t2l1", "title": "Терминал, оболочка, команда", "min": 12, "steps": [{"t": "intro", "h": "Окно, в котором ты работал всю лабу", "body": "<p>Всю лабу ты делал в чёрном окне с текстом. Разберёмся, что это за окно, кто там «отвечает» и что происходит, когда ты нажимаешь Enter.<\/p>"}, {"t": "word", "term": "Терминал", "node": "terminal", "pt": "terminal emulator · kitty", "simple": "Окно, которое показывает текст и передаёт программе нажатия клавиш. Сам он ничего не выполняет.", "like": "Телефонная трубка: через неё ты разговариваешь, но думает не трубка, а тот, кто на другом конце.", "ex": "У тебя терминал kitty. На Windows это Windows Terminal, на Mac Terminal или iTerm2.", "pro": "<p>Правильно: <b>эмулятор терминала<\/b> (terminal emulator); исторически терминал был отдельным устройством с клавиатурой и экраном. Ещё говорят <b>консоль<\/b> и <b>CLI<\/b> (command-line interface), в противоположность <b>GUI<\/b> (графическому интерфейсу).<\/p>"}, {"t": "word", "term": "Оболочка", "node": "shell", "pt": "shell · bash/zsh/fish", "simple": "Программа, которая живёт в терминале: читает строку, которую ты ввёл, и запускает нужные программы.", "like": "Тот, кто на другом конце трубки: секретарь, который слушает твою просьбу и зовёт нужного специалиста.", "ex": "У тебя оболочка fish, скрипты лабы написаны под bash, на Mac по умолчанию zsh. Строка <code>~/Documents/vpd/lab01/dev $<\/code> это <b>приглашение<\/b>: оболочка ждёт команду.", "pro": "<p><b>shell<\/b>; приглашение называется <b>prompt<\/b>. Режим «прочитал, выполнил, напечатал, жду дальше» называют <b>REPL<\/b> (read-eval-print loop). Скрипт для оболочки называют <b>shell-скриптом<\/b>.<\/p>"}, {"t": "word", "term": "Команда, аргументы и флаги", "node": "command", "pt": "argv · flags", "simple": "Команда это имя программы и слова после него. Слова после имени называются аргументами. Аргументы с минусом в начале называют флагами (опциями).", "like": "Просьба секретарю: «позови <i>повара<\/i>, скажи ему <i>омлет<\/i>, <i>без соли<\/i>». Повар это программа, остальное аргументы.", "ex": "<code>gcc -Wall c/main.c -o c/main<\/code>: программа <code>gcc<\/code>, аргументы <code>-Wall<\/code>, <code>c/main.c<\/code>, <code>-o<\/code>, <code>c/main<\/code>. Короткие флаги с одним минусом (<code>-o<\/code>), длинные с двумя (<code>--oneline<\/code>).", "pro": "<p>Список аргументов программа получает как массив строк: в C это <b>argv<\/b> (<code>int main(int argc, char *argv[])<\/code>), в Java <code>String[] args<\/code>. Флаги ещё называют <b>options<\/b>, <b>switches<\/b>. Говорят «передай флаг -o», «команда принимает путь аргументом».<\/p>"}, {"t": "predict", "q": "Кто разбивает строку <code>gcc -Wall c/main.c -o c/main<\/code> на отдельные слова?", "o": ["Сам gcc", "Оболочка, до запуска gcc", "Терминал kitty", "Процессор"], "a": 1, "reveal": "<p>Оболочка. Она режет строку по пробелам и передаёт программе уже готовый список. Поэтому в Bash <code>\"$name\"<\/code> в кавычках остаётся одним аргументом, а без кавычек имя из трёх слов станет тремя аргументами.<\/p>"}, {"t": "word", "term": "Процесс", "node": "process", "pt": "process · PID", "simple": "Запущенная программа. Программа это файл на диске, а процесс это она же, но работающая: со своей памятью и номером.", "like": "Рецепт это программа, а готовка по нему прямо сейчас это процесс. По одному рецепту можно готовить на трёх плитах сразу.", "ex": "Запусти <code>python3<\/code> в двух терминалах, и будет один файл, но два процесса.", "pro": "<p><b>process<\/b>; номер процесса <b>PID<\/b>. Посмотреть процессы: <code>ps<\/code>, <code>htop<\/code>. Завершить: <code>kill PID<\/code>. Говорят «процесс упал», «процесс висит», «убей процесс».<\/p>"}, {"t": "idea", "h": "Что происходит, когда ты нажимаешь Enter", "body": "<div class=\"flow\"><span class=\"s\">ты печатаешь<small>в терминале<\/small><\/span><span class=\"a\">→<\/span><span class=\"s\">оболочка<small>разбирает строку<\/small><\/span><span class=\"a\">→<\/span><span class=\"s\">находит программу<\/span><span class=\"a\">→<\/span><span class=\"s\">запускает процесс<\/span><span class=\"a\">→<\/span><span class=\"s\">ждёт конца<\/span><\/div><p>Оболочка сама почти ничего не умеет: ни компилировать, ни считать слова. Её работа в том, чтобы <b>запускать другие программы<\/b> и соединять их.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> в Linux запуск это два системных вызова, <b>fork<\/b> (сделать копию процесса) и <b>exec<\/b> (заменить копию нужной программой). Между ними оболочка успевает настроить, куда пойдёт вывод. Отсюда работают <code>&gt;<\/code> и <code>|<\/code>, про них урок 4.<\/p>"}, {"t": "do", "h": "Оглядись", "task": "Открой терминал и выполни по очереди.", "cmd": "pwd; ls -la ~/Documents/vpd/lab01/dev; ps", "look": "Где ты, какие файлы в папке лабы (включая скрытые), какие процессы запущены в этом терминале.", "explain": "<p><code>pwd<\/code> (print working directory) показывает, где ты. <code>ls -la<\/code> показывает файлы подробно (<code>-l<\/code>) и вместе со скрытыми (<code>-a<\/code>), например <code>.git<\/code> и <code>.gitignore<\/code>. <code>ps<\/code> показывает процессы: там будет твоя оболочка и сам ps.<\/p>"}, {"t": "check", "q": "Ты набрал <code>ls -la<\/code>. Что здесь <code>-la<\/code>?", "o": ["Имя программы", "Аргумент-флаг, который программа ls разбирает сама", "Команда оболочки", "Путь к папке"], "a": 1, "why": "Флаги это просто строки-аргументы. Каждая программа сама решает, что они значат, поэтому у разных программ разные флаги."}, {"t": "why", "q": "Объясни разницу между терминалом, оболочкой и процессом.", "model": "Терминал это окно, которое показывает текст и передаёт нажатия клавиш. Оболочка это программа внутри терминала: она читает введённую строку, разбивает её на имя программы и аргументы и запускает программу. Запущенная программа это процесс, у него своя память и номер PID."}, {"t": "pro", "simple": "Я набрал строку в окне, программа-посредник разбила её на слова и запустила gcc, передав ему эти слова.", "terms": ["эмулятор терминала", "shell", "аргументы (argv)", "процесс"], "model": "Я ввёл команду в эмуляторе терминала; shell распарсил строку и запустил процесс gcc, передав ему аргументы в argv."}, {"t": "sum", "items": ["Терминал показывает текст, оболочка (shell) выполняет команды.", "Команда это программа плюс аргументы; флаги это аргументы с минусом.", "Оболочка сама разбивает строку на слова и запускает процесс.", "Процесс это запущенная программа со своим PID."]}], "cards": [{"q": "Чем терминал отличается от оболочки?", "a": "Терминал это окно для текста; оболочка (shell: bash, zsh, fish) читает команды и запускает программы."}, {"q": "Что такое аргументы и флаги?", "a": "Слова после имени программы, передаются массивом argv; флаги это аргументы с минусом (-o, --oneline)."}, {"q": "Кто разбивает строку команды на слова?", "a": "Оболочка, до запуска программы."}, {"q": "Программа и процесс: в чём разница?", "a": "Программа это файл; процесс это запущенный экземпляр со своей памятью и PID."}, {"q": "Что такое prompt?", "a": "Приглашение оболочки (например ~/dev $): она ждёт команду."}]}, {"id": "t2l2", "title": "Пути, PATH и ./", "min": 12, "steps": [{"t": "intro", "h": "Где лежат файлы и где оболочка ищет программы", "body": "<p>Почему свою программу ты запускал как <code>./c/main<\/code>, а <code>gcc<\/code> просто по имени? Ответ в двух понятиях: пути и PATH.<\/p>"}, {"t": "word", "term": "Текущая папка", "node": "cwd", "pt": "working directory · pwd", "simple": "У оболочки всегда есть папка, «в которой ты находишься». Все короткие пути считаются от неё.", "like": "Комната, в которой ты стоишь: «возьми книгу со стола» значит со стола в этой комнате.", "ex": "<code>cd ~/Documents/vpd/lab01/dev<\/code> переходит в папку, <code>pwd<\/code> показывает текущую.", "pro": "<p><b>current working directory<\/b> (cwd). Это свойство процесса: у каждого процесса своя текущая папка.<\/p>"}, {"t": "word", "term": "Путь", "node": "path", "pt": "absolute / relative path", "simple": "Адрес файла. Абсолютный путь начинается от корня <code>/<\/code>, относительный считается от текущей папки.", "like": "Абсолютный: полный почтовый адрес. Относительный: «вторая дверь направо» от того места, где стоишь.", "ex": "<code>/home/user/Documents/vpd/lab01<\/code> абсолютный. <code>c/main.c<\/code> относительный. Спецзнаки: <code>.<\/code> текущая папка, <code>..<\/code> на уровень выше, <code>~<\/code> домашняя.", "pro": "<p><b>absolute path<\/b>, <b>relative path<\/b>. Корень <code>/<\/code> называют <b>root<\/b>. Говорят «укажи полный путь», «путь относительно корня репозитория».<\/p>"}, {"t": "word", "term": "PATH", "node": "PATH", "pt": "PATH · env var", "simple": "Список папок, в которых оболочка ищет программу, если ты написал только её имя.", "like": "Список полок, где секретарь ищет нужного специалиста. Если специалиста нет ни на одной полке, «command not found».", "ex": "<code>echo $PATH<\/code> покажет что-то вроде <code>/usr/local/bin:/usr/bin:...<\/code>. gcc лежит в <code>/usr/bin<\/code>, поэтому находится по имени.", "pro": "<p>PATH это <b>переменная окружения<\/b> (environment variable, env var): настройка, которую процесс получает от родителя. Другие примеры: HOME, LANG. Посмотреть все: <code>env<\/code>.<\/p>"}, {"t": "predict", "q": "Почему <code>main<\/code> не запускает твою программу c/main, а <code>./c/main<\/code> запускает?", "o": ["Нужно расширение .exe", "Без слэша оболочка ищет только по папкам из PATH, а текущей папки там нет", "main это зарезервированное слово", "Программа не скомпилирована"], "a": 1, "reveal": "<p>Если в имени есть слэш, это путь, и поиск по PATH не нужен. Без слэша оболочка смотрит только в папки PATH. Текущей папки там нет специально: иначе чужой файл с именем <code>ls<\/code> в случайной папке мог бы запуститься вместо настоящего ls.<\/p>"}, {"t": "word", "term": "Встроенная команда", "node": "builtin", "pt": "builtin · type", "simple": "Команда, которую выполняет сама оболочка, без запуска отдельной программы.", "like": "То, что секретарь делает сам, не зовя специалиста. Например, пересаживается в другую комнату.", "ex": "<code>cd<\/code> встроенная. Проверь: <code>type cd<\/code> скажет «builtin», <code>type ls<\/code> покажет <code>/usr/bin/ls<\/code>.", "pro": "<p><b>shell builtin<\/b>. Почему cd обязана быть встроенной: текущая папка это свойство процесса, и отдельная программа сменила бы папку только себе.<\/p>"}, {"t": "do", "h": "Найди программы", "task": "Посмотри, где лежат инструменты лабы и что такое cd.", "cmd": "which gcc python3 node javac swipl; type cd; echo $PATH", "look": "Пути вида <code>/usr/bin/gcc<\/code>; «cd is a shell builtin»; список папок через двоеточие.", "explain": "<p>Все инструменты лабы в <code>/usr/bin<\/code>, а он есть в PATH. Пакетный менеджер (pacman) кладёт программы туда, поэтому у тебя не было проблем, которые на Windows описаны в задании («gcc не добавился в PATH»).<\/p>"}, {"t": "check", "q": "Что значит <code>cd ..<\/code>?", "o": ["Удалить папку", "Перейти на уровень выше", "Перейти в домашнюю папку", "Показать текущую папку"], "a": 1, "why": "Две точки означают родительскую папку."}, {"t": "why", "q": "Объясни, почему свою программу запускают как ./c/main и почему так сделано специально.", "model": "Без слэша оболочка ищет программу только в папках из переменной PATH, а текущей папки там нет. Путь с ./ говорит «запусти файл именно отсюда». Текущую папку не добавляют в PATH ради безопасности: иначе случайный файл с именем обычной команды в чужой папке мог бы запуститься вместо настоящей."}, {"t": "pro", "simple": "Оболочка ищет программу по списку папок из настройки; моей папки там нет, поэтому я пишу путь явно.", "terms": ["PATH", "переменная окружения", "относительный путь", "./"], "model": "Резолв команды идёт по переменной окружения PATH; cwd в PATH нет, поэтому бинарник из текущей папки запускаю по относительному пути ./c/main."}, {"t": "sum", "items": ["Текущая папка: откуда считаются относительные пути (pwd, cd).", "Абсолютный путь от /, относительный от текущей папки; . .. ~ спецзнаки.", "PATH это переменная окружения со списком папок для поиска программ.", "./ нужен, потому что текущей папки нет в PATH (безопасность).", "cd встроена в оболочку."]}], "cards": [{"q": "Абсолютный и относительный путь?", "a": "Абсолютный от корня /, относительный от текущей папки (cwd)."}, {"q": "Что такое PATH?", "a": "Переменная окружения со списком папок, где оболочка ищет программу по имени."}, {"q": "Зачем ./ перед своей программой?", "a": "Текущей папки нет в PATH (из соображений безопасности), поэтому путь указывают явно."}, {"q": "Почему cd встроенная команда?", "a": "Текущая папка это свойство процесса; отдельная программа сменила бы папку только себе."}, {"q": "Что делают which и type?", "a": "which показывает путь к программе из PATH; type ещё и говорит, встроенная ли команда."}]}, {"id": "t2l3", "title": "Коды возврата и цепочки команд", "min": 10, "steps": [{"t": "intro", "h": "Как программа сообщает «получилось или нет»", "body": "<p>Команда <code>gcc ... &amp;&amp; ./c/main<\/code> запускала программу только если сборка удалась. Откуда оболочка это знает?<\/p>"}, {"t": "word", "term": "Код возврата", "node": "exitcode", "pt": "exit code · $?", "simple": "Число, которое программа отдаёт при завершении: 0 значит «успех», любое другое «что-то пошло не так».", "like": "Отчёт сотрудника в одну цифру: «0» значит «всё сделал»,
