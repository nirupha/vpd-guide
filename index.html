у типа", "goal": "В копии typescript/main.ts поменяй <code>number: ⟦N⟧<\/code> на <code>number: \"⟦N⟧\"<\/code> и собери tsc. Прочитай ошибку и верни как было.", "hint": "tsc main.ts --outDir dist в папке typescript.", "solution": "<p>tsc: <code>Type 'string' is not assignable to type 'number'<\/code>. Это и есть визитка TS: interface ловит ошибку до запуска.<\/p>"}, {"t": "why", "q": "Объясни, почему в C, Python и Rust номер 7 превратился в 07, хотя записан по-разному.", "model": "Во всех трёх номер форматируется с шириной 2 и заполнением нулями: в C спецификатор %02d в snprintf, в Python :02d в f-строке, в Rust {:02} в format!. Синтаксис разный, но идея одна: минимальная ширина 2 и ведущий ноль."}, {"t": "sum", "items": ["Ты сам менял данные, собирал и проверял вывод в нескольких языках.", "Ты видел ошибки компиляторов Rust и TypeScript и чинил их.", "Ты расширил базу фактов Prolog и увидел поиск с возвратом."]}], "cards": [{"q": "Что выведет C-программа для номера 7?", "a": "Student ID .../07 и Control 2128 (304 × 7)."}, {"q": "Как починить «cannot assign twice to immutable variable» в Rust?", "a": "Объявить let mut."}, {"q": "Что будет, если в printf Java забыть %n?", "a": "Строки выведутся без перевода строки, слипнутся."}]}], "defense": true}, {"id": "t4", "title": "Кодировки: как текст становится байтами", "role": "Почему кириллица иногда превращается в кракозябры и как это чинится: ASCII, кодовые страницы, Unicode, UTF-8.", "link": "программы выводят текст, а в памяти и в терминале текст это байты", "map": {"lead": "Сверху буква, как её видит человек. Ниже договорённости, как превратить её в число и в байты. Внизу что делает терминал и где всё ломается.", "rows": [{"label": "Буква для человека", "nodes": ["glyph"], "arrow": "нужно договориться, какое число у буквы"}, {"label": "Старые таблицы", "nodes": ["encoding", "ascii", "codepage"], "arrow": "таблиц было много, поэтому придумали одну на всех"}, {"label": "Одна таблица на весь мир", "nodes": ["unicode", "utf8", "utf16"], "arrow": "байты уходят в терминал"}, {"label": "Где ломается и как чинят", "nodes": ["mojibake", "consolecp"], "arrow": ""}], "extra": {"glyph": {"label": "Глиф", "simple": "Картинка буквы в шрифте. Её рисует терминал, когда декодировал байты в символ.", "pro": "<b>glyph<\/b>; набор глифов это <b>шрифт<\/b> (font). Если в шрифте нет глифа, рисуется квадратик или знак вопроса (так называемый «тофу»).", "lesson": "t4l3"}}}, "lessons": [{"id": "t4l1", "title": "Буквы это числа: ASCII и кодовые страницы", "min": 12, "steps": [{"t": "intro", "h": "Почему вообще бывают кракозябры", "body": "<p>В теме 1 ты узнал, что в памяти только числа. Значит, у каждой буквы должно быть своё число. Вопрос: кто решает, какое?<\/p>"}, {"t": "word", "term": "Кодировка", "node": "encoding", "pt": "encoding · charset", "simple": "Договорённость, какое число (какие байты) означает какой символ.", "like": "Шифр-таблица: «А = 1, Б = 2...». Если отправитель и получатель пользуются разными таблицами, получается бессмыслица.", "ex": "Буква <code>A<\/code> это 65 почти во всех кодировках. А вот русская <code>М<\/code> в разных кодировках это разные байты.", "pro": "<p><b>character encoding<\/b>; набор символов называют <b>charset<\/b>. Говорят «файл в какой кодировке?», «сохрани в UTF-8», «поехала кодировка».<\/p>"}, {"t": "word", "term": "ASCII", "node": "ascii", "pt": "ASCII · 7 бит", "simple": "Самая старая общая таблица (1963): 128 символов, латиница, цифры, знаки препинания. Каждый символ занимает 1 байт. Кириллицы нет.", "like": "Первый общий шифр, но только для английского алфавита.", "ex": "<code>A<\/code> = 65, <code>a<\/code> = 97, <code>0<\/code> = 48, пробел = 32, перевод строки = 10.", "pro": "<p><b>ASCII<\/b> (American Standard Code for Information Interchange) использует 7 бит, значения 0–127. Всё, что выше 127, ASCII не описывает: отсюда и разнобой у других языков.<\/p>"}, {"t": "word", "term": "Кодовая страница", "node": "codepage", "pt": "code page · cp866 · cp1251", "simple": "Таблица, которая кладёт буквы своего языка в числа 128–255. У каждой страны и системы было по своей, и раскладки не совпадали.", "like": "Каждая страна дописала в шифр свои буквы, но каждая на свои места.", "ex": "Для кириллицы: <b>cp866<\/b> (консоль DOS и Windows), <b>cp1251<\/b> (окна Windows), <b>KOI8-R<\/b> (старый Unix). Одна и та же <code>М<\/code>: в cp866 это байт 140, в cp1251 204.", "pro": "<p><b>code page<\/b>; на Windows консольные страницы называют <b>OEM<\/b>, а страницы графических окон <b>ANSI<\/b>. Это наследие 80–90-х.<\/p>"}, {"t": "predict", "q": "Текст написан в cp1251, а открыт как cp866. Что увидишь?", "o": ["Нормальный текст", "Другие символы вместо букв (кракозябры)", "Пустой экран", "Только латиницу"], "a": 1, "reveal": "<p>Байты те же, но их читают по другой таблице, и они превращаются в другие символы. Латиница (байты 0–127) при этом не пострадает: эта часть у всех таблиц одинаковая.<\/p>"}, {"t": "do", "h": "Посмотри байты буквы", "task": "Сравни латинскую M и русскую М.", "cmd": "printf 'M' | xxd; printf 'М' | xxd", "look": "<code>4d<\/code> у латинской и <code>d09c<\/code> у русской.", "explain": "<p><code>xxd<\/code> показывает байты в hex. Латинская M это один байт 4d (77). Русская М в твоей системе (UTF-8) это два байта d0 9c. Внешне буквы одинаковые, а байты разные. Ловушка: в твоей группе «М3О» начинается с <b>кириллической<\/b> М и кончается кириллической О.<\/p>"}, {"t": "check", "q": "Почему кракозябры бывают у кириллицы, но почти никогда у латиницы?", "o": ["Латиница проще", "Байты 0–127 (ASCII) одинаковы во всех кодировках, а кириллица живёт выше и везде по-разному", "Кириллица не поддерживается компьютерами", "Из-за шрифтов"], "a": 1, "why": "Общая основа ASCII совпадает, расходятся только «верхние» таблицы."}, {"t": "why", "q": "Объясни, откуда берутся кракозябры, через понятие кодировки.", "model": "Компьютер хранит текст числами-байтами, а кодировка это таблица соответствия символов и байтов. Если текст записали по одной таблице (например UTF-8 или cp1251), а прочитали по другой (cp866), те же байты превращаются в другие символы. Латиница обычно не ломается, потому что первые 128 значений (ASCII) одинаковы во всех таблицах."}, {"t": "pro", "simple": "Файл записали по одной таблице букв, а открыли по другой, поэтому вместо русских букв мусор; английские буквы целы, они во всех таблицах одинаковые.", "terms": ["кодировка", "кодовая страница cp1251/cp866", "ASCII", "mojibake"], "model": "Кодировка при чтении не совпала с кодировкой записи: текст в cp1251 декодировали как cp866, получился mojibake. ASCII-часть совпадает во всех кодовых страницах, поэтому латиница цела."}, {"t": "sum", "items": ["Кодировка это таблица «символ ↔ байты».", "ASCII: 128 символов, латиница, 1 байт, кириллицы нет.", "Кодовые страницы (cp866, cp1251) кладут кириллицу в 128–255, каждая по-своему.", "Чужая таблица при чтении даёт кракозябры."]}], "cards": [{"q": "Что такое кодировка?", "a": "Таблица соответствия символов и байтов (character encoding)."}, {"q": "Что такое ASCII?", "a": "Старая таблица на 128 символов (0–127): латиница, цифры, знаки; 1 байт; без кириллицы."}, {"q": "Что такое кодовая страница?", "a": "Таблица, кладущая символы языка в 128–255; для кириллицы cp866, cp1251, KOI8-R."}, {"q": "Почему латиница не ломается при смене кодировки?", "a": "Первые 128 значений (ASCII) одинаковы во всех кодировках."}]}, {"id": "t4l2", "title": "Unicode и UTF-8", "min": 14, "steps": [{"t": "intro", "h": "Одна таблица на весь мир", "body": "<p>Кодовых страниц было сотни, и текст постоянно ломался при переносе. Решение: одна общая таблица всех символов мира и разумный способ записать её байтами.<\/p>"}, {"t": "word", "term": "Unicode", "node": "unicode", "pt": "Unicode · code point · U+041C", "simple": "Одна таблица, где у каждого символа мира свой номер. Больше 150 000 символов: все алфавиты, иероглифы, эмодзи.", "like": "Всемирный справочник: у каждого символа свой паспортный номер.", "ex": "<code>М<\/code> (кириллическая) = U+041C, <code>M<\/code> (латинская) = U+004D, <code>😀<\/code> = U+1F600.", "pro": "<p>Номер символа называют <b>code point<\/b> (кодовая точка), пишут <b>U+<\/b> и hex. Важно: Unicode это только номера. Как записать номер байтами, решает кодировка: UTF-8, UTF-16 или UTF-32.<\/p>"}, {"t": "word", "term": "UTF-8", "node": "utf8", "pt": "UTF-8 · переменная длина", "simple": "Способ записать номера Unicode байтами: латиница 1 байт (как в ASCII), кириллица 2 байта, иероглифы 3, эмодзи 4.", "like": "Почтовый индекс разной длины: для близких адресов коротко, для далёких длиннее.", "ex": "<code>М<\/code> = <code>d0 9c<\/code>, <code>M<\/code> = <code>4d<\/code>. «⟦RU_SUR⟧» в UTF-8 это ⟦RU_SUR_B⟧ байт, а «⟦EN_SUR⟧» ⟦EN_SUR_B⟧.", "pro": "<p><b>variable-length encoding<\/b> (кодировка переменной длины). По первым битам байта видно длину символа: <code>0xxxxxxx<\/code> 1 байт, <code>110xxxxx<\/code> 2, <code>1110xxxx<\/code> 3, <code>11110xxx<\/code> 4; продолжения всегда <code>10xxxxxx<\/code>. Сегодня это стандарт Linux, macOS, веба и Git.<\/p>"}, {"t": "idea", "h": "Почему UTF-8 сделан именно так", "body": "<ul><li><b>Совместим с ASCII.<\/b> Любой английский текст уже является корректным UTF-8. Старые программы работают без изменений.<\/li><li><b>Нет нулевых байтов внутри символов.<\/b> Поэтому C-строки (с нулём в конце) и твой printf работают с кириллицей, ничего не зная о Unicode: они просто копируют байты.<\/li><li><b>Устойчив к ошибкам.<\/b> Продолжение символа всегда начинается с битов 10, поэтому если байт потерялся, сломается один символ, а не весь текст.<\/li><\/ul><p class=\"pro\"><b>Как говорят профи:<\/b> UTF-8 <b>ASCII-compatible<\/b> и <b>self-synchronizing<\/b>.<\/p>"}, {"t": "predict", "q": "Сколько байт в UTF-8 занимает «М3О» из твоей группы?", "o": ["3", "4", "5", "6"], "a": 2, "reveal": "<p>М это 2 байта (кириллица), 3 это 1 байт (цифра, ASCII), О это 2 байта. Итого 5.<\/p>"}, {"t": "do", "h": "Посчитай байты и символы", "task": "wc -c считает байты, wc -m символы.", "cmd": "printf '⟦RU_SUR⟧' | wc -c; printf '⟦RU_SUR⟧' | wc -m; printf '⟦EN_SUR⟧' | wc -c", "look": "⟦RU_SUR_B⟧, ⟦RU_SUR_C⟧, ⟦EN_SUR_B⟧.", "explain": "<p>Кириллица по 2 байта, латиница по 1. Поэтому в Bash-визитке <code>wc -c<\/code> посчитал бы для русского имени ⟦RU_B⟧ (⟦RU_LETTERSW⟧ по 2 байта и ⟦RU_SPW⟧), а <code>wc -m<\/code> ⟦RU_LEN⟧. Для английского имени ⟦EN_LEN⟧ в обоих случаях.<\/p>"}, {"t": "word", "term": "UTF-16 и длина строки", "node": "utf16", "pt": "UTF-16 · surrogate pair", "simple": "Другая запись Unicode: по 2 байта (или по 4 для редких символов). Её используют JavaScript, Java, C# и Windows внутри себя.", "like": "Те же паспортные номера, но записанные на бланках фиксированного размера; для очень длинных номеров берут два бланка.", "ex": "<code>\"😀\".length<\/code> в JS равно <b>2<\/b>, а <code>len(\"😀\")<\/code> в Python равно 1: эмодзи не влез в одну 16-битную единицу, и JS считает единицы.", "pro": "<p>Два бланка для одного символа называют <b>суррогатной парой<\/b> (surrogate pair). Отсюда урок: «длина строки» бывает в байтах (C strlen), в единицах кодировки (JS, Java .length) и в code points (Python len).<\/p>"}, {"t": "idea", "h": "Почему эмодзи «весит» 2 в JavaScript", "body": "<p>В Unicode больше миллиона номеров. Первые 65 536 из них называют <b>BMP<\/b> (Basic Multilingual Plane, «базовая плоскость»). Туда влезают почти все алфавиты мира: латиница, кириллица, китайский.<\/p><p>UTF-16 записывает символ кусочками по 2 байта. Номер из BMP помещается в один такой кусочек. Номер дальше BMP (эмодзи 😀 это U+1F600) не помещается, и его записывают двумя кусочками. Эта пара называется <b>surrogate pair<\/b>.<\/p><p>JavaScript считает <code>.length<\/code> в кусочках UTF-16, а не в символах. Поэтому <code>\"М\".length<\/code> равно 1, а <code>\"😀\".length<\/code> равно 2. Так же ведут себя Java и C#.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> «эмодзи вне BMP занимает в UTF-16 surrogate pair, поэтому length считает его за 2 code unit».<\/p>"}, {"t": "check", "q": "Почему printf в C правильно выводит кириллицу на Linux, хотя ничего не знает о Unicode?", "o": ["gcc перекодирует строки", "printf копирует байты UTF-8 как есть, нулевых байтов внутри нет, а терминал читает их как UTF-8", "Linux переводит всё в ASCII", "printf знает Unicode"], "a": 1, "why": "Совпадение кодировки исходника и терминала плюс устройство UTF-8."}, {"t": "why", "q": "Объясни разницу между Unicode и UTF-8 человеку, который думает, что это одно и то же.", "model": "Unicode это таблица: каждому символу мира присвоен номер (code point), например М = U+041C. UTF-8 это способ записать эти номера байтами: латиница одним байтом как в ASCII, кириллица двумя, остальное тремя или четырьмя. Есть и другие способы записать те же номера, например UTF-16. Unicode отвечает «какой номер у символа», UTF-8 отвечает «какими байтами его хранить»."}, {"t": "pro", "simple": "У буквы М есть всемирный номер, а записывается она двумя байтами; в JS эмодзи считается за два, потому что там другая запись.", "terms": ["code point", "UTF-8 (переменная длина)", "UTF-16", "surrogate pair"], "model": "Code point М это U+041C, в UTF-8 он кодируется двумя байтами d0 9c. JS хранит строки в UTF-16, и эмодзи вне BMP занимает surrogate pair, поэтому length = 2."}, {"t": "sum", "items": ["Unicode это номера всех символов мира (code points, U+...).", "UTF-8 записывает их байтами переменной длины: 1–4 байта, совместим с ASCII.", "Кириллица в UTF-8 по 2 байта: wc -c против wc -m.", "JS, Java, C# используют UTF-16: эмодзи .length = 2."]}], "cards": [{"q": "Unicode и UTF-8: в чём разница?", "a": "Unicode это номера символов (code points); UTF-8 способ записать их байтами."}, {"q": "Сколько байт занимает кириллица в UTF-8?", "a": "2 байта на букву; латиница 1, эмодзи 4."}, {"q": "Почему UTF-8 работает со строками C?", "a": "Совместим с ASCII и не содержит нулевых байтов внутри символов."}, {"q": "Почему \"😀\".length в JS равно 2?", "a": "JS хранит строки в UTF-16; эмодзи занимает суррогатную пару из двух единиц."}, {"q": "wc -c и wc -m?", "a": "wc -c считает байты, wc -m символы."}]}, {"id": "t4l3", "title": "Кракозябры и Windows: как это чинили в лабе", "min": 12, "steps": [{"t": "intro", "h": "Что происходит при выводе", "body": "<p>Теперь соберём всё: программа выводит байты, терминал превращает их в буквы. Где тут может сломаться и почему задание отдельно говорит про C/C++ на Windows?<\/p>"}, {"t": "idea", "h": "Путь текста от исходника до экрана", "body": "<div class=\"flow\"><span class=\"s\">исходник в UTF-8<small>«При» = d0 9f d1 80 d0 b8<\/small><\/span><span class=\"a\">→<\/span><span class=\"s\">программа<small>C выводит байты как есть<\/small><\/span><span class=\"a\">→<\/span><span class=\"s\">терминал<small>читает по своей кодировке и рисует буквы<\/small><\/span><\/div><p>Чтобы всё было правильно, <b>кодировка исходника и кодировка терминала должны совпасть<\/b>. На Linux обе UTF-8, и ничего делать не надо.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> перевод символов в байты это <b>encode<\/b> (кодирование), обратно <b>decode<\/b>. Терминал декодирует поток байтов. Настройку языка и кодировки системы называют <b>локалью<\/b> (locale), у тебя <code>LANG=en_US.UTF-8<\/code>.<\/p>"}, {"t": "word", "term": "Кракозябры", "node": "mojibake", "pt": "mojibake", "simple": "Бессмысленные символы, которые получаются, когда байты прочитали не той кодировкой.", "like": "Письмо, расшифрованное не тем шифром.", "ex": "«Привет» в UTF-8, прочитанный как cp866: <code>╨Я╤А╨╕╨▓╨╡╤В<\/code>. Прочитанный как cp1251: <code>РџСЂРёРІРµС‚<\/code>.", "pro": "<p>По-английски <b>mojibake<\/b> (японское слово). По узору можно понять ошибку: «Р» и «С» через букву значит «UTF-8 прочитан как cp1251», «╨» и «╤» значит «UTF-8 прочитан как cp866».<\/p>"}, {"t": "do", "h": "Сделай кракозябры сам", "task": "Прочитаем UTF-8 байты так, как их прочитала бы консоль Windows.", "cmd": "echo Привет | iconv -f cp866 -t utf-8; echo Привет | iconv -f cp1251 -t utf-8", "look": "╨Я╤А╨╕╨▓╨╡╤В и РџСЂРёРІРµС‚", "explain": "<p><code>iconv<\/code> перекодирует текст. Мы нарочно сказали ему «эти байты в cp866», хотя они в UTF-8. Ровно это и происходит в консоли Windows, когда программа на C выводит UTF-8.<\/p>"}, {"t": "word", "term": "Кодовая страница консоли", "node": "consolecp", "pt": "SetConsoleOutputCP · chcp 65001", "simple": "Настройка, по какой таблице консоль Windows читает байты. По умолчанию в русской Windows это cp866, а нужно UTF-8 (номер 65001).", "like": "Переключить переводчика на нужный язык перед разговором.", "ex": "В твоём C/C++ коде: <code>SetConsoleOutputCP(CP_UTF8)<\/code> (вывод) и <code>SetConsoleCP(CP_UTF8)<\/code> (ввод), внутри <code>#ifdef _WIN32<\/code>. Или команда <code>chcp 65001<\/code> перед запуском.", "pro": "<p>Это функции <b>WinAPI<\/b> из <code>windows.h<\/code>. 65001 это номер кодовой страницы UTF-8. В C# аналог <code>Console.OutputEncoding = Encoding.UTF8<\/code>. Почему Windows до сих пор стартует в cp866: <b>обратная совместимость<\/b> (backward compatibility) со старыми программами.<\/p>"}, {"t": "predict", "q": "Почему задание выделяет кириллицу именно в C/C++, а не в Python или Java?", "o": ["C/C++ не умеют кириллицу", "C/C++ выводят байты как есть, а среды Python, Java, .NET сами знают кодировку строк и подстраиваются под консоль", "Python не работает на Windows", "Так исторически"], "a": 1, "reveal": "<p>Для C строка это просто байты: что в исходнике, то и в консоль. Рантаймы Python, Java и .NET хранят текст как Unicode и при выводе сами перекодируют его под консоль (хотя в C# на Windows всё равно полезно задать OutputEncoding).<\/p>"}, {"t": "check", "q": "Почему тебе на Linux не понадобился SetConsoleOutputCP?", "o": ["gcc сам перекодирует строки", "И исходник, и терминал уже в UTF-8, байты совпадают", "Потому что #include <stdio.h>", "В Linux нет кириллицы"], "a": 1, "why": "Блок под #ifdef _WIN32 на Linux вообще не компилируется."}, {"t": "story", "h": "Картина целиком", "body": "<p>Человек видит <b>глиф<\/b> (картинку буквы), компьютер хранит <b>байты<\/b>. Связывает их <b>кодировка<\/b>. Сначала был <b>ASCII<\/b>: 128 символов, латиница, 1 байт. Остальные языки положили свои буквы в байты 128–255 через <b>кодовые страницы<\/b> (cp866, cp1251), и все по-разному.<\/p><p>Это решил <b>Unicode<\/b>: у каждого символа свой <b>code point<\/b>. Записывают его чаще всего в <b>UTF-8<\/b> (1–4 байта, совместим с ASCII, без нулей внутри, поэтому работает даже в C) или в <b>UTF-16<\/b> (JS, Java, C#, отсюда <code>\"😀\".length = 2<\/code>).<\/p><p>При выводе программа отдаёт байты, а терминал их <b>декодирует<\/b>. Совпали кодировки, значит, всё хорошо (Linux, macOS: везде UTF-8). Не совпали, значит, <b>mojibake<\/b>. В консоли Windows по умолчанию cp866, поэтому в C/C++ под <code>#ifdef _WIN32<\/code> стоит <code>SetConsoleOutputCP(CP_UTF8)<\/code> (или <code>chcp 65001<\/code>).<\/p>"}, {"t": "why", "q": "Препод: «Как ты обеспечил вывод кириллицы в C/C++? Что будет на Windows?»", "model": "Исходники сохранены в UTF-8, строки в программе хранятся как байты UTF-8, и C выводит их как есть. На Linux терминал и локаль в UTF-8, поэтому всё отображается правильно без дополнительного кода. На Windows консоль по умолчанию в cp866, и без исправления были бы кракозябры, поэтому под #ifdef _WIN32 я подключил windows.h и вызвал SetConsoleCP(CP_UTF8) и SetConsoleOutputCP(CP_UTF8). Альтернатива: chcp 65001."}, {"t": "pro", "simple": "На Windows окно с командами читает байты по старой русской таблице, поэтому я переключаю его на общую таблицу прямо из программы, а на Linux этот кусок даже не собирается.", "terms": ["кодовая страница консоли (cp866)", "UTF-8 (65001)", "SetConsoleOutputCP / WinAPI", "#ifdef _WIN32"], "model": "Консоль Windows по умолчанию декодирует вывод в OEM cp866, поэтому через WinAPI SetConsoleOutputCP(CP_UTF8) переключаю её на 65001; вызов обёрнут в #ifdef _WIN32 и на Linux не компилируется."}, {"t": "sum", "items": ["Программа выводит байты, терминал их декодирует; кодировки должны совпасть.", "Кракозябры (mojibake): UTF-8 прочитан как cp866 или cp1251; по узору видно, что пошло не так.", "На Windows консоль в cp866: чинится SetConsoleOutputCP(CP_UTF8) или chcp 65001.", "C/C++ выводят байты как есть, поэтому проблема у них заметнее всего."]}], "cards": [{"q": "Что такое mojibake?", "a": "Кракозябры: байты прочитаны не той кодировкой."}, {"q": "«РџСЂРёРІРµС‚» это что?", "a": "«Привет» в UTF-8, прочитанный как cp1251."}, {"q": "Что делает SetConsoleOutputCP(CP_UTF8)?", "a": "Переключает кодовую страницу вывода консоли Windows на UTF-8 (65001)."}, {"q": "Почему кириллица в C на Linux работает без доработок?", "a": "Исходник и терминал в UTF-8, байты передаются как есть."}, {"q": "Почему консоль Windows в cp866?", "a": "Обратная совместимость со старыми DOS-программами."}]}, {"id": "t4l4", "title": "Практика: кодировки сам", "min": 10, "steps": [{"t": "intro", "h": "Байты своими руками", "body": "<p>Три задания на кодировки.<\/p>"}, {"t": "task", "h": "Байты своего имени", "goal": "Выведи байты слова «⟦RU_SUR⟧» в hex, посчитай байты и символы. Объясни разницу чисел.", "hint": "xxd показывает байты, wc -c и wc -m считают.", "solution": "<pre>printf '⟦RU_SUR⟧' | xxd\nprintf '⟦RU_SUR⟧' | wc -c\nprintf '⟦RU_SUR⟧' | wc -m<\/pre><p>⟦RU_SUR_B⟧ байт и ⟦RU_SUR_C⟧ символов: кириллица в UTF-8 по 2 байта.<\/p>"}, {"t": "task", "h": "Сломай и почини", "goal": "Сделай кракозябры из слова «Привет», прочитав UTF-8 как cp1251, а потом верни нормальный текст обратным преобразованием.", "hint": "iconv -f откуда -t куда. Обратное преобразование меняет местами -f и -t.", "solution": "<pre>echo Привет | iconv -f cp1251 -t utf-8\necho Привет | iconv -f cp1251 -t utf-8 | iconv -f utf-8 -t cp1251<\/pre><p>Сначала РџСЂРёРІРµС‚, потом снова Привет: байты не терялись, их просто читали не той таблицей.<\/p>"}, {"t": "task", "h": "Длина строки в разных языках", "goal": "Узнай длину «😀» в Python и в Node и объясни, почему разная.", "hint": "python3 -c и node -e выполняют одну строку кода.", "solution": "<pre>python3 -c 'print(len(\"😀\"))'\nnode -e 'console.log(\"😀\".length)'<\/pre><p>1 и 2: Python считает code points, JS единицы UTF-16 (суррогатная пара).<\/p>"}, {"t": "sum", "items": ["Ты сам увидел байты UTF-8, сделал и починил кракозябры, сравнил длины строк."]}], "cards": [{"q": "Почему printf '⟦RU_SUR⟧' | wc -c даёт ⟦RU_SUR_B⟧?", "a": "Кириллица в UTF-8 по 2 байта на букву."}], "opt": true}], "defense": true}, {"id": "t5", "title": "Git: история проекта", "role": "Как Git хранит историю: коммиты, три зоны, объекты и хеши, ветка как указатель, .gitignore.", "link": "весь код лабы хранится в Git", "map": {"lead": "Сверху твои файлы. Ниже путь изменения в историю. Ещё ниже как Git хранит это внутри.", "rows": [{"label": "Зачем", "nodes": ["vcs", "repo"], "arrow": "изменения проходят три зоны"}, {"label": "Три зоны", "nodes": ["workdir", "index", "status", "commit"], "arrow": "внутри всё это объекты с хешами"}, {"label": "Как устроено внутри", "nodes": ["hash", "objects", "branchptr", "head"], "arrow": "а что не хранить, решает"}, {"label": "Что хранить", "nodes": ["gitignore"], "arrow": ""}]}, "lessons": [{"id": "t5l1", "title": "Зачем Git: репозиторий и коммит", "min": 12, "steps": [{"t": "intro", "h": "Проблема, которую решает Git", "body": "<p>Знакомо: <code>лаба_финал.doc<\/code>, <code>лаба_финал2.doc<\/code>, <code>лаба_точно_финал.doc<\/code>? Git решает это правильно: хранит всю историю проекта и позволяет нескольким людям работать над ним одновременно.<\/p>"}, {"t": "word", "term": "Система контроля версий", "node": "vcs", "pt": "VCS · Git", "simple": "Программа, которая хранит историю изменений проекта: можно вернуться к любой версии, посмотреть, кто что менял, работать параллельно.", "like": "Машина времени для папки с проектом плюс журнал «кто, когда и зачем».", "ex": "Git самая популярная. До неё были SVN и CVS.", "pro": "<p><b>version control system<\/b> (VCS), «система контроля версий». Git <b>распределённая<\/b> (distributed): у каждого полная копия истории. SVN <b>централизованная<\/b>: история только на сервере.<\/p>"}, {"t": "word", "term": "Репозиторий", "node": "repo", "pt": "repository · .git", "simple": "Проект вместе со всей его историей. История лежит в скрытой папке <code>.git<\/code> внутри проекта.", "like": "Папка проекта, к которой прикреплён архив всех её прошлых состояний.", "ex": "<code>~/Documents/vpd/lab01/dev<\/code> это репозиторий: файлы лабы плюс папка <code>.git<\/code>. Создаётся командой <code>git init<\/code> или <code>git clone<\/code>.", "pro": "<p><b>repository<\/b>, «репо». Говорят «склонируй репо», «закоммить в репозиторий».<\/p>"}, {"t": "word", "term": "Коммит", "node": "commit", "pt": "commit · snapshot", "simple": "Сохранённый снимок всего проекта в момент времени, плюс кто сделал, когда и зачем (сообщение).", "like": "Фотография всего стола с подписью на обороте: «добавил C и C++, 2 ноября».", "ex": "<code>git commit -m \"Add C and C++ implementations\"<\/code>. У тебя в лабе 15 коммитов.", "pro": "<p><b>commit<\/b> (и глагол «закоммитить»). Коммит хранит <b>снимок<\/b> (snapshot), а не разницу; разницу Git вычисляет, когда её просят. Каждый коммит знает своего <b>родителя<\/b> (parent), поэтому история это цепочка. Сообщение коммита это <b>commit message<\/b>; принято писать в повелительном наклонении: «Add», а не «Added».<\/p>"}, {"t": "predict", "q": "Что значит, что коммит хранит «снимок», а не «разницу»?", "o": ["Он хранит только изменённые строки", "Он описывает состояние всего проекта в этот момент", "Он хранит картинку экрана", "Он хранит только сообщение"], "a": 1, "reveal": "<p>Каждый коммит описывает весь проект целиком. Но место не тратится зря: неизменённые файлы Git не копирует, а ссылается на уже сохранённые (как именно, в уроке 3).<\/p>"}, {"t": "do", "h": "Посмотри свою историю", "task": "Открой историю лабы.", "cmd": "cd ~/Documents/vpd/lab01/dev && git log --oneline", "look": "15 строк: короткий код и сообщение каждого коммита.", "explain": "<p>Короткий код слева (<code>72ec40d<\/code>) это начало <b>хеша<\/b>, уникального имени коммита. <code>--oneline<\/code> значит «по одной строке на коммит». Задание требует минимум 6 осмысленных коммитов и запрещает сообщения вроде «1», «fix», «готово».<\/p>"}, {"t": "check", "q": "Где Git хранит историю твоего проекта?", "o": ["На сервере GitHub", "В скрытой папке .git внутри проекта", "В облаке", "В отдельном файле history.txt"], "a": 1, "why": "Поэтому история есть у тебя даже без интернета. Git распределённый."}, {"t": "why", "q": "Своими словами: что такое коммит и зачем его подписывать сообщением?", "model": "Коммит это сохранённый снимок всего проекта в определённый момент, с автором, датой, сообщением и ссылкой на предыдущий коммит. Сообщение объясняет, что и зачем изменено, чтобы по истории было понятно, как развивался проект и где искать нужное изменение."}, {"t": "pro", "simple": "Я сохранил состояние всего проекта с подписью, и это сохранение встало в цепочку после предыдущего; вся история лежит у меня локально.", "terms": ["коммит / snapshot", "commit message", "parent", "распределённая VCS"], "model": "Сделал коммит: snapshot проекта с commit message, его parent это предыдущий коммит. Git распределённая VCS, поэтому вся история есть в моём локальном репозитории."}, {"t": "sum", "items": ["VCS хранит историю проекта; Git распределённый.", "Репозиторий это проект плюс история в папке .git.", "Коммит это снимок проекта с автором, датой, сообщением и родителем.", "git log --oneline показывает историю."]}], "cards": [{"q": "Что такое VCS?", "a": "Система контроля версий: хранит историю изменений проекта (Git, SVN)."}, {"q": "Что такое репозиторий?", "a": "Проект вместе с историей; история лежит в папке .git."}, {"q": "Что такое коммит?", "a": "Снимок всего проекта с автором, датой, сообщением и ссылкой на родителя."}, {"q": "Распределённая и централизованная VCS?", "a": "Распределённая (Git): полная история у каждого. Централизованная (SVN): только на сервере."}]}, {"id": "t5l2", "title": "Три зоны: рабочая папка, индекс, история", "min": 14, "steps": [{"t": "intro", "h": "Главная картинка Git", "body": "<p>Почему в Git два шага, <code>git add<\/code> и потом <code>git commit<\/code>? Потому что между твоими файлами и историей есть промежуточная зона.<\/p>"}, {"t": "word", "term": "Рабочая директория", "node": "workdir", "pt": "working tree", "simple": "Обычные файлы проекта на диске, которые ты редактируешь.", "like": "Твой рабочий стол, где всё разложено.", "ex": "Ты открыл README.md в nvim и поменял строку: изменение пока только в рабочей директории.", "pro": "<p><b>working tree<\/b> (рабочее дерево), <b>working directory<\/b>.<\/p>"}, {"t": "word", "term": "Индекс", "node": "index", "pt": "index · staging area", "simple": "Черновик следующего коммита: туда ты складываешь те изменения, которые хочешь закоммитить.", "like": "Коробка «к отправке»: со стола в неё кладёшь только то, что пойдёт в эту посылку.", "ex": "<code>git add README.md<\/code> кладёт текущую версию файла в индекс. <code>git commit<\/code> делает снимок <b>из индекса<\/b>.", "pro": "<p><b>index<\/b>, <b>staging area<\/b>, глагол «застейджить». Говорят «изменения в стейджинге», «закинь файл в индекс». Зачем: собрать в коммит только связанные изменения, даже если ты поменял десять файлов.<\/p>"}, {"t": "idea", "h": "Три зоны и команды", "body": "<div class=\"flow\"><span class=\"s\">рабочая директория<small>правишь файлы<\/small><\/span><span class=\"a\">git add →<\/span><span class=\"s\">индекс<small>черновик коммита<\/small><\/span><span class=\"a\">git commit →<\/span><span class=\"s\">история<small>коммиты в .git<\/small><\/span><\/div><div class=\"tbl\"><table><tr><th>Команда<\/th><th>Что делает<\/th><\/tr><tr><td><code>git status<\/code><\/td><td>что изменено, что в индексе, что не отслеживается<\/td><\/tr><tr><td><code>git add файл<\/code><\/td><td>положить версию файла в индекс<\/td><\/tr><tr><td><code>git diff<\/code><\/td><td>разница рабочая директория ↔ индекс (ещё не добавлено)<\/td><\/tr><tr><td><code>git diff --staged<\/code><\/td><td>разница индекс ↔ последний коммит (войдёт в коммит)<\/td><\/tr><tr><td><code>git commit -m \"...\"<\/code><\/td><td>снимок из индекса в историю<\/td><\/tr><tr><td><code>git restore --staged файл<\/code><\/td><td>убрать файл из индекса обратно<\/td><\/tr><\/table><\/div>"}, {"t": "predict", "q": "Ты изменил README и сделал <code>git add README.md<\/code>. Что покажет <code>git diff<\/code> без флагов?", "o": ["Изменения README", "Ничего: рабочая директория совпадает с индексом", "Ошибку", "Весь файл"], "a": 1, "reveal": "<p>Изменение уже в индексе, а git diff сравнивает рабочую директорию именно с индексом. Увидеть его можно через <code>git diff --staged<\/code>.<\/p>"}, {"t": "word", "term": "Статусы файла", "node": "status", "pt": "untracked · modified · staged", "simple": "Git делит файлы на: неотслеживаемые (новые, Git о них не знает), изменённые (отличаются от индекса) и подготовленные (в индексе, войдут в коммит).", "like": "На столе новые вещи, переделанные вещи и вещи, уже лежащие в коробке «к отправке».", "ex": "<code>git status<\/code> пишет разделы <code>Untracked files<\/code>, <code>Changes not staged for commit<\/code>, <code>Changes to be committed<\/code>.", "pro": "<p><b>untracked<\/b>, <b>modified<\/b> (unstaged), <b>staged<\/b>. Если всё закоммичено: <code>nothing to commit, working tree clean<\/code>, задание требует именно такой финальный статус.<\/p>"}, {"t": "check", "q": "Изменил a.txt и b.txt, сделал <code>git add a.txt<\/code> и <code>git commit<\/code>. Что в коммите?", "o": ["Оба файла", "Ничего", "Только b.txt", "Только изменения a.txt"], "a": 3, "why": "Коммит берётся из индекса. b.txt останется в «Changes not staged»."}, {"t": "idea", "h": "Почему в начале лабы нельзя было git add .", "body": "<p>Задание требовало первые изменения добавлять <b>конкретными путями<\/b>, «чтобы увидеть различие между рабочей директорией и staging area». <code>git add .<\/code> добавляет всё подряд, в том числе мусор вроде бинарников, если ещё нет .gitignore.<\/p><p>Твой первый коммит шёл так: <code>git status<\/code> → <code>git add README.md<\/code> → <code>git status<\/code> → <code>git diff<\/code> (пусто) → <code>git diff --staged<\/code> (весь README) → <code>git commit -m \"Initialize lab project\"<\/code>.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> один коммит на одно логическое изменение называют <b>атомарным коммитом<\/b> (atomic commit). Индекс и нужен для таких коммитов.<\/p>"}, {"t": "do", "h": "Пройди путь сам в песочнице", "task": "Создадим пустой репозиторий и посмотрим статусы на каждом шаге.", "cmd": "rm -rf /tmp/g3 && mkdir /tmp/g3 && cd /tmp/g3 && git init -q -b main && echo hi > a.txt && git status --short && git add a.txt && git status --short && echo more >> a.txt && git status --short", "look": "<code>?? a.txt<\/code>, потом <code>A  a.txt<\/code>, потом <code>AM a.txt<\/code>.", "explain": "<p>Короткий формат: <code>??<\/code> неотслеживаемый; <code>A<\/code> в первой колонке добавлен в индекс; <code>M<\/code> во второй колонке изменён после add. Первая колонка про индекс, вторая про рабочую директорию. Ровно три зоны.<\/p>"}, {"t": "why", "q": "Что такое индекс и зачем он нужен, если можно было бы коммитить сразу?", "model": "Индекс это черновик следующего коммита между рабочей директорией и историей. git add кладёт туда версию файла, git commit делает снимок из индекса. Так можно собрать в коммит только связанные изменения, даже если изменено много файлов, и проверить через git diff --staged, что именно войдёт."}, {"t": "pro", "simple": "Я поменял два файла, но в сохранение положил только один, предварительно проверив, что именно туда попадёт.", "terms": ["working tree", "staging area / индекс", "git add", "git diff --staged", "атомарный коммит"], "model": "Из working tree застейджил через git add только один файл, проверил git diff --staged и сделал атомарный коммит; второй файл остался modified."}, {"t": "sum", "items": ["Три зоны: рабочая директория → (git add) → индекс → (git commit) → история.", "git diff: рабочая ↔ индекс; git diff --staged: индекс ↔ последний коммит.", "Статусы: untracked, modified, staged; working tree clean.", "Индекс нужен для атомарных коммитов."]}], "cards": [{"q": "Назови три зоны Git.", "a": "Рабочая директория (working tree), индекс (staging area), история (коммиты в .git)."}, {"q": "git diff и git diff --staged?", "a": "git diff: рабочая директория против индекса; --staged: индекс против последнего коммита."}, {"q": "Зачем нужен индекс?", "a": "Собрать в коммит только нужные изменения (атомарный коммит) и проверить их."}, {"q": "Что значит working tree clean?", "a": "Нет незакоммиченных изменений и неотслеживаемых файлов."}, {"q": "Почему в начале нельзя git add .?", "a": "Задание требует добавлять по путям, чтобы увидеть разницу зон и не закоммитить мусор."}]}, {"id": "t5l3", "title": "Как Git устроен внутри: хеши и указатели", "min": 15, "steps": [{"t": "intro", "h": "Заглянем в .git", "body": "<p>Почему ветку в Git создать мгновенно? Почему историю нельзя тихо подменить? Всё следует из того, как Git хранит данные. Разберём на твоём репозитории.<\/p>"}, {"t": "word", "term": "Хеш", "node": "hash", "pt": "SHA-1 · хеш", "simple": "Короткий «отпечаток» содержимого: из любых данных вычисляется 40-символьное число. Одинаковые данные дают одинаковый хеш, любое изменение даёт совсем другой.", "like": "Отпечаток пальца у файла: по нему файл узнаётся, а подделать отпечаток невозможно.", "ex": "<code>printf 'hello\\n' | git hash-object --stdin<\/code> всегда даёт <code>ce013625...<\/code>, на любом компьютере. Имена коммитов вроде <code>72ec40d<\/code> это начала хешей.", "pro": "<p><b>hash<\/b>, <b>hash function<\/b>; Git использует <b>SHA-1<\/b> (переходит на SHA-256). Хранение, где имя объекта это хеш его содержимого, называют <b>content-addressable storage<\/b>.<\/p>"}, {"t": "word", "term": "Объекты Git", "node": "objects", "pt": "blob · tree · commit", "simple": "Git хранит всё как объекты трёх видов: содержимое файла, содержимое папки и коммит. Имя каждого объекта это хеш его содержимого.", "like": "Склад, где у каждой коробки на этикетке её отпечаток: «книга», «полка с книгами», «фото всего шкафа с подписью».", "ex": "<b>blob<\/b> это содержимое файла (без имени). <b>tree<\/b> это папка: список имён и хешей. <b>commit<\/b> это хеш корневого tree, хеш родителя, автор, сообщение.", "pro": "<p><b>object database<\/b>; ещё бывает объект <b>tag<\/b> (аннотированный тег). Посмотреть любой объект: <code>git cat-file -p хеш<\/code>.<\/p>"}, {"t": "do", "h": "Посмотри свой последний коммит изнутри", "task": "Выведи объект коммита и его дерево.", "cmd": "cd ~/Documents/vpd/lab01/dev && git cat-file -p HEAD && git cat-file -p 'HEAD^{tree}' | head -6", "look": "Строки tree, parent, author и сообщение; потом список «blob/tree хеш имя».", "explain": "<p>Коммит это несколько строк текста: хеш дерева, хеш родителя, автор, сообщение. Дерево это список файлов и папок с хешами. Вот и вся история: цепочка таких записей.<\/p>"}, {"t": "predict", "q": "Ты поменял один байт в файле из старого коммита. Что станет с хешами?", "o": ["Изменится только хеш этого файла", "Изменятся хеш файла, хеш папки, хеш коммита и хеши всех следующих коммитов", "Ничего не изменится", "Изменится только последний коммит"], "a": 1, "reveal": "<p>Хеш blob изменится, значит изменится tree (там записан хеш blob), значит коммит (там хеш tree), а каждый следующий коммит хранит хеш родителя. Поэтому историю нельзя тихо подменить: любой с копией увидит несовпадение. Та же идея лежит в основе блокчейна.<\/p>"}, {"t": "word", "term": "Ветка как указатель", "node": "branchptr", "pt": "branch · ref", "simple": "Ветка это просто маленький файл, в котором записан хеш одного коммита. При новом коммите в него записывается новый хеш.", "like": "Закладка в книге истории: её можно переложить, сама книга от этого не меняется.", "ex": "<code>cat .git/refs/heads/main<\/code> выдаст 40 символов, хеш последнего коммита main.", "pro": "<p><b>branch<\/b>; такие указатели называют <b>ref<\/b> (reference). Поэтому создать ветку в Git мгновенно: записать 41 байт, ничего не копируя.<\/p>"}, {"t": "word", "term": "HEAD", "node": "head", "pt": "HEAD", "simple": "Указатель «где я сейчас»: обычно содержит имя текущей ветки.", "like": "Табличка «вы здесь» на схеме торгового центра.", "ex": "<code>cat .git/HEAD<\/code> выдаст <code>ref: refs/heads/main<\/code>. В графе истории <code>HEAD -&gt; main<\/code>.", "pro": "<p>Если HEAD указывает прямо на коммит, а не на ветку, это <b>detached HEAD<\/b> (например после <code>git switch --detach v1.0.0<\/code>).<\/p>"}, {"t": "do", "h": "Ветка это файл, докажи", "task": "В своей лабе посмотри HEAD и ветку.", "cmd": "cd ~/Documents/vpd/lab01/dev && cat .git/HEAD && cat .git/refs/heads/main && git rev-parse HEAD", "look": "<code>ref: refs/heads/main<\/code> и дважды один и тот же хеш.", "explain": "<p>HEAD указывает на ветку main, а файл ветки содержит хеш коммита. <code>git rev-parse HEAD<\/code> делает то же самое за тебя: превращает имя в хеш.<\/p>"}, {"t": "idea", "h": "Что физически делают add и commit", "body": "<ul><li><code>git add f<\/code>: прочитать файл, записать его содержимое как blob в <code>.git/objects<\/code>, обновить строку f в индексе. Объект появляется <b>уже на add<\/b>.<\/li><li><code>git commit<\/code>: построить tree-объекты из индекса, создать commit-объект (tree, родитель = текущий HEAD, сообщение) и записать его хеш в файл текущей ветки.<\/li><\/ul><p>Два файла с одинаковым текстом дадут <b>один<\/b> blob: имя это хеш содержимого. Поэтому снимки не раздувают репозиторий.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> одинаковое содержимое хранится один раз: <b>дедупликация<\/b>. Для экономии Git ещё упаковывает объекты в <b>packfile<\/b> с дельта-сжатием.<\/p>"}, {"t": "check", "q": "Почему <code>git commit --amend<\/code> меняет хеш коммита?", "o": ["Так красиво", "Хеш вычисляется от содержимого коммита, а сообщение (и время) изменились", "Из-за push", "Он не меняет"], "a": 1, "why": "Новое содержимое значит новый объект и новый хеш. Старый остаётся в базе, его помнит git reflog."}, {"t": "why", "q": "Почему создание ветки в Git мгновенное и почему нельзя незаметно поменять старый коммит?", "model": "Ветка это файл с хешем коммита: создать её значит записать 41 байт, ничего не копируя, потому что все объекты уже лежат в базе. Имя каждого объекта это хеш его содержимого, а коммит содержит хеш дерева и хеш родителя; изменение старого файла меняет хеши blob, tree, коммита и всех следующих коммитов, поэтому подмена сразу видна."}, {"t": "pro", "simple": "Git хранит всё в коробках, подписанных отпечатком содержимого; ветка это бумажка с отпечатком нужного сохранения, а «вы здесь» указывает на ветку.", "terms": ["content-addressable storage", "SHA-1 / хеш", "blob / tree / commit", "ref", "HEAD"], "model": "Git это content-addressable storage: объекты blob, tree и commit адресуются SHA-1 хешем содержимого. Ветка это ref на хеш коммита, а HEAD указывает на текущую ветку."}, {"t": "sum", "items": ["Хеш это отпечаток содержимого; одинаковое содержимое даёт одинаковый хеш.", "Объекты: blob (файл), tree (папка), commit (снимок + родитель + сообщение).", "Ветка это файл с хешем коммита; HEAD указывает на текущую ветку.", "Изменение старого коммита меняет все последующие хеши, поэтому история защищена.", "amend и rebase создают новые коммиты, а не меняют старые."]}], "cards": [{"q": "Что такое хеш в Git?", "a": "SHA-1 отпечаток содержимого объекта; имя объекта."}, {"q": "Какие объекты хранит Git?", "a": "blob (содержимое файла), tree (папка), commit (снимок + родитель + метаданные), tag."}, {"q": "Что такое ветка физически?", "a": "Файл .git/refs/heads/имя с хешем коммита (ref)."}, {"q": "Что такое HEAD?", "a": "Указатель на текущую ветку (ref: refs/heads/main); detached HEAD указывает прямо на коммит."}, {"q": "Когда появляется blob файла?", "a": "Уже при git add."}, {"q": "Почему нельзя тихо подменить историю?", "a": "Каждый коммит хранит хеш родителя; изменение меняет хеши всей последующей цепочки."}]}, {"id": "t5l4", "title": ".gitignore: что не хранить", "min": 10, "steps": [{"t": "intro", "h": "Не всё в папке проекта должно попасть в историю", "body": "<p>После сборки в папке появились бинарники, .class, bin/, obj/. Их нельзя коммитить. Почему, и как сказать Git, чтобы он их не замечал?<\/p>"}, {"t": "word", "term": ".gitignore", "node": "gitignore", "pt": ".gitignore · ignore patterns", "simple": "Файл со списком того, что Git должен не замечать: правил-шаблонов для имён файлов и папок.", "like": "Список «это не моё, не трогать» на двери кладовки.", "ex": "<code>c/main<\/code> (конкретный файл), <code>*.class<\/code> (все .class), <code>bin/<\/code> (все папки bin), строки с <code>#<\/code> это комментарии.", "pro": "<p>Шаблоны называют <b>glob patterns<\/b>: <code>*<\/code> любые символы, слэш в конце значит «только папки». Проверить, какое правило сработало: <code>git check-ignore -v путь<\/code>.<\/p>"}, {"t": "idea", "h": "Главное правило", "body": "<p>В Git храним то, что <b>нельзя получить заново<\/b>: исходники, документацию, файлы проекта (.csproj, .fsproj). Не храним то, что <b>получается сборкой<\/b>, и то, что относится к твоему компьютеру.<\/p><p>Почему не хранить сборку:<\/p><ul><li>её можно восстановить командой сборки;<\/li><li>бинарники зависят от платформы: твой ELF бесполезен у одногруппника на Windows;<\/li><li>они меняются при каждой пересборке и дают шум и конфликты;<\/li><li>бинарники нельзя нормально сравнить через diff, а история от них раздувается.<\/li><\/ul><p class=\"pro\"><b>Как говорят профи:<\/b> результаты сборки это <b>артефакты<\/b> (build artifacts); правило звучит как «не коммить артефакты сборки, коммить то, из чего они собираются».<\/p>"}, {"t": "idea", "h": "Твой .gitignore построчно", "body": "<div class=\"tbl\"><table><tr><th>Строка<\/th><th>Что это и почему<\/th><\/tr><tr><td><code>c/main<\/code>, <code>cpp/main<\/code>, <code>rust/main<\/code><\/td><td>бинарники; у Linux-бинарников нет расширения, поэтому точные пути<\/td><\/tr><tr><td><code>*.o<\/code>, <code>asm/assembler<\/code><\/td><td>объектный файл от as и бинарник после линковки<\/td><\/tr><tr><td><code>*.class<\/code><\/td><td>байт-код Java от javac<\/td><\/tr><tr><td><code>bin/<\/code>, <code>obj/<\/code><\/td><td>результаты dotnet build: .dll и промежуточные файлы<\/td><\/tr><tr><td><code>typescript/dist/<\/code>, <code>node_modules/<\/code><\/td><td>JS от tsc; скачанные npm-пакеты (ставятся заново через npm install)<\/td><\/tr><tr><td><code>__pycache__/<\/code><\/td><td>кэш байт-кода Python<\/td><\/tr><tr><td><code>*.swp<\/code>, <code>*.swo<\/code>, <code>*~<\/code><\/td><td>временные файлы Neovim, относятся к твоему компу<\/td><\/tr><tr><td>(нет у тебя) <code>.DS_Store<\/code>, <code>Thumbs.db<\/code>, <code>desktop.ini<\/code>, <code>*.exe<\/code><\/td><td>мусор macOS и Windows и бинарники Windows: у одногруппников на других ОС<\/td><\/tr><\/table><\/div>"}, {"t": "predict", "q": "Почему <code>csharp.csproj<\/code> не в .gitignore, а <code>csharp/bin/<\/code> в нём?", "o": ["csproj маленький", "csproj это описание проекта, без него не собрать; bin/ это результат сборки", "bin/ секретный", "Ошибка в .gitignore"], "a": 1, "reveal": "<p>Одно правило: из чего собирается, храним; что получается, нет.<\/p>"}, {"t": "do", "h": "Проверь, кто что игнорирует", "task": "Спроси Git, почему бинарник и .class не попадают в статус.", "cmd": "cd ~/Documents/vpd/lab01/dev && git check-ignore -v c/main java/Main.class && git status --ignored --short | head", "look": "<code>.gitignore:2:c/main<\/code> и <code>.gitignore:11:*.class<\/code>; список игнорируемых с <code>!!<\/code>.", "explain": "<p>Команда показывает файл, номер строки и правило. Если вдруг файл не игнорируется, так легко найти причину.<\/p>"}, {"t": "check", "q": "Бинарник c/main уже закоммичен. Ты добавил c/main в .gitignore. Что будет?", "o": ["Git сам удалит его из истории", "Ничего: .gitignore не действует на уже отслеживаемые файлы, нужен git rm --cached c/main", "Файл удалится с диска", "Коммит откатится"], "a": 1, "why": "git rm --cached перестанет отслеживать файл, оставив его на диске; потом коммит."}, {"t": "why", "q": "Препод показывает на *.class в .gitignore: «Почему не храним? А если у человека нет javac?»", "model": "*.class это байт-код, который javac генерирует из Main.java, он полностью восстанавливается сборкой. Хранить его значит дублировать исходник в бинарном виде: он меняется при каждой пересборке, не сравнивается в diff и раздувает историю. Чтобы запустить Java-программу, всё равно нужна Java, а исходник и команда сборки в README позволяют любому получить .class."}, {"t": "pro", "simple": "В истории только то, из чего собирается проект; всё, что получается после сборки, и мусор редактора я исключил списком шаблонов.", "terms": ["исходники", "артефакты сборки", "ignore patterns", "git check-ignore"], "model": "В репозитории только исходники и файлы проекта; артефакты сборки и мусор редактора исключены glob-шаблонами в .gitignore, проверка через git check-ignore -v."}, {"t": "sum", "items": [".gitignore перечисляет шаблоны того, что Git не замечает.", "Храним исходники и файлы проекта, не храним артефакты сборки и мусор ОС/редактора.", ".gitignore не действует на уже закоммиченное: нужен git rm --cached.", "git check-ignore -v показывает, какое правило сработало."]}], "cards": [{"q": "Главное правило .gitignore?", "a": "Не храним то, что получается сборкой (артефакты) и относится к компу; храним исходники и файлы проекта."}, {"q": "Зачем bin/ и obj/ в .gitignore?", "a": "Результаты dotnet build, пересоздаются при сборке."}, {"q": "Почему c/main без звёздочки?", "a": "У Linux-бинарников нет расширения, поэтому они указаны путями."}, {"q": "Если файл уже закоммичен, а потом попал в .gitignore?", "a": "Он продолжит отслеживаться; нужно git rm --cached файл и коммит."}, {"q": "Как узнать, почему файл игнорируется?", "a": "git check-ignore -v путь."}]}, {"id": "t5l5", "title": "Практика: Git изнутри сам", "min": 12, "steps": [{"t": "intro", "h": "Песочница", "body": "<p>Все задания в отдельной папке <code>/tmp/gp<\/code>, лаба не страдает.<\/p>"}, {"t": "task", "h": "Три зоны вживую", "goal": "Создай репозиторий с веткой main, создай файл, добавь в индекс, после этого измени файл ещё раз. Добейся, чтобы git status --short показал AM, и объясни обе буквы.", "hint": "git init -b main; status --short: первая колонка индекс, вторая рабочая директория.", "solution": "<pre>rm -rf /tmp/gp &amp;&amp; mkdir /tmp/gp &amp;&amp; cd /tmp/gp &amp;&amp; git init -q -b main\necho hi &gt; a.txt &amp;&amp; git add a.txt &amp;&amp; echo more &gt;&gt; a.txt\ngit status --short<\/pre><p>A: файл добавлен в индекс; M: после add изменён в рабочей директории.<\/p>"}, {"t": "task", "h": "Докажи дедупликацию", "goal": "Сделай два файла с одинаковым текстом, добавь оба в индекс и покажи, что у них один и тот же хеш blob и в базе один объект для них.", "hint": "git ls-files -s показывает хеши в индексе; find .git/objects -type f считает объекты.", "solution": "<pre>cd /tmp/gp &amp;&amp; echo same &gt; x.txt &amp;&amp; cp x.txt y.txt &amp;&amp; git add x.txt y.txt\ngit ls-files -s<\/pre><p>У x.txt и y.txt одинаковый хеш: содержимое одно, значит объект один.<\/p>"}, {"t": "task", "h": "Ветка это файл", "goal": "Сделай коммит и создай ветку experiment, не используя git branch и git switch, а записав нужное прямо в .git. Проверь через git branch.", "hint": "Ветка это файл в .git/refs/heads с хешем коммита; хеш текущего коммита даёт git rev-parse HEAD.", "solution": "<pre>cd /tmp/gp &amp;&amp; git -c user.name=T -c user.email=t@t commit -qm first\ngit rev-parse HEAD &gt; .git/refs/heads/experiment\ngit branch<\/pre><p>В списке появится experiment: ты создал ветку, просто записав хеш в файл.<\/p>"}, {"t": "task", "h": "Коммит без add", "goal": "Измени уже отслеживаемый файл и закоммить его одной командой без отдельного git add. Потом создай новый файл и проверь, попадёт ли он так же.", "hint": "У git commit есть флаг, который сам добавляет изменённые отслеживаемые файлы.", "solution": "<pre>echo change &gt;&gt; a.txt &amp;&amp; git -c user.name=T -c user.email=t@t commit -qam \"Update a\"\necho new &gt; n.txt &amp;&amp; git -c user.name=T -c user.email=t@t commit -qam \"Try new\"; git status --short<\/pre><p>Изменение a.txt закоммичено; n.txt остался <code>??<\/code>: <code>-a<\/code> берёт только отслеживаемые файлы. Так ты делал коммиты Status в лабе.<\/p>"}, {"t": "sum", "items": ["Ты сам увидел три зоны, дедупликацию, ветку-файл и разницу commit -am и git add."]}], "cards": [{"q": "Что делает git commit -am?", "a": "Сам добавляет изменённые отслеживаемые файлы и коммитит; новые файлы не берёт."}, {"q": "Что значит AM в git status --short?", "a": "A: файл в индексе; M: изменён после add."}], "opt": true}], "defense": true}, {"id": "t6", "title": "Git: совместная работа и релиз", "role": "Сервер и клоны, push и pull, ветки и слияние, конфликт, тег версии и как читать граф твоей лабы.", "link": "проект живёт не только у тебя: есть сервер, второй разработчик и версии", "map": {"lead": "Сверху где лежат копии проекта. Ниже как они обмениваются. Ещё ниже параллельная работа и её слияние. Внизу как отмечают версию.", "rows": [{"label": "Где копии", "nodes": ["remote", "bare", "clone"], "arrow": "обмениваются коммитами"}, {"label": "Обмен", "nodes": ["push", "fetchpull", "tracking"], "arrow": "работу делают параллельно"}, {"label": "Параллельная работа", "nodes": ["branch2", "merge", "ff", "conflict", "markers", "rebase"], "arrow": "готовую версию отмечают"}, {"label": "Релиз", "nodes": ["tag", "semver", "changelog"], "arrow": ""}]}, "lessons": [{"id": "t6l1", "title": "Сервер, клон, push и pull", "min": 15, "steps": [{"t": "intro", "h": "Как устроено в лабе", "body": "<p>В лабе три папки: <code>origin.git<\/code> (изображает сервер вроде GitHub), <code>dev<\/code> (ты) и <code>second_dev<\/code> (второй разработчик). Разберём, как они связаны.<\/p>"}, {"t": "word", "term": "Удалённый репозиторий", "node": "remote", "pt": "remote · origin", "simple": "Другая копия репозитория, с которой твоя копия обменивается коммитами. Обычно это сервер.", "like": "Общая библиотека, куда все сдают и откуда все берут книги.", "ex": "У тебя remote с именем <code>origin<\/code> указывает на папку <code>origin.git<\/code>. Посмотреть: <code>git remote -v<\/code>.", "pro": "<p><b>remote<\/b>; имя <b>origin<\/b> это просто соглашение для «основного» remote. В реальной жизни это GitHub, GitLab. Говорят «запушь в origin», «добавь remote».<\/p>"}, {"t": "word", "term": "Bare-репозиторий", "node": "bare", "pt": "bare repository", "simple": "Репозиторий без рабочих файлов, только с историей (то, что обычно лежит в .git). В него не работают, в него отправляют.", "like": "Склад библиотеки: книги хранятся, но никто там не читает и не пишет.", "ex": "<code>git init --bare --initial-branch=main origin.git<\/code>. Загляни: <code>ls ~/Documents/vpd/lab01/origin.git<\/code> покажет HEAD, objects, refs, но не файлы лабы.", "pro": "<p><b>bare repository<\/b>. Так устроены репозитории на серверах. В обычный репозиторий Git не даст запушить в ветку, которая там сейчас открыта, чтобы не испортить чужие файлы. <code>--initial-branch=main<\/code> нужен, чтобы ветка по умолчанию была main, иначе пустой bare указывал бы на master, и второй клон оказался бы пустым.<\/p>"}, {"t": "word", "term": "Клон", "node": "clone", "pt": "git clone", "simple": "Полная копия репозитория со всей историей плюс рабочие файлы. Клон сразу помнит, откуда его скопировали.", "like": "Выдали тебе полный экземпляр библиотеки на дом, с адресом, куда сдавать новые книги.", "ex": "<code>git clone --no-hardlinks origin.git dev<\/code>. Флаг <code>--no-hardlinks<\/code> заставляет честно скопировать файлы истории (без него Git на одном диске экономит место ссылками), чтобы dev был полностью независим, как клон с настоящего сервера.", "pro": "<p><b>clone<\/b>; clone сам создаёт remote origin и связь локальной main с <code>origin/main<\/code>. Говорят «склонируй репо», «свежий клон».<\/p>"}, {"t": "idea", "h": "Страховка: git branch -M main", "body": "<p>В лабе сразу после клона была команда <code>git branch -M main<\/code>. Она <b>переименовывает<\/b> текущую ветку в main (<code>-M<\/code> значит принудительно, даже если main уже есть). Это страховка на случай, если Git по умолчанию создал ветку master. У тебя благодаря <code>--initial-branch=main<\/code> ветка и так была main, и команда ничего не поменяла, но её требует задание.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> ветку по умолчанию задают настройкой <code>init.defaultBranch<\/code>; переход с master на main произошёл в индустрии около 2020 года.<\/p>"}, {"t": "word", "term": "Push", "node": "push", "pt": "git push · upstream", "simple": "Отправить свои новые коммиты в удалённый репозиторий.", "like": "Сдать новые книги в общую библиотеку.", "ex": "<code>git push -u origin main<\/code>: отправить ветку main в origin. <code>-u<\/code> запоминает связь, и дальше хватает просто <code>git push<\/code>.", "pro": "<p><b>push<\/b>, «запушить». Запомненную связь называют <b>upstream<\/b> (<code>-u<\/code> = <code>--set-upstream<\/code>). Теги обычным push не отправляются.<\/p>"}, {"t": "word", "term": "Fetch и pull", "node": "fetchpull", "pt": "git fetch · git pull", "simple": "fetch: скачать чужие новые коммиты, ничего не меняя в твоих файлах. pull: скачать и сразу объединить с твоей веткой.", "like": "fetch: посмотреть, что нового в библиотеке. pull: взять новое и сразу расставить у себя на полке.", "ex": "Во второй копии <code>git pull<\/code> забрал твою разрешённую версию README.", "pro": "<p>pull = fetch + <b>merge<\/b> (или rebase). <code>git pull --no-rebase<\/code> явно просит объединять через merge, так требовало задание.<\/p>"}, {"t": "word", "term": "Удалённая ветка-отметка", "node": "tracking", "pt": "origin/main · remote-tracking branch", "simple": "Запись у тебя о том, где была ветка на сервере, когда ты последний раз с ним общался.", "like": "Пометка в блокноте: «на складе на прошлой неделе было вот это».", "ex": "В графе истории видно <code>origin/main<\/code> и <code>origin/feature/⟦br⟧<\/code>. Двигаются только при fetch, pull и push.", "pro": "<p><b>remote-tracking branch<\/b>. <code>git status<\/code> сравнивает с ней: «Your branch is up to date with 'origin/main'» или «ahead / behind / diverged».<\/p>"}, {"t": "predict", "q": "Ты сделал коммит в dev, а second_dev уже запушил свой в origin. Что скажет <code>git push<\/code> из dev?", "o": ["Всё отправит", "Откажет: rejected (fetch first)", "Удалит коммит second_dev", "Спросит пароль"], "a": 1, "reveal": "<p>На сервере есть коммит, которого нет у тебя. Если бы сервер передвинул ветку на твой коммит, чужой коммит выпал бы из истории. Поэтому сначала забираешь чужое (pull), объединяешь, и только потом push. Подробно в уроке про слияние.<\/p>"}, {"t": "do", "h": "Посмотри связи своей лабы", "task": "Удалённые репозитории и состояние ветки.", "cmd": "cd ~/Documents/vpd/lab01/dev && git remote -v && git status -sb | head -1 && ls ../origin.git", "look": "Адрес origin, строка <code>## main...origin/main<\/code>, внутренности bare-репозитория.", "explain": "<p>Строка <code>main...origin/main<\/code> без «ahead/behind» значит, что ты синхронизирован с сервером. В origin.git нет ни README, ни кода: это bare. Кроме origin у тебя есть второй remote, <code>github<\/code>: так ты выложил лабу на GitHub. У репозитория может быть сколько угодно remote'ов, каждый со своим именем.<\/p>"}, {"t": "why", "q": "Зачем в лабе bare-репозиторий origin.git, а не сразу GitHub? И что делает git clone?", "model": "origin.git изображает сервер локально: это bare-репозиторий без рабочих файлов, только история, как на настоящем сервере. В него пушат из dev, а second_dev забирает изменения через pull. Так можно отработать clone, push, pull и конфликт без интернета. git clone копирует всю историю, создаёт рабочие файлы, настраивает remote origin и связь main с origin/main."}, {"t": "pro", "simple": "У меня копия проекта со всей историей, она помнит адрес общего склада; новые сохранения я отправил на склад и попросил запомнить связь.", "terms": ["clone", "remote origin", "push -u / upstream", "bare repository"], "model": "Работаю в клоне, у которого remote origin указывает на bare-репозиторий; коммиты отправил git push -u origin main, тем самым настроив upstream."}, {"t": "sum", "items": ["remote это другая копия репозитория; origin основной по договорённости.", "bare: только история, без рабочих файлов; так устроены серверы.", "clone копирует историю и настраивает origin; --no-hardlinks делает копию независимой.", "push отправляет, fetch скачивает, pull скачивает и сливает.", "origin/main это отметка, где ветка была на сервере."]}], "cards": [{"q": "Что такое remote и origin?", "a": "Удалённая копия репозитория; origin это имя основной по соглашению."}, {"q": "Что такое bare-репозиторий?", "a": "Репозиторий без рабочих файлов, только история; в него пушат."}, {"q": "Зачем --no-hardlinks при clone?", "a": "Копировать объекты, а не связывать ссылками, чтобы клон был независим."}, {"q": "fetch против pull?", "a": "fetch только скачивает; pull скачивает и сливает с текущей веткой."}, {"q": "Что делает -u в git push -u origin main?", "a": "Запоминает upstream, дальше хватает git push / git pull."}, {"q": "Что такое origin/main?", "a": "Remote-tracking branch: где была main на сервере при последнем обмене."}]}, {"id": "t6l2", "title": "Ветки и слияние", "min": 15, "steps": [{"t": "intro", "h": "Делать фичу отдельно", "body": "<p>⟦BR⟧ ты делал в отдельной ветке <code>feature/⟦br⟧<\/code> (⟦N⟧ mod 5 = ⟦NMOD⟧). Зачем ветки и как они сливаются обратно?<\/p>"}, {"t": "word", "term": "Ветка (для работы)", "node": "branch2", "pt": "branch · feature branch", "simple": "Отдельная линия работы. Можно делать изменения, не трогая основную линию, а потом влить их обратно.", "like": "Черновик на отдельном листе: экспериментируешь сколько угодно, а в чистовик переносишь, когда готово.", "ex": "<code>git switch -c feature/⟦br⟧<\/code> создаёт ветку и переходит на неё. <code>git switch main<\/code> возвращает на main, и папка ⟦br⟧/ пропадает с диска: в main её ещё нет.", "pro": "<p><b>feature branch<\/b>; основную ветку называют <b>main<\/b> (раньше master). Старый вариант команды: <code>git checkout -b<\/code>. Вспомни урок про устройство Git: ветка это файл с хешем, поэтому она мгновенная.<\/p>"}, {"t": "word", "term": "Слияние", "node": "merge", "pt": "merge · merge commit", "simple": "Объединить изменения из одной ветки в другую.", "like": "Перенести всё из черновика в чистовик.", "ex": "<code>git switch main<\/code>, затем <code>git merge feature/⟦br⟧<\/code>. У тебя получился коммит <code>fd22d8e Merge branch 'feature/⟦br⟧'<\/code> с <b>двумя родителями<\/b>.", "pro": "<p><b>merge<\/b>; коммит, объединяющий две линии, это <b>merge commit<\/b>. Флаг <code>--no-edit<\/code> принимает стандартное сообщение без редактора.<\/p>"}, {"t": "word", "term": "Fast-forward", "node": "ff", "pt": "fast-forward", "simple": "Простой случай слияния: если в основной ветке ничего не менялось, Git просто передвигает указатель вперёд, без нового коммита.", "like": "Если чистовик не трогали, черновик просто становится новым чистовиком.", "ex": "Если бы после создания feature/⟦br⟧ ты ничего не коммитил в main, merge был бы fast-forward. Но ты успел закоммитить ⟦MAIN_RU⟧, история разошлась, и получился merge-коммит.", "pro": "<p><b>fast-forward<\/b> (FF). Если история разошлась, нужен <b>трёхсторонний merge<\/b> (three-way merge), с общим предком.<\/p>"}, {"t": "idea", "h": "Трёхстороннее слияние: как Git решает, что брать", "body": "<p>Git берёт три версии: <b>общего предка<\/b> (последний общий коммит), <b>ours<\/b> (твоя ветка) и <b>theirs<\/b> (вливаемая). Для каждого куска файла:<\/p><div class=\"tbl\"><table><tr><th>предок<\/th><th>ours<\/th><th>theirs<\/th><th>результат<\/th><\/tr><tr><td>A<\/td><td>A<\/td><td>A<\/td><td>A, никто не менял<\/td><\/tr><tr><td>A<\/td><td>B<\/td><td>A<\/td><td>B, менял только ты<\/td><\/tr><tr><td>A<\/td><td>A<\/td><td>C<\/td><td>C, менял только другой<\/td><\/tr><tr><td>A<\/td><td>B<\/td><td>C<\/td><td><b>конфликт<\/b>: оба поменяли по-разному<\/td><\/tr><\/table><\/div><p>У ⟦BR⟧ конфликта не было: ветка добавила папку ⟦br⟧/, main добавила ⟦MAIN_DIRS⟧, разные файлы.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> общий предок это <b>merge base<\/b> (<code>git merge-base A B<\/code>).<\/p>"}, {"t": "predict", "q": "Почему слияние feature/⟦br⟧ дало merge-коммит, а не fast-forward?", "o": ["Так всегда", "После создания ветки в main появился коммит с ⟦MAIN_RU⟧, история разошлась", "Из-за конфликта", "Из-за флага -u"], "a": 1, "reveal": "<p>Fast-forward возможен, только если текущая ветка не ушла вперёд.<\/p>"}, {"t": "do", "h": "Посмотри ромб своей ветки", "task": "Найди в графе развилку ⟦BR⟧.", "cmd": "cd ~/Documents/vpd/lab01/dev && git log --oneline --graph --all | sed -n 8,14p && git cat-file -p fd22d8e | head -3", "look": "Ромб из <code>|\\<\/code> и <code>|/<\/code> и у коммита fd22d8e два <code>parent<\/code>.", "explain": "<p>Два родителя: 55121e9 (⟦MAIN_RU⟧ в main) и 6eb3d85 (⟦BR⟧ в ветке). Это и есть merge-коммит.<\/p>"}, {"t": "check", "q": "Что такое ветка в Git?", "o": ["Копия всех файлов", "Отдельная папка", "Подвижный указатель на коммит", "Удалённый репозиторий"], "a": 2, "why": "Поэтому ветки создаются мгновенно."}, {"t": "why", "q": "Расскажи по шагам, как ты делал ⟦BR⟧ в ветке и что получилось в истории.", "model": "⟦N⟧ mod 5 = ⟦NMOD⟧, поэтому язык ветки ⟦BR⟧. git switch -c feature/⟦br⟧ создал ветку, я добавил папку ⟦br⟧, закоммитил и запушил ветку в origin. git switch main вернул на main, где ⟦br⟧ ещё не было. В main я закоммитил ⟦MAIN_RU⟧, история разошлась. git merge feature/⟦br⟧ нашёл общего предка, изменения не пересекались, и Git создал merge-коммит с двумя родителями."}, {"t": "pro", "simple": "Я делал ⟦BR⟧ на отдельной линии работы, а потом объединил её с основной; так как основная за это время ушла вперёд, появилось сохранение с двумя предками.", "terms": ["feature branch", "merge", "merge commit", "fast-forward", "merge base"], "model": "⟦BR⟧ делал в feature branch, потом смержил в main. Fast-forward был невозможен, так как main ушёл вперёд, поэтому three-way merge от merge base дал merge commit с двумя parent."}, {"t": "sum", "items": ["Ветка это отдельная линия работы; switch -c создаёт и переключает.", "merge вливает ветку; fast-forward просто двигает указатель.", "Если история разошлась, three-way merge с общим предком и merge-коммит с двумя родителями.", "Кусок, изменённый обеими сторонами по-разному, даёт конфликт."]}], "cards": [{"q": "Что делает git switch -c имя?", "a": "Создаёт ветку от текущего коммита и переключается на неё."}, {"q": "Что такое fast-forward?", "a": "Слияние без нового коммита: указатель просто двигается вперёд, история не расходилась."}, {"q": "Сколько родителей у merge-коммита?", "a": "Два."}, {"q": "Что такое merge base?", "a": "Общий предок двух веток, от которого считается three-way merge."}, {"q": "Почему папка ⟦br⟧ пропала после git switch main?", "a": "Git привёл файлы к состоянию main, где ⟦BR⟧ ещё не было."}]}, {"id": "t6l3", "title": "Конфликт: второй разработчик", "min": 14, "steps": [{"t": "intro", "h": "Специально ломаем, чтобы научиться чинить", "body": "<p>Задание требовало создать конфликт: две копии меняют одну строку README по-разному. Пройдём, что происходило и что видел Git.<\/p>"}, {"t": "idea", "h": "Сценарий из лабы", "body": "<ol><li><code>git clone --no-hardlinks origin.git second_dev<\/code>: второй разработчик.<\/li><li>В dev строку Status поменял на «all 13 implementations done», коммит, <b>push не делал<\/b>.<\/li><li>В second_dev ту же строку на «ready for review», коммит, push.<\/li><li>В dev <code>git pull --no-rebase<\/code>: конфликт.<\/li><\/ol><p>По таблице трёхстороннего слияния: у предка «in progress», у тебя одно, у второго другое, оба поменяли по-разному.<\/p>"}, {"t": "word", "term": "Конфликт слияния", "node": "conflict", "pt": "merge conflict", "simple": "Ситуация, когда Git не может сам решить, какой вариант куска оставить, потому что обе стороны изменили его по-разному. Решает человек.", "like": "Два редактора поправили одно и то же предложение по-разному, и типография не знает, какое печатать.", "ex": "<code>CONFLICT (content): Merge conflict in README.md<\/code>, а <code>git status<\/code> пишет <code>both modified: README.md<\/code>.", "pro": "<p><b>merge conflict<\/b>; разрешить это <b>resolve<\/b>. Во время конфликта в индексе лежат <b>три версии<\/b> файла: стадия 1 (предок), 2 (ours), 3 (theirs), их можно посмотреть через <code>git show :1:README.md<\/code> и т.д.<\/p>"}, {"t": "word", "term": "Маркеры конфликта", "node": "markers", "pt": "<<<<<<< ======= >>>>>>>", "simple": "Git вписывает в файл оба варианта, разделяя их метками, и ждёт, что ты оставишь правильный текст.", "like": "Редактор выделил спорное место: «вариант А / вариант Б, выберите».", "ex": "<pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD\n**Status:** all 13 implementations done\n=======\n**Status:** ready for review\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; 7777f55...<\/pre>Выше <code>=======<\/code> твой вариант (HEAD), ниже вариант, который вливается.", "pro": "<p><b>conflict markers<\/b>. ours это текущая ветка (HEAD), theirs вливаемая. Готовый текст без маркеров иногда называют результатом <b>ручного мержа<\/b>.<\/p>"}, {"t": "predict", "q": "Как сказать Git, что конфликт в README.md разрешён?", "o": ["git resolve README.md", "Убрать маркеры, git add README.md, потом git commit", "git push --force", "Удалить файл"], "a": 1, "reveal": "<p><code>git add<\/code> на конфликтном файле значит «разрешено». Затем <code>git commit<\/code> (у тебя <code>--no-edit<\/code>) создаёт merge-коммит, потом <code>git push<\/code>. В second_dev <code>git pull<\/code> получает итог.<\/p>"}, {"t": "idea", "h": "Почему push сначала отклоняют", "body": "<p>Push просит сервер передвинуть ветку на твой коммит. Если на сервере есть коммит, которого нет в твоей истории, передвижение выкинуло бы его. Сервер принимает только «движение вперёд» (fast-forward). Поэтому: pull, слить, потом push, и теперь твой merge-коммит потомок обоих.<\/p><p><code>git push --force<\/code> двигает всё равно, и чужие коммиты пропадают из ветки. Поэтому в общих ветках его не используют.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> «форс-пуш в main запрещён», «ветка защищена» (protected branch).<\/p>"}, {"t": "word", "term": "Merge и rebase", "node": "rebase", "pt": "rebase · --no-rebase", "simple": "Два способа объединить свою работу с чужой: merge оставляет обе линии и добавляет коммит-слияние; rebase переписывает твои коммиты так, будто ты начал после чужих.", "like": "merge: в книге видно две главы и раздел «как мы их объединили». rebase: книгу переписали, будто писали подряд.", "ex": "Задание требует <code>git pull --no-rebase<\/code>, чтобы в графе был виден merge-коммит с конфликтом.", "pro": "<p>rebase даёт <b>линейную историю<\/b>, но коммиты получают <b>новые хеши<\/b>. Правило: не делать rebase уже отправленных коммитов.<\/p>"}, {"t": "do", "h": "Посмотри итог конфликта", "task": "Найди в графе второй ромб и итоговую строку Status.", "cmd": "cd ~/Documents/vpd/lab01/dev && git log --oneline --graph -6 && grep Status README.md && git merge-base 8a620c6 7777f55", "look": "Ромб cae5b7f, строка «all 13 implementations done, ready for review», общий предок 6c29f17.", "explain": "<p>Ты объединил оба варианта в одну строку. Общий предок 6c29f17, коммит, в котором Status ещё был «in progress».<\/p>"}, {"t": "check", "q": "Что между <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD<\/code> и <code>=======<\/code>?", "o": ["Вариант origin", "Общий предок", "Твой вариант (текущая ветка)", "Сообщение коммита"], "a": 2, "why": "HEAD это то, где ты стоишь."}, {"t": "why", "q": "Почему возник конфликт и как ты его разрешил? Ответь как на защите.", "model": "Я сделал второй клон second_dev, чтобы изобразить второго разработчика. В dev и second_dev по-разному поменял одну строку README (Status) и закоммитил; second_dev запушил первым. В dev git pull --no-rebase попытался слить истории, но обе стороны изменили одну строку относительно общего предка, и Git записал оба варианта с маркерами. Я вручную оставил одну строку, удалил маркеры, git add README.md, git commit, получился merge-коммит, потом git push, а в second_dev git pull получил итог."}, {"t": "pro", "simple": "Две копии поменяли одну строку по-разному; сервер не принял мою отправку, я забрал чужое, вручную выбрал итоговый текст и сохранил объединение.", "terms": ["merge conflict", "rejected (non-fast-forward)", "git pull --no-rebase", "resolve", "merge commit"], "model": "Push отклонили как non-fast-forward; git pull --no-rebase дал merge conflict в README; зарезолвил вручную, git add и commit создали merge commit, затем push."}, {"t": "sum", "items": ["Конфликт: обе стороны изменили один кусок по-разному.", "Маркеры: выше ======= ours (HEAD), ниже theirs.", "Разрешение: убрать маркеры → git add → git commit → git push.", "Сервер принимает push только как fast-forward; --force опасен.", "merge сохраняет историю, rebase переписывает (новые хеши)."]}], "cards": [{"q": "Когда возникает конфликт?", "a": "Обе ветки по-разному изменили один кусок относительно общего предка."}, {"q": "Что значат маркеры <<<<<<<, =======, >>>>>>>?", "a": "Начало и твой вариант (HEAD), разделитель, конец и вливаемый вариант."}, {"q": "Как завершить разрешение конфликта?", "a": "Убрать маркеры, git add файл, git commit, git push."}, {"q": "Почему push отклоняют?", "a": "Сервер принимает только fast-forward; иначе пропали бы чужие коммиты."}, {"q": "merge против rebase?", "a": "merge сохраняет коммиты и добавляет merge-коммит; rebase переписывает свои коммиты поверх чужих (новые хеши)."}, {"q": "Как отменить начатое слияние?", "a": "git merge --abort."}]}, {"id": "t6l4", "title": "Версия, тег, CHANGELOG, README", "min": 12, "steps": [{"t": "intro", "h": "Отметить готовую версию", "body": "<p>Последний шаг Git-части: оформить первую законченную версию 1.0.0. Для этого CHANGELOG и тег.<\/p>"}, {"t": "word", "term": "Семантическая версия", "node": "semver", "pt": "SemVer · MAJOR.MINOR.PATCH", "simple": "Номер версии из трёх чисел: большие несовместимые изменения, новые возможности, исправления.", "like": "Номер издания книги: новое издание (1.0 → 2.0), дополненное (1.0 → 1.1), с исправленными опечатками (1.0.0 → 1.0.1).", "ex": "1.0.0 это первая законченная версия. Добавишь 14-й язык, будет 1.1.0. Исправишь опечатку в выводе, будет 1.0.1.", "pro": "<p><b>SemVer<\/b> (semantic versioning): <b>MAJOR<\/b>.<b>MINOR<\/b>.<b>PATCH<\/b>. Задание говорит, что глубже схемы версионирования разберут позже.<\/p>"}, {"t": "word", "term": "CHANGELOG", "node": "changelog", "pt": "CHANGELOG.md", "simple": "Файл со списком, что изменилось в каждой версии, для людей.", "like": "Раздел «что нового» в обновлении приложения.", "ex": "У тебя разделы <code>[1.0.0]<\/code> с Added и Changed и <code>[Unreleased]<\/code>: скрины в README добавлены после версии.", "pro": "<p>Популярный формат <b>Keep a Changelog<\/b>: разделы Added, Changed, Fixed, Removed и Unreleased.<\/p>"}, {"t": "word", "term": "Тег", "node": "tag", "pt": "annotated tag · git tag -a", "simple": "Неподвижная метка на конкретном коммите. В отличие от ветки, не двигается при новых коммитах.", "like": "Закладка, вклеенная намертво: «вот здесь вышло первое издание».", "ex": "<code>git tag -a v1.0.0 -m \"VPD Lab 01 release\"<\/code>, потом <code>git push origin v1.0.0<\/code>. Обычный push теги не отправляет.", "pro": "<p><code>-a<\/code> делает <b>аннотированный тег<\/b> (annotated tag): отдельный объект с автором, датой и сообщением. Без <code>-a<\/code> получился бы <b>лёгкий тег<\/b> (lightweight), просто имя для коммита. Для релизов используют аннотированные.<\/p>"}, {"t": "predict", "q": "После тега v1.0.0 ты добавил коммит со скринами. Где теперь тег?", "o": ["Передвинулся на новый коммит", "Остался на старом коммите", "Удалился", "Раздвоился"], "a": 1, "reveal": "<p>Тег не двигается, в этом его смысл. Ветка main ушла вперёд, а v1.0.0 навсегда указывает на ту же версию. Поэтому скрины записаны в CHANGELOG в раздел Unreleased.<\/p>"}, {"t": "do", "h": "Посмотри тег изнутри", "task": "Тег это объект с автором и сообщением.", "cmd": "cd ~/Documents/vpd/lab01/dev && git tag && git cat-file -p v1.0.0", "look": "<code>v1.0.0<\/code>; строки object, type commit, tag, tagger и сообщение.", "explain": "<p>Аннотированный тег это отдельный объект в базе Git, он указывает на коммит a16919d.<\/p>"}, {"t": "idea", "h": "README и Markdown", "body": "<p>README.md это лицо проекта: GitHub показывает его на главной странице. Пишется в <b>Markdown<\/b>: <code># Заголовок<\/code>, <code>**жирный**<\/code>, <code>- список<\/code>, <code>`код`<\/code> (inline-code), блок кода в тройных обратных кавычках (fenced code block), таблицы через <code>|<\/code>, картинки <code>![](путь)<\/code>.<\/p><p>Задание требует в README: заголовок, ФИО/группу/номер, цель, список языков, таблицу «язык, версия, команда», inline-code и fenced block, пример вывода, кириллицу в C/C++, описание ассемблера (ОС, архитектура, toolchain, команды). Всё это у тебя есть.<\/p><p class=\"pro\"><b>Как говорят профи:<\/b> Markdown это <b>язык разметки<\/b> (markup language); «оформи доку в маркдауне», «добавь бейджи в ридми».<\/p>"}, {"t": "check", "q": "Чем тег отличается от ветки?", "o": ["Ничем", "Тег навсегда на одном коммите, ветка двигается с новыми коммитами", "Тег нельзя отправить", "Ветка только для релизов"], "a": 1, "why": "Поэтому тегами отмечают версии."}, {"t": "why", "q": "Что значит 1.0.0 и зачем тег, если есть история коммитов?", "model": "1.0.0 это семантическая версия MAJOR.MINOR.PATCH, первая законченная версия. Тег это неподвижная именованная метка на коммите этой версии: по ней всегда можно найти и получить ровно то состояние проекта, даже когда ветка ушла вперёд. Аннотированный тег хранит ещё автора, дату и сообщение."}, {"t": "pro", "simple": "Я отметил первую готовую версию неподвижной меткой с подписью и отправил метку на сервер отдельной командой; список изменений версии записан в отдельном файле.", "terms": ["SemVer 1.0.0", "annotated tag", "git push origin v1.0.0", "CHANGELOG"], "model": "Релиз 1.0.0 по SemVer отмечен annotated tag v1.0.0 и отдельно запушен git push origin v1.0.0; изменения описаны в CHANGELOG.md."}, {"t": "sum", "items": ["SemVer: MAJOR.MINOR.PATCH; 1.0.0 первая законченная версия.", "CHANGELOG описывает изменения по версиям; Unreleased для сделанного после.", "Аннотированный тег (-a) неподвижен и хранит автора и сообщение; пушится отдельно.", "README в Markdown; задание требует конкретный набор разделов."]}], "cards": [{"q": "Что значит MAJOR.MINOR.PATCH?", "a": "Несовместимые изменения, новые возможности, исправления (SemVer)."}, {"q": "Аннотированный тег против лёгкого?", "a": "Аннотированный (-a) это объект с автором, датой и сообщением; лёгкий просто имя коммита."}, {"q": "Как отправить тег?", "a": "git push origin v1.0.0 (обычный push теги не отправляет)."}, {"q": "Тег против ветки?", "a": "Тег неподвижен, ветка двигается с каждым коммитом."}, {"q": "Зачем раздел Unreleased в CHANGELOG?", "a": "Для изменений, сделанных после последней версии."}]}, {"id": "t6l5", "title": "Граф твоей лабы: вся картина", "min": 12, "steps": [{"t": "intro", "h": "Финальная проверка", "body": "<p>Задание требует перед сдачей выполнить четыре команды. Препод почти наверняка попросит показать граф и рассказать по нему историю. Соберём всё, что ты знаешь о Git, в один рассказ.<\/p>"}, {"t": "idea", "h": "Четыре команды", "body": "<div class=\"tbl\"><table><tr><th>Команда<\/th><th>Что показывает<\/th><\/tr><tr><td><code>git status<\/code><\/td><td><code>working tree clean<\/code>: всё закоммичено, мусор игнорируется<\/td><\/tr><tr><td><code>git log --oneline --graph --all --decorate<\/code><\/td><td>граф всей истории: по строке на коммит, все ветки, подписи веток и тегов<\/td><\/tr><tr><td><code>git tag<\/code><\/td><td>список тегов: <code>v1.0.0<\/code><\/td><\/tr><tr><td><code>git remote -v<\/code><\/td><td>куда пушим: origin → origin.git (и github → GitHub)<\/td><\/tr><\/table><\/div>"}, {"t": "do", "h": "Выведи свой граф", "task": "Главная команда защиты.", "cmd": "cd ~/Documents/vpd/lab01/dev && git log --oneline --graph --all --decorate", "look": "Два ромба, тег, HEAD -> main, origin/main.", "explain": "<pre class=\"out\">* 90d2b3b (HEAD -&gt; main, origin/main, origin/HEAD, github/main) Add screenshots to README\n* a16919d (tag: v1.0.0) Add CHANGELOG for version 1.0.0\n*   cae5b7f Merge branch 'main' of .../origin\n|\\\n| * 7777f55 Mark project as ready for review\n* | 8a620c6 Update status in README\n|/\n* 6c29f17 Describe build commands ...\n* 0c2e467 ⟦LATE_COMMIT⟧\n*   fd22d8e Merge branch 'feature/⟦br⟧'\n|\\\n| * 6eb3d85 (origin/feature/⟦br⟧, feature/⟦br⟧) Add ⟦BR_EN⟧ implementation\n* | 55121e9 ⟦MAIN_COMMIT⟧\n|/\n* 384a4f5 Add Java and C# implementations\n...\n* 72ec40d Initialize lab project<\/pre>"}, {"t": "order", "q": "Расставь события твоей истории по порядку (снизу графа вверх):", "items": ["Initialize lab project: только README, добавлен по пути", "Коммиты языков и отдельный коммит .gitignore", "Ветка feature/⟦br⟧ и параллельно ⟦MAIN_RU⟧ в main", "Merge feature/⟦br⟧: первый ромб", "⟦LATE_RU⟧, описание в README", "Status по-разному в dev и second_dev, конфликт: второй ромб", "CHANGELOG и аннотированный тег v1.0.0"], "why": "<p>Это и есть рассказ по графу. Читай граф снизу вверх:
